services:
  db:
    # Custom image, not stock postgres:16 directly (2026-09, Backup &
    # DR Phase 2) — adds wal-g + a cron job for daily base backups.
    # See db/Dockerfile's own comments for exactly what's added on
    # top of the official image and why.
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: doi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # wal-g's own env vars (AWS-style names — it speaks the S3 API,
      # and R2 is S3-compatible, so no separate R2-specific SDK or
      # config format exists). Reuses the SAME R2 credentials Phase 1
      # already has in .env — one bucket, one set of keys, two
      # different prefixes inside it (daily/ + monthly/ for pg_dump,
      # wal-archive/ for this).
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: https://${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: auto
      WALG_S3_PREFIX: s3://${R2_BACKUP_BUCKET:-defence-oi-backups}/wal-archive
      WALG_COMPRESSION_METHOD: brotli
    ports:
      - "5432:5432"
    volumes:
      - doi_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/00_roles.sql
    # archive_mode/archive_command enable continuous WAL shipping —
    # wal_level defaults to 'replica' in postgres:16 already, listed
    # explicitly here anyway so the requirement is visible in this
    # file rather than relying on an unstated default. archive_timeout
    # forces a WAL segment switch every 5 minutes even under light
    # write load, so RPO has a real, bounded ceiling (~5 min) instead
    # of "whenever a 16MB segment happens to fill up," which could be
    # hours on a quiet day.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    # No restart policy existed before this — a crashed API process
    # (OOM, an unhandled exception, a host reboot) just stayed down
    # until a human ran `docker compose up` by hand, and any
    # ingestion job that was mid-run when it died stayed stuck in
    # 'running' forever (see _reap_orphaned_ingestion_jobs in
    # app/main.py, added the same day this was). The two fixes are a
    # pair: this makes the container come back up on its own after a
    # crash, that makes it clean up after itself once it does.
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://doi_app:changeme@db:5432/doi
      # Used ONLY by Alembic (see alembic/env.py) — the running app
      # never touches this. doi_app deliberately can't create/alter
      # tables; migrations need a role that can, so they run under
      # postgres instead rather than loosening doi_app's own grants.
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/doi
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env — copy .env.example to .env and fill it in}
      # Reads from your .env file — never hardcode a real key here.
      # Unset by default: /ingestion/sam-gov/run will return a clear
      # 400 error telling you how to get one, rather than crashing.
      SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
      # This is the actual missing piece that caused a real 400 CORS
      # error during frontend testing — having FRONTEND_ORIGIN in
      # .env alone does nothing; Compose only passes a variable into
      # the container if it's explicitly listed here too.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5500}
      # Forgot Password email — same "listed here or Compose won't
      # pass it through" gotcha as FRONTEND_ORIGIN above. Blank
      # SMTP_HOST is fine: the reset link just gets logged instead of
      # emailed (see app/email_sender.py).
      # Rate limits. These were env-configurable in code from the
      # start (see main.py) but were NOT listed here — so setting them
      # in .env silently did nothing and the code defaults always won,
      # exactly the Compose gotcha called out for FRONTEND_ORIGIN
      # above. Listing them makes the configuration real. Defaults
      # match main.py's own, so omitting them changes nothing.
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-300/minute}
      SIGNUP_RATE_LIMIT: ${SIGNUP_RATE_LIMIT:-100/hour}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-200/hour}
      INGESTION_RATE_LIMIT: ${INGESTION_RATE_LIMIT:-5/hour}
      PREVIEW_RATE_LIMIT: ${PREVIEW_RATE_LIMIT:-20/minute}
      PASSWORD_RESET_RATE_LIMIT: ${PASSWORD_RESET_RATE_LIMIT:-5/hour}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@defence-oi.local}
      # Backup & DR Phase 1 (2026-09, see app/backup.py + .env.example
      # for setup instructions) — same "listed here or it silently
      # never reaches the container" rule as every other var above.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-defence-oi-backups}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # Backup & DR Phase 4 (2026-09) — see app/backup.py's _alert().
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # MFA (2026-09, see app/mfa.py + .env.example for setup) — same
      # "listed here or it silently never reaches the container" rule.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # PII encryption-at-rest (2026-09, see app/pii_encryption.py +
      # .env.example for setup) — a DEDICATED key, same "listed here
      # or it silently never reaches the container" rule.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  doi_pgdata:

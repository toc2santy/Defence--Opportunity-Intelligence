  const container = document.getElementById('ingestionControlContainer');
  if(!container) return;
  try{
    const statusResp = await apiFetch('/ingestion/sources/status');
    const sources = statusResp.sources || [];
    const staleSources = sources.filter(s => s.health === 'stale');
    const neverRunSources = sources.filter(s => s.health === 'never_run');

    container.innerHTML = `
      ${(staleSources.length || neverRunSources.length) ? `
        <div class="tag" style="background:rgba(240,140,40,.12);border:1px solid var(--signal);color:var(--signal);margin-bottom:12px;display:block;padding:10px 14px;">
          ⚠ ${staleSources.length ? `${staleSources.length} source${staleSources.length===1?'':'s'} stale (no successful run past its own threshold — check Health column below)` : ''}${staleSources.length && neverRunSources.length ? ' · ' : ''}${neverRunSources.length ? `${neverRunSources.length} never run` : ''}
        </div>` : `
        <div class="tag tag-high" style="margin-bottom:12px;display:block;padding:10px 14px;">✓ All sources healthy — every source has a successful run within its own threshold.</div>`}
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
        <label class="small" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="ingestionSelectAll">
          Select all sources
        </label>
        <button class="btn btn-primary btn-sm" id="runSelectedIngestionBtn" disabled>Run selected</button>
      </div>
      <p class="small" id="runSelectedNote" style="display:none;margin:0 0 10px;"></p>
      <div class="table-scroll" style="overflow-x:hidden;">
        <table class="datatable" style="table-layout:fixed;">
          <thead><tr><th style="width:6%;"></th><th style="width:10%;">Health</th><th style="width:19%;">Source</th><th style="width:19%;">Schedule</th><th style="width:28%;">Last Run</th><th style="width:18%;"></th></tr></thead>
          <tbody>
            ${sources.map(s => {
              // Per-source health (2026-09) — computed by the backend
              // from EVERY job that source ever ran, not from
              // /ingestion/jobs' shared `limit 20` global feed (which
              // is what let eTenders South Africa go silently dead for
              // 3 weeks before anyone noticed by hand — see CLAUDE.md).
              // A real follow-up bug, found live (2026-09): this row's
              // OWN records count kept reading from that same global
              // feed even after everything else here was fixed to read
              // per-source — confirmed live that UK Find a Tender and
              // eTenders South Africa (both real sources, just not in
              // the busiest 20 recent jobs) showed "—" records despite
              // the real number sitting in the per-source health data
              // the whole time. last_records_ingested closes that gap.
              const lastRun = s.last_run_at ? new Date(s.last_run_at).toLocaleString() : '—';
              const lastStatus = s.last_run_status || '—';
              const lastRecords = s.last_records_ingested != null ? s.last_records_ingested : '—';
              const statusColor = s.last_run_status === 'succeeded' ? 'var(--ok, #2a9d64)'
                : s.last_run_status === 'failed' ? 'var(--crit)' : 'inherit';
              const healthMeta = {
                healthy: {color:'var(--ok, #2a9d64)', dot:'●', label:'Healthy'},
                stale:   {color:'var(--signal)', dot:'●', label:'Stale'},
                never_run: {color:'var(--text-faint)', dot:'○', label:'Never run'},
              }[s.health] || {color:'var(--text-faint)', dot:'○', label:s.health};
              const healthTitle = s.health === 'stale'
                ? `No successful run in ${s.hours_since_last_success}h (threshold ${s.health_threshold_hours}h) — this source may be silently dead. Check Run Now / recent error.`
                : s.health === 'never_run'
                ? 'No successful run recorded yet for this source.'
                : `Last successful run ${s.hours_since_last_success}h ago (within its ${s.health_threshold_hours}h threshold).`;
              const runnable = !!INGESTION_RUN_ENDPOINTS[s.code];
              return `
                <tr data-source-code="${s.code}">
                  <td><input type="checkbox" class="ingestion-select-cb" data-code="${s.code}" ${runnable ? '' : 'disabled'}></td>
                  <td class="small" title="${healthTitle}"><span style="color:${healthMeta.color};">${healthMeta.dot}</span> ${healthMeta.label}</td>
                  <td>${s.display_name}</td>
                  <td class="small">${s.scheduled ? 'Scheduled' : 'Not scheduled'}${s.next_run_time ? `<br><span style="color:var(--text-faint);">Next: ${new Date(s.next_run_time).toLocaleString()}</span>` : ''}</td>
                  <td class="small">${lastRun}<br><span style="color:${statusColor};">${lastStatus}${s.last_run_error ? ` — ${s.last_run_error}` : ''}</span><br><span style="color:var(--text-faint);">${lastRecords} record${lastRecords === 1 ? '' : 's'}</span></td>
                  <td>
                    <button class="btn btn-primary btn-sm run-ingestion-btn" data-code="${s.code}" ${runnable ? '' : 'disabled'}>Run Now</button>
                  </td>
                </tr>
                <tr class="run-ingestion-error-row" data-error-for="${s.code}" style="display:none;">
                  <td colspan="6"><p class="auth-error" style="display:block;margin:6px 0 0;"></p></td>
                </tr>
                <tr class="source-detail-row" data-detail-for="${s.code}" style="display:none;">
                  <td colspan="6" style="background:var(--panel-alt);"></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    container.querySelectorAll('.run-ingestion-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const code = btn.dataset.code;
        const endpoint = INGESTION_RUN_ENDPOINTS[code];
        const errorRow = container.querySelector(`.run-ingestion-error-row[data-error-for="${code}"]`);
        const errorBox = errorRow ? errorRow.querySelector('.auth-error') : null;
        if(errorRow) errorRow.style.display = 'none';
        if(!endpoint) return;
        btn.disabled = true;
        const originalLabel = btn.textContent;
        const timer = startElapsedTimer(t => { btn.textContent = `Running… ${t}`; });
        try{
          const result = await apiFetch(endpoint.path, {
            method: 'POST',
            body: JSON.stringify(endpoint.body),
          });
          const took = timer.stop();
          await loadIngestionStatus();
          const note = document.getElementById('runSelectedNote');
          if(note){
            note.style.display = 'block';
            note.textContent = `${code}: ${result?.records_ingested ?? '?'} records in ${took}`
              + (result?.rows_examined != null ? ` (${result.rows_examined} tenders examined)` : '')
              + ((result?.errors || []).length ? ` · ${result.errors.join('; ')}` : '');
          }
        }catch(err){
          timer.stop();
          btn.disabled = false;
          btn.textContent = originalLabel;
          if(errorBox && errorRow){
            errorBox.textContent = err.message;
            errorRow.style.display = 'table-row';
          }else{
            alert(err.message);
          }
        }
      });
    });

    // --- multi-select: tick sources, run them in one go ---------------
    const selectAll = document.getElementById('ingestionSelectAll');
    const runSelectedBtn = document.getElementById('runSelectedIngestionBtn');
    const runSelectedNote = document.getElementById('runSelectedNote');
    const checkboxes = [...container.querySelectorAll('.ingestion-select-cb')];

    function syncRunSelectedState(){
      const checked = checkboxes.filter(cb => cb.checked);
      runSelectedBtn.disabled = checked.length === 0;
      runSelectedBtn.textContent = checked.length > 1
        ? `Run selected (${checked.length})` : 'Run selected';
    }

    // Ticking a source also reveals the tenders it has actually
    // ingested — a record count alone doesn't tell an admin whether
    // a run brought in anything worth having.
    async function showSourceDetail(code, show){
      const detailRow = container.querySelector(`.source-detail-row[data-detail-for="${code}"]`);
      if(!detailRow) return;
      const cell = detailRow.querySelector('td');
      if(!show){ detailRow.style.display = 'none'; return; }

      detailRow.style.display = 'table-row';
      cell.innerHTML = '<p class="small" style="margin:8px 0;">Loading tenders…</p>';
      try{
        const data = await apiFetch(`/ingestion/sources/${encodeURIComponent(code)}/programmes?limit=25`);
        const list = data.programmes || [];
        if(list.length === 0){
          cell.innerHTML = '<p class="small" style="margin:8px 0;">No tenders ingested from this source yet — run it above.</p>';
          return;
        }
        cell.innerHTML = `
          <p class="small" style="margin:8px 0 6px;">
            Showing ${list.length} of ${data.total} ingested from <b>${data.display_name}</b>
          </p>
          <div class="table-scroll">
            <table class="datatable">
              <thead><tr><th>Reference</th><th>Tender</th><th>Organisation</th><th>Country</th><th>Closing</th></tr></thead>
              <tbody>${list.map(p => `
                <tr>
                  <td class="mono small">${p.external_ref || '—'}</td>
                  <td>${p.name || '—'}</td>
                  <td class="small">${p.organization_name || '—'}</td>
                  <td class="small">${p.country || '—'}</td>
                  <td class="small">${p.response_deadline
                    ? new Date(p.response_deadline).toLocaleString() : '—'}</td>
                </tr>`).join('')}</tbody>
            </table>
          </div>`;
      }catch(err){
        cell.innerHTML = `<p class="small" style="color:var(--crit);margin:8px 0;">Couldn't load tenders: ${err.message}</p>`;
      }
    }

    checkboxes.forEach(cb => cb.addEventListener('change', () => {
      const selectable = checkboxes.filter(c => !c.disabled);
      selectAll.checked = selectable.length > 0 && selectable.every(c => c.checked);
      syncRunSelectedState();
      showSourceDetail(cb.dataset.code, cb.checked);
    }));

    selectAll?.addEventListener('change', () => {
      checkboxes.forEach(cb => {
        if(cb.disabled) return;
        cb.checked = selectAll.checked;
        showSourceDetail(cb.dataset.code, cb.checked);
      });
      syncRunSelectedState();
    });

    runSelectedBtn?.addEventListener('click', async () => {
      const codes = checkboxes.filter(cb => cb.checked).map(cb => cb.dataset.code);
      if(codes.length === 0) return;

      runSelectedBtn.disabled = true;
      selectAll.disabled = true;
      checkboxes.forEach(cb => cb.disabled = true);
      container.querySelectorAll('.run-ingestion-btn').forEach(b => b.disabled = true);
      runSelectedNote.style.display = 'block';

      // Sequential, never parallel: these endpoints share one
      // IP-keyed rate-limit budget, and CPPP alone takes ~45s.
      // Firing them at once would just trip 429s.
      const results = [];
      for(let i = 0; i < codes.length; i++){
        const code = codes[i];
        const endpoint = INGESTION_RUN_ENDPOINTS[code];
        if(!endpoint) continue;
        const timer = startElapsedTimer(t => {
          runSelectedNote.textContent =
            `Running ${i + 1} of ${codes.length}: ${code} — ${t} elapsed. `
            + `Government portals are rate-limited, so this is paced deliberately. Please wait…`;
        });
        try{
          const result = await apiFetch(endpoint.path, {
            method: 'POST',
            body: JSON.stringify(endpoint.body),
          });
          results.push(`${code}: ${result?.records_ingested ?? '?'} records in ${timer.stop()}`);
        }catch(err){
          // One source failing must not abandon the rest of the run.
          results.push(`${code}: failed after ${timer.stop()} — ${err.message}`);
        }
      }

      // Reload first — it rebuilds this whole panel, which destroys
      // the note element we're holding — then write the summary into
      // the freshly-rendered one.
      await loadIngestionStatus();
      const freshNote = document.getElementById('runSelectedNote');
      if(freshNote){
        freshNote.style.display = 'block';
        freshNote.textContent = results.join('  ·  ');
      }
    });

    syncRunSelectedState();
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load ingestion status: ${err.message}</p>`;
  }
}

async function loadTaxonomyDetail(){
  const container = document.getElementById('taxonomyDetailContainer');
  if(!container || !selectedTaxonomyId) return;
  try{
    const [items, keywords] = await Promise.all([
      apiFetch('/admin/taxonomy'),
      apiFetch(`/admin/taxonomy/${selectedTaxonomyId}/keywords`),
    ]);
    const entry = items.find(t => t.id === selectedTaxonomyId);
    if(!entry){
      container.innerHTML = '<p class="small" style="color:var(--crit);">Category not found.</p>';
      return;
    }
    container.innerHTML = `
      <h2>${entry.label}</h2>
      <p class="small mono">${entry.code} · ${entry.sector}</p>
      ${entry.description ? `<p class="small">${entry.description}</p>` : ''}
      <div class="panel" style="margin:20px 0;">
        <h3 style="margin-bottom:12px;">Add a Keyword</h3>
        <form id="addKeywordForm">
          <div class="form-grid">
            <div class="form-field"><label>Keyword or phrase</label><input id="kf-keyword" type="text" required placeholder="passive sonar"></div>
            <div class="form-field"><label>Weight (1–5, 3=strong, 1=generic)</label><input id="kf-weight" type="number" min="1" max="5" value="2"></div>
          </div>
          <div class="auth-error" id="keywordFormError"></div>
          <button type="submit" class="btn btn-primary btn-sm">Add Keyword</button>
        </form>
      </div>
      <h3 style="margin-bottom:10px;">Keywords</h3>
      ${keywords.length === 0 ? '<p class="small">No keywords yet — nothing will match this category until you add some above.</p>' : `
        <div class="table-scroll"><table class="datatable">
          <thead><tr><th>Keyword</th><th>Weight</th><th></th></tr></thead>
          <tbody>${keywords.map(k=>`
            <tr><td>${k.keyword}</td><td>${k.weight}</td>
            <td><button class="btn btn-ghost btn-sm remove-keyword-btn" data-id="${k.id}">Remove</button></td></tr>
          `).join('')}</tbody>
        </table></div>
      `}
    `;

    document.getElementById('addKeywordForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('keywordFormError');
      errorBox.style.display = 'none';
      const keyword = document.getElementById('kf-keyword').value;
      const weight = Number(document.getElementById('kf-weight').value) || 1;
      try{
        await apiFetch(`/admin/taxonomy/${selectedTaxonomyId}/keywords`, {
          method:'POST',
          body: JSON.stringify({keyword, weight}),
        });
        await loadTaxonomyDetail();
      }catch(err){
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    container.querySelectorAll('.remove-keyword-btn').forEach(btn=>{
      btn.addEventListener('click', async () => {
        try{
          await apiFetch(`/admin/taxonomy/keywords/${btn.dataset.id}`, {method:'DELETE'});
          await loadTaxonomyDetail();
        }catch(err){ alert(err.message); }
      });
    });
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`;
  }
}

function initTaxonomyAdminHandlers(){
  if(!currentUser?.is_platform_admin) return; // access-restricted view has nothing to wire up

  document.getElementById('backToTaxonomyBtn')?.addEventListener('click', () => {
    selectedTaxonomyId = null;
    render();
  });

  const createForm = document.getElementById('createTaxonomyForm');
  if(createForm){
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('taxonomyFormError');
      errorBox.style.display = 'none';
      const code = document.getElementById('tf-code').value;
      const label = document.getElementById('tf-label').value;
      const sector = document.getElementById('tf-sector').value;
      const description = document.getElementById('tf-description').value;
      try{
        await apiFetch('/admin/taxonomy', {
          method:'POST',
          body: JSON.stringify({code, label, sector, description: description || null}),
        });
        createForm.reset();
        await loadTaxonomyList();
      }catch(err){
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  }

  if(selectedTaxonomyId){
    loadTaxonomyDetail();
  } else {
    loadIngestionStatus();
    loadTaxonomyList();
  }
}

/* ============================================================
   USER MANAGEMENT — platform-admin only, same gate as Taxonomy
   Admin. GET /platform-admin/users lists real accounts across
   EVERY tenant (excluding pytest's own throwaway "Test Company
   <hex>" tenants by default — see that route's own docstring in
   main.py); search reaches them anyway if truly needed. Built so a
   platform admin can help a locked-out user by SEARCHING AND
   SELECTING them, rather than needing to already know their exact
   email — the free-text-only version of this lived briefly on the
   Taxonomy Admin page before being moved to its own tab.
   ============================================================ */
// Embedded as the LAST panel on the Company Profile page
// (#cp-users), platform-admin-only — not its own top-nav tab.
// Originally was one (moved here 2026-09-23 after the user pointed
// out this is where account-level admin tools belong, since password
// reset and — later — per-user activity monitoring logs are both
// "manage a user," not "manage taxonomy"). Kept as its own set of
// functions (renderUserManagementPanel/loadUserManagement/
// triggerUserManagementReset/initUserManagementHandlers) rather than
// folded into the *CompanyAdmin functions, since this is the one
// panel on that page that isn't about THIS tenant's own profile —
// keeping it separate makes that boundary obvious in the code, not
// just the UI.
function renderUserManagementPanel(){
  return `
    <div class="form-field"><label>Search (email or company)</label><input id="umSearchInput" type="text" placeholder="Start typing to search…"></div>
    <div id="umResetResult" style="display:none;margin-bottom:14px;" class="panel">
      <p class="small" style="color:var(--low);margin-bottom:6px;">Reset link generated for <b id="umResetForEmail"></b> — expires in <span id="umResetExpiry"></span> minutes. Also emailed if SMTP is configured (see the API console log otherwise).</p>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="umResetLink" type="text" readonly style="font-family:var(--font-mono);font-size:.78rem;">
        <button type="button" class="btn btn-ghost btn-sm" id="umResetCopyBtn">Copy</button>
      </div>
    </div>
    <div class="auth-error" id="umError"></div>
    <div id="umUserTable"><p class="small">Loading…</p></div>
  `;
}

async function loadUserManagement(search){
  const container = document.getElementById('umUserTable');
  const errorBox = document.getElementById('umError');
  if(!container) return;
  errorBox.style.display = 'none';
  try{
    const qs = search ? `?search=${encodeURIComponent(search)}&limit=100` : '?limit=100';
    const result = await apiFetch(`/platform-admin/users${qs}`);
    if(!result.users.length){
      container.innerHTML = `<p class="small" style="color:var(--text-faint);">No accounts match.</p>`;
      return;
    }
    container.innerHTML = `
      <p class="small" style="color:var(--text-faint);margin-bottom:10px;">${result.returned} account${result.returned === 1 ? '' : 's'}${search ? ' matching your search' : ' (test tenants excluded — search reaches them if needed)'}.</p>
      <div class="table-scroll"><table class="datatable">
        <thead><tr><th>Email</th><th>Name</th><th>Company</th><th>Role</th><th>Status</th><th>2FA</th><th></th><th></th><th></th><th></th></tr></thead>
        <tbody>
          ${result.users.map(u => {
            const lockedUntil = u.locked_until ? new Date(u.locked_until) : null;
            const isLocked = lockedUntil && lockedUntil > new Date();
            const statusHtml = !u.is_active
              ? '<span style="color:var(--crit);">Blocked</span>'
              : isLocked
                ? `<span style="color:var(--crit);">Locked until ${lockedUntil.toLocaleTimeString()}</span>`
                : '<span style="color:var(--low);">Active</span>';
            return `
            <tr>
              <td>${escapeHtml(u.email)}</td>
              <td>${u.full_name ? escapeHtml(u.full_name) : '—'}</td>
              <td>${escapeHtml(u.tenant_name)}</td>
              <td>${escapeHtml(u.role_name)}</td>
              <td>${statusHtml}</td>
              <td>${u.mfa_enabled ? 'On' : '—'}</td>
              <td><button type="button" class="btn btn-ghost btn-sm umActivityBtn" data-id="${u.id}" data-email="${escapeHtml(u.email)}">Activity</button></td>
              <td><button type="button" class="btn btn-ghost btn-sm umResetBtn" data-email="${escapeHtml(u.email)}">Reset Password</button></td>
              <td>${u.is_active
                ? `<button type="button" class="btn btn-ghost btn-sm umBlockBtn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="color:var(--crit);">Block</button>`
                : `<button type="button" class="btn btn-ghost btn-sm umUnblockBtn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="color:var(--low);">Unblock</button>`}</td>
              <td>${isLocked
                ? `<button type="button" class="btn btn-ghost btn-sm umUnlockBtn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="color:var(--low);">Unlock</button>`
                : ''}</td>
            </tr>
          `;}).join('')}
        </tbody>
      </table></div>
    `;
    container.querySelectorAll('.umActivityBtn').forEach(btn => {
      btn.addEventListener('click', () => showUserActivityLog(btn.dataset.id, btn.dataset.email));
    });
    container.querySelectorAll('.umResetBtn').forEach(btn => {
      btn.addEventListener('click', () => triggerUserManagementReset(btn.dataset.email));
    });
    container.querySelectorAll('.umBlockBtn').forEach(btn => {
      btn.addEventListener('click', () => triggerUserManagementBlock(btn.dataset.id, btn.dataset.email, search));
    });
    container.querySelectorAll('.umUnblockBtn').forEach(btn => {
      btn.addEventListener('click', () => triggerUserManagementUnblock(btn.dataset.id, btn.dataset.email, search));
    });
    container.querySelectorAll('.umUnlockBtn').forEach(btn => {
      btn.addEventListener('click', () => triggerUserManagementUnlock(btn.dataset.id, btn.dataset.email, search));
    });
  }catch(err){
    errorBox.textContent = err.message || 'Could not load users.';
    errorBox.style.display = 'block';
  }
}

async function triggerUserManagementReset(email){
  const errorBox = document.getElementById('umError');
  const resultBox = document.getElementById('umResetResult');
  errorBox.style.display = 'none';
  if(!confirm(`Generate a password-reset link for ${email}? They will need to use it to sign in again.`)) return;
  try{
    const result = await apiFetch('/platform-admin/users/reset-password', {
      method: 'POST',
      body: JSON.stringify({ email }),
    });
    document.getElementById('umResetForEmail').textContent = email;
    document.getElementById('umResetLink').value = result.reset_link;
    document.getElementById('umResetExpiry').textContent = result.expires_in_minutes;
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(err){
    errorBox.textContent = err.message || 'Could not generate a reset link.';
    errorBox.style.display = 'block';
  }
}

async function triggerUserManagementBlock(userId, email, currentSearch){
  const errorBox = document.getElementById('umError');
  errorBox.style.display = 'none';
  if(!confirm(`Block ${email}? They will not be able to sign in again until you unblock them — their data is untouched.`)) return;
  try{
    await apiFetch(`/platform-admin/users/${userId}/block`, { method: 'POST' });
    await loadUserManagement(currentSearch);
  }catch(err){
    errorBox.textContent = err.message || 'Could not block this account.';
    errorBox.style.display = 'block';
  }
}

async function triggerUserManagementUnblock(userId, email, currentSearch){
  const errorBox = document.getElementById('umError');
  errorBox.style.display = 'none';
  try{
    await apiFetch(`/platform-admin/users/${userId}/unblock`, { method: 'POST' });
    await loadUserManagement(currentSearch);
  }catch(err){
    errorBox.textContent = err.message || 'Could not unblock this account.';
    errorBox.style.display = 'block';
  }
}

// A separate action from unblock above — a lockout is the login
// route's own temporary state after too many wrong passwords, not
// the admin's deliberate block/unblock decision.
async function triggerUserManagementUnlock(userId, email, currentSearch){
  const errorBox = document.getElementById('umError');
  errorBox.style.display = 'none';
  try{
    await apiFetch(`/platform-admin/users/${userId}/unlock`, { method: 'POST' });
    await loadUserManagement(currentSearch);
  }catch(err){
    errorBox.textContent = err.message || 'Could not unlock this account.';

}

// Read-only, so showInfoModal's own close-on-Continue behaviour is
// fine here (unlike the MFA setup wizard above, there's no form
// input to preserve across a step) — reuses it rather than the
// bespoke MFA modal machinery.
// Each changed field gets its OWN line ("field: old → new"), not one
// long comma-joined run-on string — the original version packed every
// field from before_state/after_state into a single cell, which is
// exactly what read as "overlapping, can't understand" in a narrow
// column once a row had more than one or two changed fields.
function _activityStateLines(before, after){
  const keys = new Set([...(before ? Object.keys(before) : []), ...(after ? Object.keys(after) : [])]);
  if(!keys.size) return [];
  return [...keys].map(k => {
    const b = before ? before[k] : undefined;
    const a = after ? after[k] : undefined;
    if(b !== undefined && a !== undefined) return `${k}: ${JSON.stringify(b)} → ${JSON.stringify(a)}`;
    if(a !== undefined) return `${k}: ${JSON.stringify(a)}`;
    return `${k}: ${JSON.stringify(b)}`;
  });
}

// A dedicated near-full-screen overlay, not showInfoModal's fixed
// 580px box — a 4-column table (timestamp, action, entity, a
// per-field change list) genuinely needs the room; cramming it into
// a narrow modal was the actual cause of the "text overlapping,
// can't read it" report, not a rendering bug.
function _activityModalOverlay(){
  let overlay = document.getElementById('activityModalOverlay');
  if(overlay) return overlay;
  overlay = document.createElement('div');
  overlay.className = 'info-modal-overlay';
  overlay.id = 'activityModalOverlay';
  overlay.innerHTML = `<div class="info-modal" id="activityModalContent" style="max-width:1200px;width:95vw;max-height:92vh;"></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeActivityModal(); });
  return overlay;
}

function closeActivityModal(){
  document.getElementById('activityModalOverlay')?.remove();
}

  setContent('<p class="small">Loading…</p>');

    const body = result.entries.length ? `
      <p class="small" style="color:var(--text-faint);margin-bottom:10px;">${result.returned} entr${result.returned === 1 ? 'y' : 'ies'}, most recent first.</p>
      <div class="table-scroll" style="max-height:72vh;overflow-y:auto;">
        <table class="datatable" style="table-layout:fixed;width:100%;">
          <colgroup><col style="width:160px;"><col style="width:200px;"><col style="width:120px;"><col></colgroup>

              return `
              <tr>
                <td class="small" style="white-space:nowrap;">${new Date(e.created_at).toLocaleString()}</td>
                <td class="small" style="word-break:break-word;">${escapeHtml(e.action)}</td>
                <td class="small">${e.entity_type ? escapeHtml(e.entity_type) : '—'}</td>

                  ${lines.length ? lines.map(l => `<div>${escapeHtml(l)}</div>`).join('') : '—'}

            `;}).join('')}
          </tbody>
        </table>
      </div>
    ` : `<p class="small" style="color:var(--text-faint);">No recorded activity for this account yet.</p>`;
    setContent(body);
  }catch(err){
    setContent(`<p class="small" style="color:var(--crit);">Could not load: ${err.message}</p>`);
  }
}

/* ---------- Live-stat drill-downs ----------
   Each homepage KPI number is clickable, and opens the real rows
   behind it (GET /public/stat-detail — no login needed). The point is
   that a visitor can verify the number rather than trust it.

   What deliberately is NOT in these tables: a tender's apply link, its
   procurement contact, or any score against the visitor's own product.
   Those need an account — which is exactly what the modal's CTA
   offers, and what the backend endpoint's docstring pins down. */
const STAT_DETAIL_META = {
  tenders: {
    title: 'Live tenders currently tracked',
    intro: 'The most recently updated real tenders in the database, straight from the ten government sources. Sign up to see which of these match your own product.',
    columns: [
      ['name', 'Tender'], ['country', 'Country'],
      ['source_name', 'Source'], ['stage', 'Stage'], ['response_deadline', 'Closing'],
    ],
  },
  countries: {
    title: 'Countries with live tender coverage',
    intro: 'Every country with at least one real ingested tender, and how many. Counts come from the same records the matching engine searches.',
    columns: [['country', 'Country'], ['tender_count', 'Tenders']],
  },
  sources: {
    title: 'Live government sources',
    intro: 'Each source is an official government procurement feed, ingested on a schedule. "Last ingested" is a real timestamp from the last successful run.',
    columns: [
      ['source_name', 'Source'], ['tender_count', 'Tenders'], ['last_ingested', 'Last ingested'],
    ],
  },
  buyers: {
    title: 'Buying organisations',
    intro: 'The most active government buyers across all ten sources, ranked by how many tenders they have published.',
    columns: [
      ['organisation', 'Organisation'], ['country', 'Country'], ['tender_count', 'Tenders'],
    ],
  },
};

function _statCell(key, value){
  if(value === null || value === undefined || value === '') return '—';
  if(key === 'country') return displayCountryName(value);
  if(key === 'response_deadline' || key === 'last_ingested'){
    const d = new Date(value);
    return isNaN(d) ? value : d.toLocaleDateString();
  }
  if(key === 'stage') return String(value).replace(/_/g, ' ');
  if(key === 'tender_count') return Number(value).toLocaleString();
  return value;
}

async function showStatDetail(metric){
  const meta = STAT_DETAIL_META[metric];
  if(!meta) return;
  showInfoModal(meta.title, '<p class="small">Loading live records…</p>', null, 'Close');
  try{
    const data = await apiFetch(`/public/stat-detail?metric=${encodeURIComponent(metric)}`);
    const body = `
      <p class="small" style="margin-bottom:12px;">${meta.intro}</p>
      <div class="table-scroll" style="max-height:340px;overflow-y:auto;">
        <table class="datatable">
          <thead><tr>${meta.columns.map(([, label]) => `<th>${label}</th>`).join('')}</tr></thead>
          <tbody>${data.rows.map(r => `
            <tr>${meta.columns.map(([key]) => `<td class="small">${_statCell(key, r[key])}</td>`).join('')}</tr>
          `).join('')}</tbody>
        </table>
      </div>
      <p class="small" style="margin-top:12px;color:var(--text-faint);">
        Showing ${data.showing} live record${data.showing === 1 ? '' : 's'}, read from the database just now.
        ${metric === 'tenders' || metric === 'buyers' ? 'Capped for the public view — the full set, plus which ones fit your product, needs a free account.' : ''}
      </p>`;
    // Re-open with the loaded content: the placeholder modal above is
    // replaced rather than mutated, so the CTA button can carry its
    // own action once there's actually something to act on.
    document.querySelector('.info-modal-overlay')?.remove();
    showInfoModal(meta.title, body, () => {
      if(currentUser){ appMode = 'dashboard'; render(); }
      else { showAuthOverlay(); renderAuthScreen('signup'); }
    }, currentUser ? 'Open Opportunity Intel' : 'Match this against my product — free');
  }catch(err){
    document.querySelector('.info-modal-overlay')?.remove();
    showInfoModal(meta.title, `<p class="small" style="color:var(--crit);">Couldn't load the records: ${err.message}</p>`, null, 'Close');
  }
}

/* ============================================================
   ARCHITECTURE MAP — one pictorial block diagram of the whole
   pipeline (sources -> ingestion -> human-confirmed capability ->
   matching -> opportunities -> the ten engines -> Path to Contract /
   Company Profile), built for explaining the system to someone in a
   single glance, the way a SOC analyser's flow diagram does — boxes
   and arrows, not paragraphs.

   Built programmatically (nodes + edges data, not hand-typed SVG
   coordinates) so positions stay consistent and a node can be added/
   moved by editing one array entry rather than recalculating arrow
   endpoints by hand throughout a giant SVG string.
   ============================================================ */
// Row 1 data — the real ingestion sources, kept as its own list
// (rather than inline in ARCH_NODES) specifically so adding an 11th
// (or 12th...) source later is a ONE-LINE addition here, not a
// manual x/y recalculation across the whole diagram: SOURCE_ROW below
// computes each box's x from its index and the row's own total
// width, so the row always re-spaces itself evenly across the same
// 1040px span no matter how many entries this list holds.
// sourceFullName matches exactly what programme_matching.py's trace
// reports in trace.sources_touched (the sources table's real `name`
// column) — that's how the checkmark overlay below knows which of
// these boxes genuinely contributed to the last real match.
const ARCH_SOURCES = [
  { id:'src-sam',  title:'SAM.gov',            sub:'United States',  color:'cyan',   sourceFullName:'SAM.gov Contract Opportunities API' },
  { id:'src-uk',   title:'UK Find a Tender',   sub:'United Kingdom', color:'blue',   sourceFullName:'UK Find a Tender Service' },
  { id:'src-ted',  title:'EU TED',             sub:'27 EU countries',color:'teal',   sourceFullName:'EU TED (Tenders Electronic Daily)' },
  { id:'src-cppp', title:'CPPP',               sub:'India',          color:'mint',   sourceFullName:'CPPP (Central Public Procurement Portal, India)' },
  { id:'src-cb',   title:'CanadaBuys',         sub:'Canada',         color:'amber',  sourceFullName:'CanadaBuys (Government of Canada)' },
  { id:'src-sa',   title:'eTenders SA',        sub:'South Africa',   color:'coral',  sourceFullName:'eTenders South Africa (National Treasury)' },
  { id:'src-co',   title:'SECOP II',           sub:'Colombia',       color:'violet', sourceFullName:'SECOP II (Colombia Compra Eficiente)' },
  { id:'src-ua',   title:'ProZorro',           sub:'Ukraine',        color:'rose',   sourceFullName:'ProZorro (Ukraine Public Procurement)' },
  { id:'src-au',   title:'AusTender',          sub:'Australia',      color:'blue',   sourceFullName:'AusTender (Australian Government)' },
  { id:'src-py',   title:'DNCP',               sub:'Paraguay',       color:'teal',   sourceFullName:'DNCP Paraguay (Dirección Nacional de Contrataciones Públicas)' },
  // Next source goes here — one line, nothing else in this file needs
  // touching. SOURCE_ROW_X/SOURCE_ROW_W below recompute automatically;
  // ARCH_EDGES' source->ingest fan-in is generated from ARCH_SOURCES'
  // ids too (see below), so a new id is wired in for free.
];
const SOURCE_ROW_X = 20, SOURCE_ROW_W = 1040, SOURCE_ROW_GAP = 4;
const SOURCE_BOX_W = (SOURCE_ROW_W - SOURCE_ROW_GAP * (ARCH_SOURCES.length - 1)) / ARCH_SOURCES.length;
const ARCH_SOURCE_NODES = ARCH_SOURCES.map((s, i) => ({
  ...s, x: SOURCE_ROW_X + i * (SOURCE_BOX_W + SOURCE_ROW_GAP), y: 20, w: SOURCE_BOX_W, h: 60,
}));

const ARCH_NODES = [
  ...ARCH_SOURCE_NODES,

  // Ingestion + shared reference data
  { id:'ingest',  x:20, y:130, w:1040, h:60, title:'INGESTION AND NORMALIZATION', sub:'defence-relevance filter · NAICS / CPV / UNSPSC / org-sentinel classification codes', variant:'wide', color:'violet' },
  { id:'shared',  x:20, y:230, w:1040, h:60, title:'SHARED REFERENCE DATA', sub:'programmes · organizations · evidence — every claim carries a source and a confidence', variant:'wide', color:'rose' },

  // Human-in-the-loop branch, left column
  { id:'product',    x:20, y:340, w:300, h:55, title:'YOUR PRODUCT', sub:'what you actually build', color:'blue' },
  { id:'ai-suggest', x:20, y:425, w:300, h:55, title:'⭐ SOFTWARE-SUGGESTED CAPABILITY', sub:'a suggestion, not a conclusion', color:'teal' },

// The core boxes a real product-to-programme match genuinely
// executes, every time — distinct from the ten engines and the
// facilitation layer below matching, which are on-demand views a
// customer opens separately and did NOT run as part of that specific
// match call. Only these (plus whichever source boxes actually
// contributed candidate programmes, checked via sourceFullName
// against the live trace) get the ✓ checkmark — see
// _archCheckedNodeIds() and lastMatchTrace's declaration for why
// this deliberately stops short of lighting up all 26 boxes.
const ARCH_CORE_PIPELINE_IDS = new Set(['ingest', 'shared', 'product', 'ai-suggest', 'confirm', 'matching', 'oppty']);

function _archCheckedNodeIds(){
  if(!lastMatchTrace) return new Set();
  const touched = new Set(lastMatchTrace.sources_touched || []);
  const ids = new Set(ARCH_CORE_PIPELINE_IDS);
  ARCH_NODES.forEach(n => {
    if(n.sourceFullName && touched.has(n.sourceFullName)) ids.add(n.id);
  });
  return ids;
}

const ARCH_EDGES = [
  ...ARCH_SOURCES.map(s => ({ from:s.id, to:'ingest', fromSide:'bottom', toSide:'top' })),
  { from:'ingest', to:'shared', fromSide:'bottom', toSide:'top' },
  { from:'shared', to:'matching', fromSide:'bottom', toSide:'top', anchorX:700 },
  { from:'product', to:'ai-suggest', fromSide:'bottom', toSide:'top' },
  { from:'ai-suggest', to:'confirm', fromSide:'bottom', toSide:'top' },
  { from:'confirm', to:'matching', fromSide:'bottom', toSide:'top', anchorX:170 },
  { from:'matching', to:'oppty', fromSide:'bottom', toSide:'top' },
  { from:'oppty', to:'e-cust', fromSide:'bottom', toSide:'top', anchorX:118 },
  { from:'oppty', to:'e-proc', fromSide:'bottom', toSide:'top', anchorX:962 },
  { from:'e-eng', to:'p2c', fromSide:'bottom', toSide:'top' },
  { from:'e-score', to:'profile', fromSide:'bottom', toSide:'top' },
  { from:'p2c', to:'won', fromSide:'bottom', toSide:'top', anchorX:275 },
  { from:'profile', to:'won', fromSide:'bottom', toSide:'top', anchorX:805 },
];

function _archNode(id){ return ARCH_NODES.find(n => n.id === id); }

function _archAnchor(node, side){
  if(side === 'top') return { x: node.x + node.w/2, y: node.y };
  if(side === 'bottom') return { x: node.x + node.w/2, y: node.y + node.h };
  if(side === 'left') return { x: node.x, y: node.y + node.h/2 };
  return { x: node.x + node.w, y: node.y + node.h/2 };
}

function renderArchitectureSVG(){
  const checkedIds = _archCheckedNodeIds();
  const boxes = ARCH_NODES.map(n => {
    // Colour comes from the node's own `color` field (one of the
    // site's existing 8 --hue-* accents) for every plain/wide box —
    // 'gate' and 'highlight' override it with their own fixed,
    // meaningful colour (amber = the human gate, green =
    // facilitation), which the legend under the diagram explains, so
    // those two variants deliberately do NOT get the rotating palette.
    const boxColor = n.variant === 'gate' ? 'var(--signal)' : (n.variant === 'highlight' ? 'var(--low)' : `var(--hue-${n.color || 'cyan'})`);
    const strokeWidth = n.variant === 'gate' ? 2.5 : (n.variant === 'highlight' ? 2 : 1.5);
    const variantStyle = `fill:var(--panel);stroke:${boxColor};stroke-width:${strokeWidth};`;
    const titleColor = boxColor;
    // A small green checkmark badge in the top-right corner — only on
    // boxes _archCheckedNodeIds() actually verified ran (or, for the
    // ten sources, genuinely contributed a candidate programme) during
    // the most recent real match. No badge at all until a match has
    // actually been run this session (lastMatchTrace is null), and no
    // badge on any box that didn't really participate — see that
    // function's own comment for exactly which boxes qualify and why.
    const isChecked = checkedIds.has(n.id);
    const badge = isChecked ? `
        <circle cx="${n.x + n.w - 11}" cy="${n.y + 11}" r="9" fill="var(--low)"></circle>
        <path d="M${n.x + n.w - 15},${n.y + 11} l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>` : '';
    return `
      <g>
        <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" style="${variantStyle}"></rect>
        <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" style="fill:${boxColor};opacity:0.08;"></rect>
        <text x="${n.x + n.w/2}" y="${n.y + (n.sub ? 24 : n.h/2 + 5)}" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;fill:${titleColor};">${n.title}</text>
        ${n.sub ? `<text x="${n.x + n.w/2}" y="${n.y + 42}" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:var(--text-faint);">${_archWrap(n.sub, n.w, n.x + n.w/2)}</text>` : ''}
        ${badge}
      </g>`;
  }).join('');

  const arrows = ARCH_EDGES.map(e => {
    const fromNode = _archNode(e.from), toNode = _archNode(e.to);
    let start = _archAnchor(fromNode, e.fromSide);
    let end = _archAnchor(toNode, e.toSide);
    if(e.anchorX){ start = { ...start, x: e.anchorX }; end = { ...end, x: e.anchorX }; }
    if(start.x === end.x){
      return `<line x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}" stroke="var(--hue-cyan)" stroke-width="1.5" marker-end="url(#archArrow)"></line>`;
    }
    // Orthogonal (L-shaped) elbow instead of a raw diagonal for any
    // edge whose two ends don't already share an x — the 10-way
    // source fan-in into INGESTION and the two facilitation-layer
    // edges (Engagement->Path to Contract, Scoring->Profile) are the
    // real cases this applies to. Bends halfway down the vertical
    // gap between the two boxes, the standard flowchart connector
    // shape, rather than a straight line between two box centers.
    const midY = start.y + (end.y - start.y) / 2;
    const d = `M${start.x},${start.y} L${start.x},${midY} L${end.x},${midY} L${end.x},${end.y}`;
    return `<path d="${d}" fill="none" stroke="var(--hue-cyan)" stroke-width="1.5" marker-end="url(#archArrow)"></path>`;
  }).join('');

  return `
    <svg viewBox="0 0 1080 1140" style="width:100%;height:auto;">
      <defs>
        <marker id="archArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--hue-cyan)"></path>
        </marker>
      </defs>
      ${arrows}
      ${boxes}
    </svg>`;
}

// Crude word-wrap for SVG sub-labels — SVG <text> doesn't wrap on its
// own, and these sublines are long enough to overrun a narrow box
// without it. Splits into <tspan> rows at roughly one character per
// 5.3px (this font/size), never more than 2 rows since a third would
// run outside a short box's height.
function _archWrap(str, boxWidth, centerX){
  const charsPerLine = Math.max(10, Math.floor(boxWidth / 5.3));
  const words = str.split(' ');
  const lines = [];
  let current = '';
  for(const w of words){
    if((current + ' ' + w).trim().length > charsPerLine && current){
      lines.push(current.trim());
      current = w;
    } else {
      current = (current + ' ' + w).trim();
    }
  }
  if(current) lines.push(current);
  const capped = lines.slice(0, 2);
  return capped.map((line, i) => `<tspan x="${centerX}" dy="${i === 0 ? 0 : 11}">${line}</tspan>`).join('');
}

async function loadIndustriesSectorCoverage(){
  const grid = document.getElementById('sectorCardsGrid');
  if(!grid) return;
  let coverage, allOpps;
  try{
    coverage = await apiFetch('/market/sector-coverage');
  }catch(err){
    grid.querySelectorAll('.sector-card').forEach(card => {
      const stat = card.querySelector('[id^="sectorStat-"]');
      if(stat) stat.textContent = 'Live coverage unavailable right now.';
    });
    return;
  }
  const bySector = new Map(coverage.sectors.map(s => [s.sector, s]));

  INDUSTRY_SECTORS.forEach(s => {
    const slug = _sectorSlug(s);
    const card = document.getElementById(`sectorCard-${slug}`);
    const stat = document.getElementById(`sectorStat-${slug}`);
    const row = bySector.get(s);
    const tenders = row ? row.programme_count : 0;
    const converted = row ? row.opportunity_count : 0;
    const sharedWith = row ? (row.shared_with || []) : [];
    // A real user-reported confusion (2026-09): the exact same
    // opportunity count showing on several sector cards (Radar,
    // Naval Systems, Sensors — all 994 for one real tenant)
    // understandably read as a bug — it's the correct, already-
    // verified result of a single classification code the government
    // itself maps to more than one capability (see migration 041 and
    // CLAUDE.md's own entry on this). Shown explicitly here so the
    // overlap is self-evident instead of requiring a fresh
    // investigation every time it's seen.
    const sharedNote = (converted > 0 && sharedWith.length)
      ? `<br><span class="small" style="color:var(--text-faint);">Shared with ${sharedWith.join(', ')} — a classification code here also covers those sectors, not a duplicate count.</span>`
      : '';
    if(stat){
      stat.innerHTML = `<b style="color:var(--text);">${tenders.toLocaleString()}</b> live tender${tenders===1?'':'s'}` +
        (converted > 0 ? ` &middot; <b style="color:var(--hue-mint);">${converted}</b> converted to opportunit${converted===1?'y':'ies'}` : '') +
        sharedNote;
    }
    if(card){
      card.title = `${tenders.toLocaleString()} tender${tenders===1?'':'s'} tracked in this sector · ${converted} of your own opportunit${converted===1?'y':'ies'} converted from it.` +
        (sharedWith.length ? ` Shared with ${sharedWith.join(', ')} via a multi-capability classification code.` : '') +
        ' Click to see them.';
      card.addEventListener('click', async () => {
        if(!allOpps){
          try{ allOpps = await apiFetch('/opportunities'); }catch(err){ allOpps = []; }
        }
        const matches = allOpps.filter(o => (o.sectors || []).includes(s));
        const body = matches.length === 0
          ? `<p class="small">You have no opportunities in <b>${s}</b> yet. This sector has ${tenders.toLocaleString()} real tender${tenders===1?'':'s'} tracked platform-wide — match a product against it from <b>My Products</b> to start converting some.</p>`
          : `<p class="small" style="margin-bottom:10px;">${matches.length} of your opportunit${matches.length===1?'y':'ies'} in <b>${s}</b>:</p>
             <div class="table-scroll"><table class="datatable">
               <thead><tr><th>Product</th><th>Programme</th><th>Score</th><th>Confidence</th><th>Stage</th></tr></thead>
               <tbody>${matches.map(o=>`
                 <tr><td>${o.product_name}</td><td>${o.programme_name || '—'}</td><td>${o.score ?? '—'}</td>
                 <td><span class="confidence ${o.confidence}">${o.confidence || '—'}</span></td>
                 <td><span class="tag" style="text-transform:capitalize;">${(o.stage||'').replace(/_/g,' ')}</span></td></tr>
               `).join('')}</tbody>
             </table></div>`;
        showInfoModal(`${s} — Your Opportunities`, body, null, 'Close');
      });
    }
  });
}

async function loadOpportunitiesDashboard(){
  document.getElementById('backToOpportunitiesBtn')?.addEventListener('click', () => {
    selectedOpportunityId = null;
    render();
  });
  if(selectedOpportunityId){
    loadOpportunityDetail();
    return;
  }
  loadTeamWorkload();

  const tableContainer = document.getElementById('opportunitiesTableContainer');
  const newSection = document.getElementById('newOpportunitiesSection');
  const lowConfNote = document.getElementById('lowConfidenceNote');
  const toggle = document.getElementById('showLowConfidenceToggle');
  if(!tableContainer) return;

  let allOpps = [];
  // Sources the user has ticked. Null until the first render, which
  // is what "no explicit choice yet" means — everything is shown.
  let selectedSources = null;
  let viewMode = 'active'; // 'active' | 'historical'

  const UNKNOWN_SOURCE = 'Unattributed';
  const sourceOf = (o) => o.source_name || UNKNOWN_SOURCE;

  function renderSourceFilter(){
    const bar = document.getElementById('sourceFilterBar');
    const options = document.getElementById('sourceFilterOptions');
    if(!bar || !options) return;

    const counts = new Map();
    allOpps.forEach(o => counts.set(sourceOf(o), (counts.get(sourceOf(o)) || 0) + 1));

    // Nothing to filter between if everything came from one source —
    // showing a single always-on checkbox would just be clutter.
    if(counts.size < 2){ bar.style.display = 'none'; return; }
    bar.style.display = 'block';

    const names = [...counts.keys()].sort();
    if(selectedSources === null) selectedSources = new Set(names);

    options.innerHTML = names.map(name => `
      <label class="small" style="display:flex;align-items:center;gap:7px;cursor:pointer;">
        <input type="checkbox" class="source-filter-cb" data-source="${name.replace(/"/g,'&quot;')}"
               ${selectedSources.has(name) ? 'checked' : ''}>
        ${name} <span style="color:var(--text-faint);">(${counts.get(name)})</span>
      </label>
    `).join('');

    options.querySelectorAll('.source-filter-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const name = cb.dataset.source;
        if(cb.checked) selectedSources.add(name); else selectedSources.delete(name);
        renderTable();
      });
    });

    const allBtn = document.getElementById('sourceFilterAllBtn');
    if(allBtn && !allBtn.dataset.wired){
      allBtn.dataset.wired = '1';
      allBtn.addEventListener('click', () => {
        const counts2 = new Set(allOpps.map(sourceOf));
        selectedSources = new Set(counts2);
        renderTable();
      });
    }
  }

  // A row in this table is one TENDER, but the same tender can match
  // several of the user's products, and each of those carries its own
  // counter. So the row total is the sum across the group — "how many
  // times you opened this tender", which is what the column claims.
  const groupOpens = (group) => group.reduce((n, o) => n + (o.tender_opened_count || 0), 0);
  const groupLastOpened = (group) => group
    .map(o => o.tender_last_opened_at).filter(Boolean)
    .sort().slice(-1)[0] || null;

  // programme_stage is the GOVERNMENT's own lifecycle stage for the
  // tender, not this tenant's sales stage (o.stage) — the two are
  // deliberately different fields (see CLAUDE.md). A high match score
  // says nothing about whether the tender itself is still open.
  function programmeStatusRemark(stage){
    if(stage === 'contract_awarded'){
      return { text: 'Already awarded — not open for bidding. Useful for Competitor Intel, not a live opportunity.', tone: 'var(--crit)' };
    }
    if(stage === 'in_service'){
      return { text: 'Already in service — the requirement has moved past procurement.', tone: 'var(--crit)' };
    }
    return null;
  }

  // "Closed" = government already shows it awarded/in-service, OR its
  // own published deadline has passed — either way, not something a
  // user should have to scroll past to find their live pipeline.
  // Moved to its own Historical tab rather than hidden behind an
  // opt-in checkbox, since there's no reason to keep something no
  // longer actionable in the primary list by default.
  function isClosedTender(o){
    if(programmeStatusRemark(o.programme_stage)) return true;
    if(!o.response_deadline) return false;
    const d = new Date(o.response_deadline);
    return !isNaN(d) && d < new Date();
  }

  // Tenant-wide version of Report Intel's per-product NBA coverage
  // check (2026-09) — same isClosedTender this whole dashboard
  // already uses, so "historical" can never mean something different
  // between the two views. Real gap this class of check found once
  // already: 30,926 opportunities platform-wide with next_action
  // permanently NULL from before the feature was wired into match
  // creation, invisible until someone did the arithmetic by hand.
  function renderNbaCoverageSummary(opps){
    const container = document.getElementById('nbaCoverageContainer');
    if(!container) return;
    const historical = opps.filter(isClosedTender);
    const live = opps.filter(o => !isClosedTender(o));
    const liveCovered = live.filter(o => o.next_action);
    const liveGap = live.filter(o => !o.next_action);
    const hasGap = liveGap.length > 0;
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        ${hasGap
          ? `<span class="tag" style="color:var(--signal);border-color:var(--signal);">⚠ ${liveGap.length} gap${liveGap.length === 1 ? '' : 's'} found</span>`
          : `<span class="tag" style="color:var(--low);border-color:var(--low);">✓ No gap</span>`}
      </div>
      <div class="grid grid-4" style="margin:10px 0;">
        <div class="kpi"><b>${opps.length}</b><span>Total</span></div>
        <div class="kpi"><b>${historical.length}</b><span>Historical</span></div>
        <div class="kpi"><b>${liveCovered.length}</b><span>Live · Covered</span></div>
        <div class="kpi"><b style="${hasGap ? 'color:var(--signal);' : ''}">${liveGap.length}</b><span>Live · Gap</span></div>
      </div>
      <p class="small" style="margin-top:6px;color:${hasGap ? 'var(--signal)' : 'var(--text-faint)'};">
        ${hasGap
          ? `${liveGap.length} live opportunit${liveGap.length === 1 ? 'y' : 'ies'} across your whole account could have a real next action but currently don't — this is a real gap, not a rounding artefact. Open one from the table below and check its Manage panel.`
          : 'Every live opportunity across your whole account already has a computed next action — no coverage gap.'}
      </p>
    `;
  }

  function openedCell(group){
    const n = groupOpens(group);
    if(n === 0) return '<span style="color:var(--text-faint);">—</span>';
    const when = groupLastOpened(group);
    const title = when ? ` title="Last opened ${new Date(when).toLocaleString()}"` : '';
    // More than once is the part worth seeing at a glance: it means
    // the user went back to it, which no match score can tell you.
    const style = n > 1
      ? 'color:var(--hue-cyan);border-color:var(--hue-cyan);'
      : 'color:var(--text-faint);';
    return `<span class="tag" style="${style}"${title}>${n}&times;</span>`;
  }

  // Compact readiness badge — the full breakdown + disclaimer lives
  // on the Manage panel (renderFitScorePanel); this is just enough
  // to scan the list without opening every row.
  function fitScoreCell(fitScore){
    if(!fitScore || fitScore.score_percent === null) return '<span style="color:var(--text-faint);">—</span>';
    const pct = fitScore.score_percent;
    const color = pct >= 70 ? 'var(--low)' : pct >= 40 ? 'var(--signal)' : 'var(--crit)';
    const title = fitScore.restriction_stated ? 'Restriction stated by source — see Manage for detail' : `${fitScore.signals_available} of ${fitScore.signals_total} signals available`;
    return `<span class="tag" style="color:${color};border-color:${color};" title="${title}">${pct}%${fitScore.restriction_stated ? ' ⚠' : ''}</span>`;
  }

  function showOpenedTenders(){
    const groups = new Map();
    allOpps.forEach(o => {
      if(!(o.tender_opened_count > 0)) return;
      const key = o.programme_id || o.programme_name || o.id;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(o);
    });
    const rows = [...groups.values()]
      .map(group => ({ group, opens: groupOpens(group), last: groupLastOpened(group) }))
      .sort((a, b) => b.opens - a.opens || String(b.last).localeCompare(String(a.last)));

    const body = rows.length === 0
      ? '<p class="small">You haven\'t opened any tender from a briefing yet. Open one from <b>Manage → Tender Briefing</b> and it will be recorded here.</p>'
      : `<p class="small" style="margin-bottom:12px;">
           Every line below is a tender you actually opened on its source portal from a briefing — recorded server-side at the moment you clicked, not a browser tally.
           <b style="color:var(--text);">A tender you went back to more than once is the useful signal here:</b> revisiting one is a decision you made after reading it, which no match score can tell you. Those are the ones to check a deadline on.
         </p>
         <div class="table-scroll"><table class="datatable">
           <thead><tr><th>Tender</th><th>Source</th><th>Times opened</th><th>Last opened</th></tr></thead>
           <tbody>${rows.map(({group, opens, last}) => {
             const o = group[0];
             return `<tr>
               <td>${o.programme_name || '—'}<br><span class="small" style="color:var(--text-faint);">${o.organization_name || 'Buyer not published'}</span></td>
               <td class="small">${sourceOf(o)}</td>
               <td><span class="tag" style="${opens > 1 ? 'color:var(--hue-cyan);border-color:var(--hue-cyan);' : ''}">${opens}&times;</span></td>
               <td class="small">${last ? new Date(last).toLocaleString() : '—'}</td>
             </tr>`;
           }).join('')}</tbody>
         </table></div>
         <p class="small" style="color:var(--text-faint);margin-top:12px;">
           The tile counts distinct tenders (${rows.length}); the column counts visits (${rows.reduce((n, r) => n + r.opens, 0)}). Re-opening one you already read doesn't make the tile go up.
         </p>`;
    showInfoModal('Tenders You\'ve Opened', body, null, 'Close');
  }

  function renderTable(){
    renderSourceFilter();

    const showLow = toggle.checked;
    const bySource = selectedSources === null
      ? allOpps
      : allOpps.filter(o => selectedSources.has(sourceOf(o)));

    // Split into Active vs Historical FIRST — closed tenders (already
    // awarded/in-service, or the source's own deadline has passed)
    // no longer belong in the primary pipeline view by default. Real
    // data, still useful (Competitor Intel, buyer history), just not
    // something to scroll past every time to find live opportunities.
    const closed = bySource.filter(isClosedTender);
    const active = bySource.filter(o => !isClosedTender(o));
    const inView = viewMode === 'historical' ? closed : active;

    const historicalCountEl = document.getElementById('oppHistoricalCount');
    if(historicalCountEl) historicalCountEl.textContent = closed.length > 0 ? `(${closed.length})` : '';
    const titleEl = document.getElementById('oppListTitle');
    if(titleEl) titleEl.textContent = viewMode === 'historical' ? 'Historical Opportunities' : 'Active Opportunities';
    const viewNoteEl = document.getElementById('oppViewNote');
    if(viewNoteEl){
      viewNoteEl.textContent = viewMode === 'historical'
        ? 'Already awarded/in-service, or the source\'s own deadline has passed — kept for reference (Competitor Intel, buyer history), not open for bidding.'
        : '';
    }

    const visible = showLow ? inView : inView.filter(o => o.confidence !== 'low');
    const lowConfHiddenCount = inView.length - visible.length;

    if(lowConfHiddenCount > 0){
      lowConfNote.style.display = 'block';
      lowConfNote.textContent = `${lowConfHiddenCount} low-confidence match${lowConfHiddenCount === 1 ? '' : 'es'} hidden — check "Show low-confidence matches" above.`;
    } else {
      lowConfNote.style.display = 'none';
    }

    if(allOpps.length === 0){
      tableContainer.innerHTML = '<p class="small">No opportunities yet — go to My Products, classify a product, confirm a capability, and run a match against real programmes.</p>';
      return;
    }
    if(bySource.length === 0){
      tableContainer.innerHTML = '<p class="small">No opportunities from the selected sources — tick more sources above.</p>';
      return;
    }
    if(inView.length === 0){
      tableContainer.innerHTML = viewMode === 'historical'
        ? '<p class="small">Nothing closed yet — awarded, in-service or past-deadline tenders will show up here.</p>'
        : '<p class="small">No active opportunities right now — check the Historical tab, or run a match against real programmes from My Products.</p>';
      return;
    }
    if(visible.length === 0){
      tableContainer.innerHTML = '<p class="small">All matches in this view are low-confidence — check the box above to see them.</p>';
      return;
    }

    // Group by programme, not by (product, programme) — the same real
    // tender legitimately creates one opportunity row per matching
    // product (that is correct data), but showing the same tender
    // 2-3 times in a list looks like duplication. One row per unique
    // programme_id; if more than one of the user's products matched
    // it, the highest-scoring one is shown and the rest are named
    // inline rather than hidden, so nothing is actually lost.
    const groups = new Map();
    visible.forEach(o => {
      const key = o.programme_id || o.programme_name || o.id;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(o);
    });
    const grouped = [...groups.values()].map(group => {
      group.sort((a,b) => (b.score||0) - (a.score||0));
      return { primary: group[0], all: group };
    });
    grouped.sort((a,b) => (b.primary.score||0) - (a.primary.score||0));

    tableContainer.innerHTML = `
      <div class="table-scroll" style="overflow-x:hidden;"><table class="datatable" style="table-layout:fixed;">
        <thead><tr><th style="width:16%;">Product</th><th style="width:24%;">Programme</th><th style="width:14%;">Signals</th><th style="width:8%;">Opened</th><th style="width:10%;">Stage</th><th style="width:20%;">Next Action</th><th style="width:8%;"></th></tr></thead>
        <tbody>${grouped.map(({primary:o, all})=>{
          // Shaded, not hidden or re-sorted — an already-opened
          // tender is still exactly as relevant as its score says;
          // this only answers "did I already look at this one",
          // which is the ambiguity this exists to remove. Opening it
          // again and again is fine — the count in Opened already
          // says so.
          const opened = groupOpens(all) > 0;
          const remark = programmeStatusRemark(o.programme_stage);
          // Source/buyer/country/eligibility all fold into the
          // Programme cell as wrapping sub-lines instead of their own
          // columns — the table was 12 columns wide, which forced a
          // horizontal scrollbar on any normal screen no matter how
          // the text inside each cell wrapped. Fewer, wider columns
          // that wrap vertically fixes that at the source rather than
          // trying to out-narrow each column.
          return `
          <tr${opened ? ` style="background:var(--panel-alt);" title="You've already opened this tender (${groupOpens(all)}×)"` : ''}>
            <td style="word-break:break-word;">${o.product_name}${all.length > 1 ? `<br><span class="small" style="color:var(--text-faint);">+ ${all.length - 1} more: ${all.slice(1).map(x=>x.product_name).join(', ')}</span>` : ''}</td>
            <td style="word-break:break-word;">
              ${o.programme_name || '—'}
              <br><span class="small" style="color:var(--text-faint);">${sourceOf(o)}${o.country ? ` · ${o.country}` : ''}${o.organization_name ? ` · ${o.organization_name}` : ''}</span>
              ${remark ? `<br><span class="small" style="color:${remark.tone};">⚠ ${remark.text}</span>` : ''}
              ${o.match_basis === 'keyword' ? `<br><span class="tag" style="color:var(--text-faint);border-color:var(--border);" title="Matched on the tender's title keywords only — this tender's classification code is not mapped to your capability, so it is never shown as high confidence. Check it manually.">Keyword match</span>` : ''}
              ${o.has_action_path === false ? `<br><span class="tag" style="color:var(--text-faint);border-color:var(--border);" title="This source hasn't published an apply link or a procurement contact for this notice yet — open it to search for it manually.">No action path yet</span>` : ''}
              ${o.set_aside_code ? `<br><span class="tag" style="color:var(--signal);border-color:var(--signal);">${o.set_aside_description || o.set_aside_code}</span>` : ''}
            </td>
            <td class="small">
              <span class="bar-track"><span class="bar-fill" style="width:${o.score || 0}%"></span></span>${o.score ?? '—'}
              <br><span class="confidence ${o.confidence}">${o.confidence}</span>
              <br>${fitScoreCell(o.fit_score)}
            </td>
            <td class="small">${openedCell(all)}</td>
            <td><span class="tag" style="text-transform:capitalize;">${(o.stage || '').replace(/_/g,' ')}</span></td>
            <td class="small" style="word-break:break-word;">${o.next_action || '<span style="color:var(--text-faint);">—</span>'}</td>
            <td><button class="btn btn-ghost btn-sm manage-opportunity-btn" data-id="${o.id}">Manage →</button></td>
          </tr>
        `;}).join('')}</tbody>
      </table></div>
    `;

    tableContainer.querySelectorAll('.manage-opportunity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedOpportunityId = btn.dataset.id;
        render();
      });
    });
  }

  try{
    const [oppsData, newOpps] = await Promise.all([
      apiFetch('/opportunities'),
      apiFetch('/opportunities/new'),  // marks these seen server-side by default — this IS the "you saw it first" checkpoint
    ]);
    allOpps = oppsData;

    document.getElementById('kpiTotal').textContent = allOpps.length;
    document.getElementById('kpiHighConf').textContent = allOpps.filter(o => o.confidence === 'high').length;
    document.getElementById('kpiNew').textContent = newOpps.new_count;
    renderNbaCoverageSummary(allOpps);

    // Server-recorded, not a browser tally: this counts distinct
    // tenders whose open-counter has moved (see GET
    // /engagement/summary), so it can't be inflated client-side.
    // Distinct tenders, not visits — re-reading one you already
    // opened doesn't make this number go up.
    apiFetch('/engagement/summary')
      .then(s => { const el = document.getElementById('kpiOpened'); if(el) el.textContent = s.tenders_opened; })
      .catch(() => { /* leave the dash — a stat failing must not break the dashboard */ });

    // The number alone can't answer "which one did I open twice?" —
    // the tile opens the list that can.
    document.getElementById('kpiOpenedTile')?.addEventListener('click', showOpenedTenders);

    if(newOpps.new_count > 0){
      newSection.innerHTML = `
        <div class="panel" style="border-color:var(--low);margin-bottom:20px;">
          <div class="tag" style="color:var(--low);border-color:var(--low);margin-bottom:10px;">New Since You Last Checked</div>
          <div class="table-scroll"><table class="datatable">
            <thead><tr><th>Product</th><th>Programme</th><th>Score</th><th>Confidence</th></tr></thead>
            <tbody>${newOpps.opportunities.map(o=>`
              <tr><td>${o.product_name}</td><td>${o.programme_name || '—'}</td><td>${o.score ?? '—'}</td>
              <td><span class="confidence ${o.confidence}">${o.confidence}</span></td></tr>
            `).join('')}</tbody>
          </table></div>
        </div>
      `;
    } else {
      newSection.innerHTML = '';
    }

    toggle.addEventListener('change', renderTable);

    const activeBtn = document.getElementById('oppViewActiveBtn');
    const historicalBtn = document.getElementById('oppViewHistoricalBtn');
    const setViewMode = (mode) => {
      viewMode = mode;
      const on = 'border-bottom:2px solid var(--hue-cyan);color:var(--hue-cyan);';
      const off = 'border-bottom:2px solid transparent;color:var(--text-faint);';
      activeBtn.setAttribute('style', activeBtn.getAttribute('style').replace(/border-bottom:[^;]+;color:[^;]+;/, mode === 'active' ? on : off));
      historicalBtn.setAttribute('style', historicalBtn.getAttribute('style').replace(/border-bottom:[^;]+;color:[^;]+;/, mode === 'historical' ? on : off));
      renderTable();
    };
    activeBtn?.addEventListener('click', () => setViewMode('active'));
    historicalBtn?.addEventListener('click', () => setViewMode('historical'));

    renderTable();
  }catch(err){
    tableContainer.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load opportunities: ${err.message}</p>`;
  }
}

/* ---------- Tender Briefing ----------
   Shown BEFORE the user is handed off to SAM.gov / TED / CanadaBuys,
   so they arrive at the source portal already knowing what this is
   and why it reached them.

   Every field here is something already stored — nothing is inferred.
   Two things are deliberately absent and SAID to be absent rather
   than left as blank rows:
     * the tender's scope of work / clauses — no source ingested here
       publishes that as structured data (programmes has no
       description column at all), so it genuinely lives only on the
       source portal;
     * a contract value — checked against the live feeds: CanadaBuys'
       CSV has no value column whatsoever, and open solicitations on
       SAM.gov don't carry one either. Showing an always-empty
       "Value: —" row would imply we tried and failed to find it.
   ---------- */
function _briefingStatus(opp){
  if(opp.programme_stage === 'contract_awarded'){
    return { label: 'Already awarded', tone: 'var(--crit)', detail: 'This notice records a contract that has already been awarded — it is not open for bidding. Useful as competitor/market intelligence.' };
  }
  if(!opp.response_deadline){
    return { label: 'No closing date published', tone: 'var(--text-faint)', detail: 'This source did not publish a closing date for this notice. Open it to check whether it is still accepting responses.' };
  }
  const d = new Date(opp.response_deadline);
  if(isNaN(d)) return { label: 'Closing date unclear', tone: 'var(--text-faint)', detail: `The source published "${opp.response_deadline}", which we could not read as a date. Check on the portal.` };
  const days = Math.ceil((d - new Date()) / (1000*60*60*24));
  if(days < 0) return { label: 'Closed', tone: 'var(--crit)', detail: `The response deadline passed on ${d.toLocaleDateString()}. Still worth reading for who buys this and how they specify it.` };
  if(days <= 7) return { label: `Closing in ${days} day${days===1?'':'s'}`, tone: 'var(--signal)', detail: `Deadline ${d.toLocaleString()}. If you intend to respond, this is the one to move on today.` };
  return { label: `Open — ${days} days left`, tone: 'var(--low)', detail: `Deadline ${d.toLocaleString()}.` };
}

/* Repeat visits are counted on the opportunity row, not logged again
   as separate history events — going back to a tender you already
   read is the same event happening again, and a line per visit would
   bury real pipeline activity in the timeline. See
   db/migrations/024_tender_opened_counter.sql. */
function tenderOpenSummary(opp){
  const n = opp.tender_opened_count || 0;
  if(n === 0) return '';
  const when = opp.tender_last_opened_at ? new Date(opp.tender_last_opened_at) : null;
  const last = (when && !isNaN(when)) ? ` &middot; last on ${when.toLocaleString()}` : '';
  return `${n} time${n === 1 ? '' : 's'}${last}`;
}

  const body = `
    <div class="panel" style="border-color:${st.tone};margin-bottom:14px;">
      <b style="color:${st.tone};font-size:.95rem;">${st.label}</b>
      <p class="small" style="margin-top:6px;">${st.detail}</p>
    </div>

    <p class="small" style="margin-bottom:6px;"><b style="color:var(--text);">The tender</b></p>
    <table class="datatable" style="margin-bottom:16px;"><tbody>
      ${row('Title', opp.programme_name)}
      ${row('Buyer', opp.organization_name)}
      ${row('Country', opp.country ? displayCountryName(opp.country) : null)}
      ${row('Source', opp.source_name)}
      ${row('Procurement stage', opp.programme_stage ? String(opp.programme_stage).replace(/_/g,' ') : null)}
      ${row('Category code', opp.classification_code)}

    </tbody></table>
    <p class="small" style="color:var(--text-faint);margin:-10px 0 16px;">
      <b style="color:var(--text-dim);">Not legal advice.</b> This shows only what the source itself published about bidder eligibility — it does not determine whether you can actually bid. Confirm with your own export-control/trade-compliance counsel before relying on it, especially for a tender outside your company's own registered country.
    </p>

    <p class="small" style="margin-bottom:6px;"><b style="color:var(--text);">Why it reached you</b></p>
    <table class="datatable" style="margin-bottom:16px;"><tbody>
      <tr><td style="width:150px;color:var(--text-faint);">Match score</td><td><b>${opp.score ?? '—'}</b> &nbsp; <span class="confidence ${opp.confidence}">${opp.confidence || '—'}</span></td></tr>
      ${row('Your next action', opp.next_action)}
      ${row('You opened this', tenderOpenSummary(opp))}
    </tbody></table>

    <p class="small" style="margin-bottom:6px;"><b style="color:var(--text);">Procurement contact</b></p>
    ${(opp.contact_name || opp.contact_email || opp.contact_email_secondary || opp.contact_phone || opp.contact_address) ? `
      <table class="datatable" style="margin-bottom:16px;"><tbody>
        ${row('Name', opp.contact_name)}
        ${row(opp.contact_email_secondary ? 'Email (Primary)' : 'Email', opp.contact_email ? `<a href="mailto:${opp.contact_email}">${opp.contact_email}</a>` : null)}
        ${row('Email (Secondary)', opp.contact_email_secondary ? `<a href="mailto:${opp.contact_email_secondary}">${opp.contact_email_secondary}</a>` : null)}
        ${row('Phone', opp.contact_phone)}
        ${row('Address', opp.contact_address)}
      </tbody></table>
      <p class="small" style="color:var(--text-faint);margin-bottom:16px;">
        Published by the source on this specific tender, so a supplier can write in about this specific requirement — not a directory entry, and never shown outside this one tender's briefing.
      </p>` : `
      <p class="small" style="color:var(--text-faint);margin-bottom:16px;">
        <b style="color:var(--text-dim);">Not published by ${opp.source_name || 'this source'} for this tender.</b> Coverage genuinely differs by source — SAM.gov, UK Find a Tender, ProZorro, Colombia and AusTender publish some contact fields; EU TED does not publish any at this time. This is a stated source gap, not a lookup that failed.

    </p>`;

  showInfoModal('Tender Briefing', body, async () => {
    // Record the click BEFORE navigating: this is the event the

    catch(e){ /* the tender still opens — a failed log must not block the user */ }
    window.open(opp.ui_link, '_blank', 'noopener');
    loadOpportunityDetail();
  }, `Open on ${opp.source_name ? opp.source_name.split(' (')[0] : 'source portal'} →`);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defence Opportunity Intelligence — From Capability to Opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tactical Command palette — gunmetal ground, moss-green primary
     signal, amber caution, red alert. Genuinely military-adjacent
     (radar/HUD/command-center), not muted institutional brass —
     revised after the first pass read as bureaucratic rather than
     defense-tech. Existing variable NAMES are kept so every
     component built on them updates automatically. */
  --bg:#0A0E0B; --bg-grad:#0D120E; --panel:#141A16; --panel-alt:#1A231C; --panel-hover:#212C22;
  --border:#3D4A3F; --border-soft:#26302A; --text:#EAEFE9; --text-dim:#BCC7BE; --text-faint:#75857A;
  --accent:#5C8A4A; --accent-soft:#1C2A1D; --signal:#D97706; --crit:#C4362A; --high:#D97706; --med:#D97706; --low:#4CAF6D; --info:#6B8A78;
  --hue-cyan:#4C9A8A; --hue-blue:#4C7A9A; --hue-teal:#3F8A6E; --hue-mint:#4CAF6D; --hue-amber:#D97706; --hue-coral:#C4362A; --hue-violet:#7A6B9A; --hue-rose:#C4362A;
  --tint-cyan:rgba(76,154,138,0.14); --tint-blue:rgba(76,122,154,0.16); --tint-amber:rgba(217,119,6,0.16); --tint-mint:rgba(76,175,109,0.14);
  --brass:#5C8A4A; --oxblood:#C4362A; --ink:#0A0E0B; --slate:#141A16; --frost:#EEF3EC; --charcoal:#161E18;
  --radius:2px;
  --font-display:'Archivo',sans-serif; --font-body:'Inter',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',monospace;
  --font-label:'Barlow Condensed',sans-serif;
}
[data-theme="light"]{
  --bg:#EEF3EC; --bg-grad:#F3F7F1; --panel:#FFFFFF; --panel-alt:#E9EFE6; --panel-hover:#DCE6D8;
  --border:#B9C7B4; --border-soft:#D4DED0; --text:#161E18; --text-dim:#3C4A3E; --text-faint:#6E7E70;
  --accent:#3F6B2E; --accent-soft:#DCE9D4; --signal:#B45F09; --crit:#A82A20; --high:#B45F09; --med:#B45F09; --low:#2E7D4F; --info:#4C6B58;
  --hue-cyan:#2E6B5C; --hue-blue:#3C5C74; --hue-teal:#2E6B54; --hue-mint:#2E7D4F; --hue-amber:#B45F09; --hue-coral:#A82A20; --hue-violet:#5C4C74; --hue-rose:#A82A20;
  --tint-cyan:rgba(46,107,92,0.10); --tint-blue:rgba(60,92,116,0.10); --tint-amber:rgba(180,95,9,0.10); --tint-mint:rgba(46,125,79,0.10);
  --brass:#3F6B2E; --oxblood:#A82A20; --ink:#EEF3EC; --slate:#FFFFFF; --frost:#EEF3EC; --charcoal:#161E18;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
[data-theme="light"]{color-scheme:light}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
html{overflow-x:hidden}
body{
  background:var(--ink);
  min-height:100vh; transition:background .35s ease,color .35s ease;
  overflow-x:hidden; max-width:100vw;
}
[data-theme="light"] body{
  background:var(--frost);
}
*,*::before,*::after{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease}
::selection{background:var(--accent-soft)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text);font-weight:600;letter-spacing:-.01em;margin-bottom:.5em}
h1{font-size:clamp(2.4rem,4.6vw,4.2rem);line-height:1.04;font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.9rem,3vw,2.7rem);line-height:1.1;font-weight:800}
h3{font-size:1.3rem;font-weight:700}
p{margin-bottom:1em;color:var(--text-dim);line-height:1.65}
.mono{font-family:var(--font-mono)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hue-cyan);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ===== letterhead ===== */
.letterhead{
  grid-column:1/-1;background:var(--ink);color:var(--brass);
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;padding:6px 12px;border-bottom:1px solid var(--border-soft);
}
[data-theme="light"] .letterhead{background:var(--charcoal);color:var(--hue-amber)}

/* ===== shell layout ===== */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
@media (max-width:960px){.shell{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block}}

.topbar{
  grid-column:1 / -1;display:flex;flex-direction:column;gap:12px;
  padding:16px 26px;border-bottom:1px solid var(--border-soft);
  background:var(--panel);
  position:sticky;top:0;z-index:50;
}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:2px;background:var(--brass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.02em;color:var(--ink);flex:none}
.brand-text h1{font-size:1.02rem;margin:0}
.brand-text p{font-size:.72rem;color:var(--text-faint);margin:0;font-family:var(--font-mono);letter-spacing:.03em}
.brand-text .op{color:var(--signal)}

.topbar-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}

.topbar-row2{width:100%}
.mode-switch{display:flex;gap:3px;background:var(--panel-alt);border:1px solid var(--border);border-radius:2px;padding:4px;flex-wrap:wrap;width:100%}
.mode-btn{
  font-family:var(--font-label);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:none;border:none;
  color:var(--text-dim);padding:9px 15px;border-radius:2px;cursor:pointer;white-space:nowrap;flex:none;
  border-bottom:2px solid transparent;line-height:1.25;
}
.mode-btn:hover{color:var(--text)}
/* Color-cycling active tabs — genuine variety instead of one
   monochrome accent for every tab, purely via nth-child so no JS
   changes are needed to keep this in sync with the mode list. */
.mode-btn.active{background:var(--panel);box-shadow:inset 0 0 0 1px var(--border)}
.mode-btn:nth-child(8n+1).active{color:var(--hue-cyan);border-bottom-color:var(--hue-cyan)}
.mode-btn:nth-child(8n+2).active{color:var(--hue-blue);border-bottom-color:var(--hue-blue)}
.mode-btn:nth-child(8n+3).active{color:var(--hue-teal);border-bottom-color:var(--hue-teal)}
.mode-btn:nth-child(8n+4).active{color:var(--hue-mint);border-bottom-color:var(--hue-mint)}
.mode-btn:nth-child(8n+5).active{color:var(--hue-amber);border-bottom-color:var(--hue-amber)}
.mode-btn:nth-child(8n+6).active{color:var(--hue-coral);border-bottom-color:var(--hue-coral)}
.mode-btn:nth-child(8n+7).active{color:var(--hue-violet);border-bottom-color:var(--hue-violet)}
.mode-btn:nth-child(8n+8).active{color:var(--hue-rose);border-bottom-color:var(--hue-rose)}

.mode-dropdown{position:relative}
.mode-dropdown summary{list-style:none;cursor:pointer}
.mode-dropdown summary::-webkit-details-marker{display:none}
.mode-dropdown .dropdown-menu{
  display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:60;min-width:180px;
  background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:4px;
  flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.mode-dropdown[open] .dropdown-menu{display:flex}
.mode-dropdown .dropdown-menu .mode-btn{text-align:left;white-space:nowrap}
.mobile-mode-select{display:none}
@media (max-width:640px){
  .mobile-mode-select{display:block;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:2px;padding:8px 10px;font-family:var(--font-mono);font-size:.75rem;width:100%}
  .topbar-row2 .mode-switch{display:none}
}

.theme-toggle{position:relative;width:52px;height:28px;border-radius:16px;border:1px solid var(--border);background:var(--panel-alt);cursor:pointer;flex:none;padding:0}
.theme-icon{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;line-height:1;pointer-events:none}
.theme-icon.sun{left:6px;color:var(--signal)}
.theme-icon.moon{right:6px;color:var(--accent)}
.theme-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--hue-blue);transition:transform .3s cubic-bezier(.4,0,.2,1)}
[data-theme="light"] .theme-knob{transform:translateX(24px);background:var(--signal)}

.sidebar-toggle{display:none;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:2px;padding:8px 10px;font-family:var(--font-mono);font-size:.7rem;cursor:pointer}
@media (max-width:960px){.sidebar-toggle{display:inline-flex}}

/* ===== sidebar ===== */
.sidebar{border-right:1px solid var(--border-soft);padding:20px 14px 50px;overflow-y:auto;max-height:calc(100vh - 74px);position:sticky;top:74px}
.sidebar-title{font-family:var(--font-label);font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--hue-amber);padding:6px 10px 12px}
.side-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:2px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;font-size:.83rem;color:var(--text-dim)}
.side-item:hover{background:var(--panel-alt)}
.side-item.active{background:var(--panel-alt);border-color:var(--hue-cyan);color:var(--text)}
.side-num{font-family:var(--font-mono);font-size:.68rem;color:var(--hue-cyan);flex:none}
.side-controls{padding:8px}
.side-controls label{display:block;font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.side-controls select,.side-controls input{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:2px;padding:8px 10px;font-size:.8rem}

/* ===== main ===== */
main{padding:36px 32px 90px;max-width:100%}
@media (max-width:640px){main{padding:24px 18px 70px}}
.eyebrow{font-family:var(--font-label);font-size:.95rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hue-amber);display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--hue-cyan)}
.lede{font-size:1.05rem;max-width:640px}
.section{margin-bottom:56px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;border-left:3px solid var(--border)}
.card-num{font-family:var(--font-mono);color:var(--hue-cyan);font-size:.72rem;display:block;margin-bottom:8px}
/* Color-cycling card accents — same palette rotation as the tabs,
   applied via nth-of-type so every grid of cards reads as genuinely
   colorful rather than one repeated accent. */
.card:nth-of-type(8n+1){border-left-color:var(--hue-cyan)}
.card:nth-of-type(8n+1) .card-num{color:var(--hue-cyan)}
.card:nth-of-type(8n+2){border-left-color:var(--hue-blue)}
.card:nth-of-type(8n+2) .card-num{color:var(--hue-blue)}
.card:nth-of-type(8n+3){border-left-color:var(--hue-teal)}
.card:nth-of-type(8n+3) .card-num{color:var(--hue-teal)}
.card:nth-of-type(8n+4){border-left-color:var(--hue-mint)}
.card:nth-of-type(8n+4) .card-num{color:var(--hue-mint)}
.card:nth-of-type(8n+5){border-left-color:var(--hue-amber)}
.card:nth-of-type(8n+5) .card-num{color:var(--hue-amber)}
.card:nth-of-type(8n+6){border-left-color:var(--hue-coral)}
.card:nth-of-type(8n+6) .card-num{color:var(--hue-coral)}
.card:nth-of-type(8n+7){border-left-color:var(--hue-violet)}
.card:nth-of-type(8n+7) .card-num{color:var(--hue-violet)}
.card:nth-of-type(8n+8){border-left-color:var(--hue-rose)}
.card:nth-of-type(8n+8) .card-num{color:var(--hue-rose)}
.card h3{font-size:1rem;margin-bottom:6px}
.card p{font-size:.86rem;margin-bottom:0}

.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px}
.kpi{background:var(--panel);border:1px solid var(--border-soft);border-radius:2px;padding:16px}
/* A KPI whose number can be clicked to see the real rows behind it
   (homepage live-stats strip). The "click to see them" hint stays
   hidden until hover/focus so the tile reads as a clean number first
   and an invitation second. */
.kpi-clickable{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi-clickable:hover,.kpi-clickable:focus-visible{border-color:var(--hue-cyan);transform:translateY(-2px)}
.kpi-peek{display:block;margin-top:6px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.04em;
  color:var(--hue-cyan);opacity:0;transition:opacity .15s}
.kpi-clickable:hover .kpi-peek,.kpi-clickable:focus-visible .kpi-peek{opacity:1}
.kpi b{display:block;font-family:var(--font-mono);font-size:1.5rem;color:var(--text)}
.kpi span{font-size:.7rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}

.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.86rem;padding:11px 18px;border-radius:2px;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--hue-blue);color:#04101F}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--hue-cyan);color:var(--hue-cyan)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}

.tag{display:inline-flex;font-family:var(--font-mono);font-size:.64rem;font-weight:600;letter-spacing:.08em;padding:3px 9px;border-radius:2px;border:1.5px solid var(--border);color:var(--text-dim);text-transform:uppercase}
.tag-demo{color:var(--oxblood);border-color:var(--oxblood);background:transparent}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--font-mono);font-size:.7rem;padding:5px 11px;border:1px solid var(--border);border-radius:2px;color:var(--text-dim)}

/* The topbar's own company badge — deliberately NOT .pill: that class
   is tuned for small secondary tags elsewhere on the site (dim text,
   tiny font), which made the company name here hard to read and the
   logo close to invisible. This is the one badge that's always on
   screen, so it gets real contrast and a properly-sized logo. */
.user-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.82rem;
  padding:6px 14px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text);cursor:default}
/* height-only, width auto — a forced square box was squeezing wide
   wordmark-style logos (a real uploaded one measured 451x214px) down
   to an unreadable sliver. Letting width follow the image's own
   aspect ratio, capped so an unusually wide logo can't take over the
   topbar, is what actually shows the logo instead of a fragment of it. */
.user-badge img{display:block;height:28px;width:auto;max-width:130px;object-fit:contain}

/* Confidence markers restyled as real classification stamps —
   bordered boxes with a stamp-like border weight, not soft pills —
   matching the design plan's "case file" language throughout. */
.confidence{font-family:var(--font-mono);font-size:.64rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  display:inline-flex;padding:2px 7px;border-radius:2px;border:1.5px solid currentColor}
.confidence.high{color:var(--low)}
.confidence.medium{color:var(--signal)}
.confidence.low{color:var(--text-faint);border-style:dashed}

.table-scroll{overflow-x:hidden;border:1px solid var(--border-soft);border-radius:var(--radius)}
.datatable{width:100%;table-layout:fixed;border-collapse:collapse;font-size:.83rem}
.datatable th{text-align:left;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);padding:10px 13px;border-bottom:1px solid var(--border)}
.datatable td{padding:12px 13px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);word-break:break-word}
.datatable tr:hover td{background:var(--panel-alt)}
.bar-track{width:56px;height:5px;border-radius:3px;background:var(--panel-alt);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px}
.bar-fill{height:100%;background:var(--hue-blue)}

.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:.74rem;color:var(--text-faint);margin-bottom:5px;font-family:var(--font-mono)}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:2px;padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:.88rem}
.form-field textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media (max-width:780px){.two-col{grid-template-columns:1fr}}
.small{font-size:.8rem;color:var(--text-faint)}
hr.rule{border:none;border-top:1px solid var(--border-soft);margin:30px 0}

.cta-band{background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius);padding:38px;text-align:center}
.center{text-align:center;margin-left:auto;margin-right:auto}

.step{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.step-index{font-family:var(--font-mono);font-size:.82rem;color:var(--hue-cyan);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}

/* ===== case file — the signature element (design plan) ===== */
.case-file{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:32px;overflow:hidden}
.case-file-stamp{
  position:absolute;top:22px;right:-42px;width:190px;text-align:center;
  transform:rotate(32deg);
  border:2px solid var(--oxblood);color:var(--oxblood);
  font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 0;line-height:1.6;opacity:.85;
}
.case-file-header{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border-soft);padding-bottom:12px;margin-bottom:18px;padding-right:120px}
.case-file-title{font-family:var(--font-display);font-size:1.2rem;margin-bottom:18px}
.case-file-rows{display:flex;flex-direction:column;border-top:1px solid var(--border-soft)}
.case-file-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap}
.case-file-label{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;flex:none}
.case-file-value{font-family:var(--font-mono);font-size:.84rem;color:var(--text);text-align:right}
.case-file-verdict{display:flex;align-items:center;gap:32px;margin-top:24px;padding-top:20px;border-top:2px solid var(--brass);flex-wrap:wrap}
.case-file-score{font-family:var(--font-display);color:var(--brass);flex:none;display:flex;align-items:baseline}
.case-file-score-num{font-size:2.6rem;font-weight:600}
.case-file-score-max{font-size:1.05rem;color:var(--text-faint);margin-left:2px}
.case-file-verdict-grid{display:flex;gap:26px;flex-wrap:wrap}
.case-file-verdict-grid > div{display:flex;flex-direction:column;gap:5px}
@media (max-width:640px){.case-file-stamp{position:static;transform:none;width:auto;margin-bottom:16px;display:inline-block}.case-file-header{padding-right:0}}

.flow-node{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:2px;background:var(--panel-alt);border:1px solid var(--border-soft);font-family:var(--font-mono);font-size:.76rem}
.flow-node .dot{width:7px;height:7px;border-radius:50%;background:var(--hue-cyan);flex:none}
.flow-connector{width:1px;height:14px;background:var(--hue-blue);margin-left:17px}

.worldmap-wrap{border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;background:var(--panel)}

<script src="config.js"></script>
<script>
/* Offline storage shim */
if(!window.storage){
  window.storage = {
    async get(key){ try{ return { value: localStorage.getItem(key) }; }catch(e){ return { value:null }; } },
    async set(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }
  };
}

<script>
/* ============================================================
   API CLIENT + AUTH — connects to the real backend built earlier
   this project. No fake data, no simulated logic: every call here
   goes to a running FastAPI instance and a real Postgres database.
   ============================================================ */
// Resolved from config.js when a deployment provides one (production
// serves it from the web server, pointing at the real API host);
// falls back to the local dev API so opening this file straight from
// disk keeps working exactly as before.
const API_BASE_URL = (window.DOI_CONFIG && window.DOI_CONFIG.apiBaseUrl) || 'http://localhost:8000';

let authToken = localStorage.getItem('doi_token') || null;
let currentUser = null; // populated by /auth/me after a token is verified
let selectedProductId = null; // My Products drill-down state — which product's detail view is open, if any
let selectedTaxonomyId = null; // Taxonomy Admin drill-down state — which capability's keyword list is open, if any
let selectedCustomerId = null; // Customer Intelligence drill-down state — which buying organisation's detail is open, if any
let selectedOemId = null; // OEM Intelligence drill-down state — which winning organisation's detail is open, if any
let selectedMarketCountry = null; // Global Markets drill-down state — which country's detail is open, if any

// ISO 3166-1 alpha-3 -> display name, for the country codes actually
// observed in programmes.country (TED stores alpha-3; every other
// source stores a full name already). Display-only decoding of a
// standard code, not an invented mapping — unknown codes just render
// as-is rather than guessing.
const COUNTRY_NAME_MAP = {
  AUT:'Austria', BEL:'Belgium', BGR:'Bulgaria', BIH:'Bosnia and Herzegovina',
  CHE:'Switzerland', CYP:'Cyprus', CZE:'Czechia', DEU:'Germany', DNK:'Denmark',
  ESP:'Spain', EST:'Estonia', FIN:'Finland', FRA:'France', GRC:'Greece',
  HRV:'Croatia', HUN:'Hungary', IRL:'Ireland', ITA:'Italy', LTU:'Lithuania',
  LUX:'Luxembourg', LVA:'Latvia', MLT:'Malta', NLD:'Netherlands', NOR:'Norway',
  POL:'Poland', PRT:'Portugal', ROU:'Romania', SVK:'Slovakia', SVN:'Slovenia',
  SWE:'Sweden',
};
function displayCountryName(code){ return COUNTRY_NAME_MAP[code] || code; }

// A real, confirmed stored-XSS gap (2026-09): this app has always
// interpolated user-controlled strings (a company's own name/tagline,
// a product's name/description, custom fields, a person's full name)
// straight into template-literal HTML with no escaping anywhere in
// this file — worst case, the PUBLIC, no-login share card
// (showPublicCard) renders a tenant's own `company_name`/`tagline`
// directly, meaning a malicious tenant could set either to a
// `<script>`/`<img onerror>` payload and have it execute in ANY
// visitor's browser (this app's own origin, where the JWT lives in
// localStorage) just by sending out their own real, legitimate share
// link. Used wherever user/tenant-controlled text is interpolated
// into an HTML string — safe for both text content and inside a
// double- or single-quoted attribute, since `"` and `'` are both
// escaped along with `<`/`>`/`&`.
function escapeHtml(value){
  if(value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// A plain <img> for an arbitrary uploaded logo was disappearing
// against this UI's dark theme — most real logos are exported with a
// transparent or dark background, which then blends straight into a
// dark panel and reads as "the logo isn't there." Every logo display
// in the app goes through this one helper so the fix (a solid white
// chip behind the image, sized generously enough to actually read)
// applies everywhere consistently rather than needing to be repeated
// — and fixed again — at each call site.
function logoImgHtml(url, alt, maxWidth, maxHeight){
  if(!url) return '';
  return `<span style="display:inline-block;background:#fff;padding:8px;border-radius:8px;line-height:0;">
    <img src="${url}" alt="${alt}" style="display:block;max-width:${maxWidth}px;max-height:${maxHeight}px;width:auto;height:auto;" onerror="this.parentElement.style.display='none';">
  </span>`;
}
let selectedOpportunityId = null; // Opportunity Dashboard drill-down state — which opportunity's engagement/stage-management panel is open, if any
// The most recent real match's trace (see match_product_to_programmes's
// docstring in programme_matching.py) — held here so the Architecture
// Map can show a checkmark on exactly the boxes that genuinely ran
// during that match, not a decorative "all lights green" animation.
// null until a match has actually been run this session.
let lastMatchTrace = null;

async function apiFetch(path, options = {}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers || {});
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const resp = await fetch(API_BASE_URL + path, Object.assign({}, options, {headers}));
  let data = null;
  try{ data = await resp.json(); }catch(e){ /* empty body is fine */ }
  if(!resp.ok){
    let message = `Request failed (${resp.status})`;
    if(data && data.detail){
      message = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
    }
    const err = new Error(message);
    err.status = resp.status;
    throw err;
  }
  return data;
}

function setAuthToken(token){
  authToken = token;
  if(token) localStorage.setItem('doi_token', token);
  else localStorage.removeItem('doi_token');
}

async function tryRestoreSession(){
  if(!authToken) return false;
  try{
    currentUser = await apiFetch('/auth/me');
    return true;
  }catch(e){
    // token expired/invalid — don't leave a dead token sitting around
    setAuthToken(null);
    currentUser = null;
    return false;
  }
}

// Modes that actually need a real account — everything else (Home,
// Platform, Pricing, Presentation, Contact, the Engines/How It Works/
// Solutions/Industries/Resources/About content, the Operating Guide)
// is the marketing site and has to be visible to someone who hasn't
// signed up yet. Enforced in ONE place (the top of render(), below)
// rather than scattered across every nav click handler, so a new
// private mode only needs adding here, not re-guarded at every entry
// point that can set appMode.
const PRIVATE_MODES = new Set([
  'products', 'dashboard', 'customer-intel', 'oem-intel', 'competitor-intel',
  'partner-intel', 'procurement-intel', 'markets', 'company-admin',
  'taxonomy-admin', 'company-view', 'report-intel', 'industries',
]);
let pendingMode = null; // the private mode someone tried to open while signed out — consumed right after signup/login completes, same pattern as pendingCompanyTenantId

function updateTopbarAuthState(){
  const loggedIn = !!currentUser;
  document.getElementById('userBadge').style.display = loggedIn ? '' : 'none';
  document.getElementById('companyProfileBtn').style.display = loggedIn ? '' : 'none';
  document.getElementById('logoutBtn').style.display = loggedIn ? '' : 'none';
  document.getElementById('topSignInBtn').style.display = loggedIn ? 'none' : '';
  document.getElementById('topSignUpBtn').style.display = loggedIn ? 'none' : '';
}

function showAppShell(){
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('appShell').style.display = 'grid';
  updateTopbarAuthState();
  const badge = document.getElementById('userBadge');
  if(badge && currentUser){
    // Logo before the company name — the same "logo, then name" order
    // used on the public share card and the full company-view page.
    // Wrapped in a small white chip (see logoImgHtml) because a plain
    // <img> here was disappearing: most uploaded logos have a
    // transparent or dark background that blends straight into this
    // UI's dark topbar.
    // onerror hides the image itself rather than leaving the
    // browser's broken-image icon sitting in the badge if a stored
    // data: URL is ever corrupt or unexpectedly empty.
    const logo = currentUser.logo_data_url
      ? `<span style="display:inline-flex;background:#fff;padding:2px;border-radius:4px;line-height:0;"><img src="${currentUser.logo_data_url}" alt="" onerror="this.parentElement.style.display='none';"></span>`
      : '';
    badge.innerHTML = `${logo}<span>${escapeHtml(currentUser.company_name)} · ${escapeHtml(currentUser.role)}</span>`;
  }
}

function showAuthOverlay(){
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authOverlay').style.display = 'flex';
}

let selectedCompanyTenantId = null; // company-view drill-down state — whose full compliance profile is open, if any
let pendingCompanyTenantId = null;  // set when someone clicks "Register to View Full Details" from a public card — consumed right after signup/login completes

async function boot(){
  const restored = await tryRestoreSession();
  const params = new URLSearchParams(location.search);
  const shareToken = params.get('company');
  const resetToken = params.get('reset_token');
  const verifyEmailToken = params.get('verify_email_token');
  const oidcToken = params.get('oidc_token');
  const oidcSignupToken = params.get('oidc_signup_token');
  const oidcMfaChallengeToken = params.get('oidc_mfa_challenge_token');
  const oidcError = params.get('oidc_error');
  if(resetToken){
    showAuthOverlay();
    renderResetPasswordScreen(resetToken);
    return;
  }
  if(verifyEmailToken){
    await handleVerifyEmailToken(verifyEmailToken, restored);
    return;
  }
  if(oidcToken){
    history.replaceState(null, '', location.pathname);
    await finishLogin(oidcToken);
    return;
  }
  if(oidcMfaChallengeToken){
    // The SSO-linked account has its own MFA enabled — auto-linking
    // by email proves the inbox, never the second factor, so this
    // reuses the exact same challenge screen a password login's own
    // MFA step already shows, just reached from a different door.
    history.replaceState(null, '', location.pathname);
    showAuthOverlay();
    renderMfaLoginScreen(oidcMfaChallengeToken);
    return;
  }
  if(oidcSignupToken){
    const email = params.get('oidc_email') || '';
    const name = params.get('oidc_name') || '';
    history.replaceState(null, '', location.pathname);
    showAuthOverlay();
    renderOidcCompleteSignupScreen(oidcSignupToken, email, name);
    return;
  }
  if(oidcError){
    history.replaceState(null, '', location.pathname);
    showAuthOverlay();
    renderAuthScreen('login');
    const errorBox = document.getElementById('authError');
    errorBox.textContent = oidcError;
    errorBox.style.display = 'block';
    return;
  }
  if(shareToken){
    await showPublicCard(shareToken);
    return;
  }
  // The marketing pages are public regardless of login state — only
  // PRIVATE_MODES actually require a session, and that's enforced
  // inside render() itself, not by hiding the whole site pre-login.
  showAppShell();
  render();
}

async function bootAfterPublicCard(){
  await tryRestoreSession();
  showAppShell();
  render();
}

/* ---------- Public company card — the "pitch card" a link/WhatsApp
   share opens. Reachable with NO login (see GET /public/companies/
   {token} in main.py, which returns only a name/logo/tagline/badge
   card — never a registration number). "Register to view" hands off
   into the normal signup flow, then lands on the full authenticated
   profile once that completes. ---------- */
async function showPublicCard(shareToken){
  const overlay = document.getElementById('publicCardOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="auth-card"><p class="small">Loading…</p></div>`;
  try{
    const card = await apiFetch(`/public/companies/${shareToken}`);
    const badgeLabels = {gst:'GST', pan:'PAN', tan:'TAN', iec:'IEC Licence'};
    const badges = Object.entries(card.compliance_badges).filter(([,v]) => v).map(([k]) => badgeLabels[k] || k.toUpperCase());
    overlay.innerHTML = `
      <div class="auth-card" style="text-align:center;">
        ${card.logo_data_url ? `<div style="margin-bottom:14px;">${logoImgHtml(card.logo_data_url, escapeHtml(card.company_name) + ' logo', 180, 100)}</div>` : ''}
        <h1 style="font-size:1.15rem;margin:0 0 6px;">${escapeHtml(card.company_name)}</h1>
        ${card.tagline ? `<p class="small" style="margin-bottom:8px;">${escapeHtml(card.tagline)}</p>` : ''}
        ${card.country ? `<p class="small mono" style="color:var(--text-faint);margin-bottom:8px;">${escapeHtml(card.country)}</p>` : ''}
        ${badges.length ? `<div class="pill-row" style="justify-content:center;margin:12px 0;">${badges.map(b => `<span class="pill">${escapeHtml(b)} on file</span>`).join('')}</div>` : ''}
        ${card.linkedin_url ? `<p class="small" style="margin:8px 0;"><a href="${escapeHtml(card.linkedin_url)}" target="_blank" rel="noopener">View on LinkedIn ↗</a></p>` : ''}
        <p class="small" style="margin:14px 0;color:var(--text-faint);">Registration numbers and full details are shown to registered platform users only — never on this public card.</p>
        <div class="btn-row" style="justify-content:center;flex-wrap:wrap;">
          ${currentUser
            ? `<button class="btn btn-primary" id="viewFullCompanyBtn">View Full Company Details</button>`
            : `<button class="btn btn-primary" id="registerToViewBtn">Register to View Full Details</button>`}
          <button class="btn btn-ghost" id="closePublicCardBtn">Close</button>
        </div>
      </div>
    `;
    document.getElementById('closePublicCardBtn')?.addEventListener('click', () => {
      history.replaceState(null, '', location.pathname);
      overlay.style.display = 'none';
      bootAfterPublicCard();
    });
    document.getElementById('registerToViewBtn')?.addEventListener('click', () => {
      pendingCompanyTenantId = card.tenant_id;
      overlay.style.display = 'none';
      showAuthOverlay();
      renderAuthScreen('signup');
    });
    document.getElementById('viewFullCompanyBtn')?.addEventListener('click', () => {
      overlay.style.display = 'none';
      history.replaceState(null, '', location.pathname);
      showAppShell();
      appMode = 'company-view';
      selectedCompanyTenantId = card.tenant_id;
      render();
    });
  }catch(err){
    overlay.innerHTML = `
      <div class="auth-card" style="text-align:center;">
        <p class="small" style="color:var(--crit);">This link is invalid or has been revoked by its owner.</p>
        <button class="btn btn-ghost" id="closePublicCardBtn" style="margin-top:14px;">Close</button>
      </div>`;
    document.getElementById('closePublicCardBtn')?.addEventListener('click', () => {
      history.replaceState(null, '', location.pathname);
      overlay.style.display = 'none';
      bootAfterPublicCard();
    });
  }
}

function renderCompanyView(){
  return `
    <div class="section">
      <button class="btn btn-ghost btn-sm" id="backFromCompanyViewBtn" style="margin-bottom:16px;">← Back</button>
      <div id="companyViewContainer"><p class="small">Loading…</p></div>
    </div>
  `;
}

async function loadCompanyView(){
  const container = document.getElementById('companyViewContainer');
  if(!container || !selectedCompanyTenantId) return;
  try{
    const c = await apiFetch(`/companies/${selectedCompanyTenantId}/profile`);
    const fields = Object.entries(c.custom_fields || {});
    container.innerHTML = `
      <div class="section panel">
        <div class="eyebrow">Company Profile</div>
        ${c.logo_data_url ? `<div style="margin:10px 0;">${logoImgHtml(c.logo_data_url, escapeHtml(c.name) + ' logo', 180, 100)}</div>` : ''}
        <h1 style="margin:6px 0;">${escapeHtml(c.name)}</h1>
        ${c.tagline ? `<p class="lede">${escapeHtml(c.tagline)}</p>` : ''}
        <table class="datatable" style="margin-top:16px;">
          <tbody>
            ${c.website ? `<tr><td style="width:160px;">Website</td><td>${escapeHtml(c.website)}</td></tr>` : ''}
            ${c.country ? `<tr><td>Country</td><td>${escapeHtml(c.country)}</td></tr>` : ''}
            ${c.phone ? `<tr><td>Phone</td><td>${escapeHtml(c.phone)}</td></tr>` : ''}
            ${c.linkedin_url ? `<tr><td>LinkedIn</td><td><a href="${escapeHtml(c.linkedin_url)}" target="_blank" rel="noopener">${escapeHtml(c.linkedin_url)} ↗</a></td></tr>` : ''}
            ${c.gst_number ? `<tr><td>GST Number</td><td>${escapeHtml(c.gst_number)}</td></tr>` : ''}
            ${c.pan_number ? `<tr><td>PAN</td><td>${escapeHtml(c.pan_number)}</td></tr>` : ''}
            ${c.tan_number ? `<tr><td>TAN</td><td>${escapeHtml(c.tan_number)}</td></tr>` : ''}
            ${c.iec_license ? `<tr><td>IEC Licence</td><td>${escapeHtml(c.iec_license)}</td></tr>` : ''}
            ${fields.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`;
  }
}

function initCompanyViewHandlers(){
  document.getElementById('backFromCompanyViewBtn')?.addEventListener('click', () => {
    selectedCompanyTenantId = null;
    appMode = 'home';
    render();
  });
  loadCompanyView();
}

/* ---------- Auth screen (login / signup toggle) ---------- */
function renderAuthScreen(which){
  const overlay = document.getElementById('authOverlay');
  const isLogin = which === 'login';
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">Defence Opportunity Intelligence</h1>
          <p class="small" style="margin:0;">${isLogin ? 'Sign in to your account' : 'Create your company account'}</p>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
      <div class="sso-buttons" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <button type="button" class="btn btn-ghost" id="ssoGoogleBtn" style="width:100%;justify-content:center;">Continue with Google</button>
        <button type="button" class="btn btn-ghost" id="ssoMicrosoftBtn" style="width:100%;justify-content:center;">Continue with Microsoft</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--text-faint);font-size:.78rem;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span>or</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>
      <form id="authForm">
        ${isLogin ? '' : `
        <div class="form-field"><label>Company Name</label><input id="af-company" type="text" required></div>
        <div class="form-field"><label>Your Full Name</label><input id="af-fullname" type="text" required></div>
        <div class="form-field"><label>Job Title / Role</label><input id="af-title" type="text" placeholder="e.g. Business Development Lead"></div>
        `}
        <div class="form-field"><label>${isLogin ? 'Email' : 'Work Email'}</label><input id="af-email" type="email" required></div>
        ${isLogin ? '' : `
        <div class="form-field"><label>Phone</label><input id="af-phone" type="tel"></div>
        <div class="form-field"><label>Company Website</label><input id="af-website" type="text" placeholder="https://"></div>
        <div class="form-field"><label>Country</label><input id="af-country" type="text"></div>
        `}
        <div class="form-field"><label>Password</label><input id="af-password" type="password" required minlength="10"></div>
        ${isLogin ? `<div style="text-align:right;margin-bottom:12px;"><button type="button" id="forgotPasswordLink" class="btn-link-inline">Forgot password?</button></div>` : ''}
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          ${isLogin ? 'Sign In' : 'Create Account'}
        </button>
      </form>
      <div class="auth-switch">
        ${isLogin
          ? `Don't have an account? <button id="switchToSignup">Sign up</button>`
          : `Already have an account? <button id="switchToLogin">Sign in</button>`}
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="closeAuthOverlayBtn" style="width:100%;justify-content:center;margin-top:10px;">← Back to the site</button>
    </div>
  `;

  document.getElementById(isLogin ? 'switchToSignup' : 'switchToLogin')
    .addEventListener('click', () => renderAuthScreen(isLogin ? 'signup' : 'login'));
  // Lets a visitor who landed here by clicking a private tab (or just
  // changed their mind) keep browsing the public site without having
  // to sign up or in — pendingMode/pendingCompanyTenantId are left
  // as-is deliberately: closing doesn't lose the "come back here
  // after signing in" state if they return to the auth form later.
  document.getElementById('closeAuthOverlayBtn').addEventListener('click', () => {
    showAppShell();
    render();
  });
  document.getElementById('forgotPasswordLink')?.addEventListener('click', () => {
    renderForgotPasswordScreen();
  });
  document.getElementById('ssoGoogleBtn').addEventListener('click', () => startOidcLogin('google'));
  document.getElementById('ssoMicrosoftBtn').addEventListener('click', () => startOidcLogin('microsoft'));

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('authError');
    errorBox.style.display = 'none';
    const email = document.getElementById('af-email').value;
    const password = document.getElementById('af-password').value;

    try{
      let result;
      if(isLogin){
        result = await apiFetch('/auth/login', {
          method:'POST',
          body: JSON.stringify({email, password}),
        });
      } else {
        const company_name = document.getElementById('af-company').value;
        const full_name = document.getElementById('af-fullname').value;
        const title = document.getElementById('af-title').value || null;
        const phone = document.getElementById('af-phone').value || null;
        const website = document.getElementById('af-website').value || null;
        const country = document.getElementById('af-country').value || null;
        result = await apiFetch('/auth/signup', {
          method:'POST',
          body: JSON.stringify({company_name, full_name, email, password, title, phone, website, country}),
        });
      }
      // A password-correct login on an MFA-enabled account gets no
      // access_token yet — just a short-lived challenge token, until
      // the second factor is checked. Signup can never hit this path
      // (a brand-new account has no MFA enrolled yet).
      if(result.mfa_required){
        renderMfaLoginScreen(result.mfa_challenge_token);
        return;
      }
      await finishLogin(result.access_token);
    }catch(err){
      errorBox.textContent = err.message || 'Something went wrong.';
      errorBox.style.display = 'block';
    }
  });
}

/* ---------- SSO (OIDC) ----------
   A real, full-page navigation (window.location.href), not a fetch()
   — /auth/oidc/{provider}/login's whole job is a 302 to the real
   provider's own login page, which only makes sense as a genuine
   browser navigation, not an XHR this app's own JS could intercept.
   The provider eventually sends the browser back to THIS SAME page
   with ?oidc_token=... (returning/linked user) or
   ?oidc_signup_token=...&oidc_email=...&oidc_name=... (brand new
   account — needs a company name only a human can supply) or
   ?oidc_error=... — all handled in boot(), the same place
   ?reset_token=/?verify_email_token= are already handled. */
function startOidcLogin(provider){
  window.location.href = `${API_BASE_URL}/auth/oidc/${provider}/login`;
}

function renderOidcCompleteSignupScreen(signupToken, email, name){
  const overlay = document.getElementById('authOverlay');
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">One more step</h1>
          <p class="small" style="margin:0;">Signed in as ${escapeHtml(email)} — just need your company name.</p>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
      <form id="oidcSignupForm">
        <div class="form-field"><label>Company Name</label><input id="oidc-company" type="text" required></div>
        <div class="form-field"><label>Your Full Name</label><input id="oidc-fullname" type="text" value="${escapeHtml(name)}"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Finish Setting Up My Account</button>
      </form>
      <div class="auth-switch">
        <button id="backToLoginFromOidcSignup">← Back to sign in</button>
      </div>
    </div>
  `;
  document.getElementById('backToLoginFromOidcSignup').addEventListener('click', () => renderAuthScreen('login'));
  document.getElementById('oidcSignupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('authError');
    errorBox.style.display = 'none';
    try{
      const result = await apiFetch('/auth/oidc/complete-signup', {
        method: 'POST',
        body: JSON.stringify({
          signup_token: signupToken,
          company_name: document.getElementById('oidc-company').value,
          full_name: document.getElementById('oidc-fullname').value || null,
        }),
      });
      await finishLogin(result.access_token);
    }catch(err){
      errorBox.textContent = err.message || 'Could not finish setting up your account.';
      errorBox.style.display = 'block';
    }
  });
}

// Shared by a normal password-only login and the second step of an
// MFA-gated one (renderMfaLoginScreen below) — both end up with a
// real access_token and need the exact same "land somewhere sane"
// logic afterward, so it lives in one place rather than two copies
// that could quietly drift apart.
async function finishLogin(accessToken){
  setAuthToken(accessToken);
  const restored = await tryRestoreSession();
  if(!restored) throw new Error('Signed in, but could not load account details.');
  showAppShell();
  // If this signup/login was reached via "Register to View Full
  // Details" on a public company card, land straight on that
  // company's full profile instead of the homepage.
  if(pendingCompanyTenantId){
    appMode = 'company-view';
    selectedCompanyTenantId = pendingCompanyTenantId;
    pendingCompanyTenantId = null;
  } else if(pendingMode){
    // Reached signup/login by trying to open a private tab while
    // signed out (see the guard at the top of render()) — land there
    // now instead of the homepage.
    appMode = pendingMode;
    pendingMode = null;
  } else {
    appMode = 'home';
  }
  render();
}

/* ---------- MFA login (second step) ----------
   Reached only when /auth/login returns mfa_required — the password
   was already correct, this is purely the second factor. Accepts
   EITHER a real 6-digit TOTP code or one of the account's backup
   codes (same POST /auth/login/mfa route handles both, see
   app/mfa.py's verify_backup_code). challengeToken expires in 5
   minutes (see MFA_CHALLENGE_MINUTES in main.py) — an expired/garbage
   token is a normal 401 from the API, surfaced the same way any other
   login error is. ---------- */
function renderMfaLoginScreen(challengeToken){
  const overlay = document.getElementById('authOverlay');
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">Two-Factor Authentication</h1>
          <p class="small" style="margin:0;">Enter the code from your authenticator app.</p>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
      <form id="mfaLoginForm">
        <div class="form-field">
          <label id="mfaLoginCodeLabel">6-digit code</label>
          <input id="mlf-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Verify</button>
      </form>
      <div class="auth-switch">
        <button type="button" id="mfaUseBackupCodeToggle">Use a backup code instead</button>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="mfaBackToLoginBtn" style="width:100%;justify-content:center;margin-top:10px;">← Back to sign in</button>
    </div>
  `;

  let usingBackupCode = false;
  const codeLabel = document.getElementById('mfaLoginCodeLabel');
  const codeInput = document.getElementById('mlf-code');
  const toggleBtn = document.getElementById('mfaUseBackupCodeToggle');
  toggleBtn.addEventListener('click', () => {
    usingBackupCode = !usingBackupCode;
    codeLabel.textContent = usingBackupCode ? 'Backup code' : '6-digit code';
    codeInput.value = '';
    codeInput.maxLength = usingBackupCode ? 24 : 6;
    codeInput.placeholder = usingBackupCode ? 'XXXX-XXXX-XXXX-XXXX-XXXX' : '';
    toggleBtn.textContent = usingBackupCode ? 'Use my authenticator app instead' : 'Use a backup code instead';
  });
  document.getElementById('mfaBackToLoginBtn').addEventListener('click', () => renderAuthScreen('login'));

  document.getElementById('mfaLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('authError');
    errorBox.style.display = 'none';
    const code = codeInput.value.trim();
    try{
      const result = await apiFetch('/auth/login/mfa', {
        method: 'POST',
        body: JSON.stringify({ mfa_challenge_token: challengeToken, code }),
      });
      await finishLogin(result.access_token);
    }catch(err){
      errorBox.textContent = err.status === 401
        ? `${err.message} — if this challenge expired, go back and sign in again.`
        : (err.message || 'Something went wrong.');
      errorBox.style.display = 'block';
    }
  });
}

/* ---------- Forgot / Reset Password ----------
   Two separate screens because they're genuinely different steps:
   requesting a link (needs only an email) vs consuming one (needs
   the token from the URL plus a new password). Both post to
   POST /auth/forgot-password and POST /auth/reset-password — see
   those routes' docstrings in main.py for why forgot-password always
   returns the same message regardless of whether the email exists. */
function renderForgotPasswordScreen(){
  const overlay = document.getElementById('authOverlay');
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">Reset your password</h1>
          <p class="small" style="margin:0;">Enter the email on your account.</p>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
      <p class="small" id="forgotSuccessMsg" style="display:none;color:var(--low);margin-bottom:12px;"></p>
      <form id="forgotPasswordForm">
        <div class="form-field"><label>Email</label><input id="fp-email" type="email" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Send Reset Link</button>
      </form>
      <div class="auth-switch">
        <button id="backToLoginFromForgot">← Back to sign in</button>
      </div>
    </div>
  `;
  document.getElementById('backToLoginFromForgot').addEventListener('click', () => renderAuthScreen('login'));
  document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('authError');
    const successMsg = document.getElementById('forgotSuccessMsg');
    errorBox.style.display = 'none';
    successMsg.style.display = 'none';
    const email = document.getElementById('fp-email').value;
    try{
      const result = await apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email }),
      });
      successMsg.textContent = result.message;
      successMsg.style.display = 'block';
      document.getElementById('forgotPasswordForm').style.display = 'none';
    }catch(err){
      errorBox.textContent = err.message || 'Something went wrong.';
      errorBox.style.display = 'block';
    }
  });
}

/* ---------- Email verification ----------
   Reached from the link in the verification email
   (?verify_email_token=...). Unlike the reset-password link this one
   works whether or not the visitor still has a live session — a
   verification link genuinely can outlive the browser tab it was
   requested from — so it branches on `alreadyLoggedIn` (boot()'s own
   tryRestoreSession() result) rather than assuming either case. */
async function handleVerifyEmailToken(token, alreadyLoggedIn){
  history.replaceState(null, '', location.pathname);
  let message, ok;
  try{
    const result = await apiFetch('/auth/verify-email', {
      method: 'POST',
      body: JSON.stringify({ token }),
    });
    message = result.message || 'Email verified.';
    ok = true;
    if(currentUser) currentUser.email_verified = true;
  }catch(err){
    message = err.message || 'That verification link is invalid or has expired — request a new one from Company Profile.';
    ok = false;
  }
  if(alreadyLoggedIn){
    showAppShell();
    render();
    showInfoModal(ok ? 'Email verified' : 'Verification failed', `<p class="small">${escapeHtml(message)}</p>`, null, 'OK');
  }else{
    showAuthOverlay();
    renderVerifyEmailResultScreen(message, ok);
  }
}

function renderVerifyEmailResultScreen(message, ok){
  const overlay = document.getElementById('authOverlay');
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">${ok ? 'Email verified' : 'Verification failed'}</h1>
        </div>
      </div>
      <p class="small" style="margin-bottom:16px;${ok ? 'color:var(--low);' : ''}">${escapeHtml(message)}</p>
      <div class="auth-switch">
        <button id="backToLoginFromVerify">← Back to sign in</button>
      </div>
    </div>
  `;
  document.getElementById('backToLoginFromVerify').addEventListener('click', () => renderAuthScreen('login'));
}

function renderResetPasswordScreen(token){
  const overlay = document.getElementById('authOverlay');
  overlay.innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DOI</div>
        <div>
          <h1 style="font-size:1rem;margin:0;">Choose a new password</h1>
          <p class="small" style="margin:0;">This link is only valid for a short time.</p>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
      <form id="resetPasswordForm">
        <div class="form-field"><label>New Password</label><input id="rp-password" type="password" required minlength="10"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Update Password</button>
      </form>
      <div class="auth-switch">
        <button id="backToLoginFromReset">← Back to sign in</button>
      </div>
    </div>
  `;
  document.getElementById('backToLoginFromReset').addEventListener('click', () => {
    history.replaceState(null, '', location.pathname);
    renderAuthScreen('login');
  });
  document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('authError');
    errorBox.style.display = 'none';
    const new_password = document.getElementById('rp-password').value;
    try{
      await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, new_password }),
      });
      history.replaceState(null, '', location.pathname);
      renderAuthScreen('login');
      const errorBoxAfter = document.getElementById('authError');
      errorBoxAfter.textContent = 'Password updated — sign in with your new password.';
      errorBoxAfter.style.color = 'var(--low)';
      errorBoxAfter.style.borderColor = 'var(--low)';
      errorBoxAfter.style.display = 'block';
    }catch(err){
      errorBox.textContent = err.message || 'That reset link is invalid or has expired — request a new one.';
      errorBox.style.display = 'block';
    }
  });
}

function logout(){
  setAuthToken(null);
  currentUser = null;
  // Land back on the public homepage, not a forced login form — the
  // marketing site is meant to be visible whether or not someone is
  // signed in.
  appMode = 'home';
  updateTopbarAuthState();
  render();
}

/* ---------- Generic info modal — used to explain what an action
   actually does (data source, what a term means) before running
   it, rather than assuming the user already knows. ---------- */
function showInfoModal(title, bodyHtml, onContinue, continueLabel){
  const overlay = document.createElement('div');
  overlay.className = 'info-modal-overlay';
  overlay.innerHTML = `
    <div class="info-modal">
      <button class="info-modal-close" id="infoModalClose" aria-label="Close">&times;</button>
      <h3>${title}</h3>
      ${bodyHtml}
      <div class="btn-row" style="margin-top:22px;justify-content:flex-end;">
        <button class="btn btn-ghost" id="infoModalCancel">Cancel</button>
        <button class="btn btn-primary" id="infoModalContinue">${continueLabel || (onContinue ? 'Run Match' : 'Close')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('infoModalClose').addEventListener('click', close);
  document.getElementById('infoModalCancel').addEventListener('click', close);
  document.getElementById('infoModalContinue').addEventListener('click', () => {
    close();
    if(onContinue) onContinue();
  });
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}

const CAPABILITY_LIBRARY = {
  "secure communication":"Secure Tactical Communication Subsystem","encrypted":"Secure Tactical Communication Subsystem",
  "uav":"Tactical UAV Systems Subsystem","radar":"Radar & Sensing Subsystem","electronic warfare":"Electronic Warfare Subsystem",

function classify(t){ t=t.toLowerCase(); for(const k in CAPABILITY_LIBRARY){ if(t.includes(k)) return CAPABILITY_LIBRARY[k]; } return "General Defence Technology Subsystem"; }
function seededScore(str,min,max){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return min+(h%(max-min+1)); }

   RENDER — topbar controls
   ============================================================ */
function renderTopControls(){
  // Only shown to genuine platform admins — is_platform_admin is a
  // real, database-checked flag (see the backend's
  // require_platform_admin), not something a regular tenant admin
  // can set on themselves. Hiding the tab here is a UX convenience
  // only; the actual security boundary is enforced server-side
  // regardless of whether this filter is ever bypassed client-side.
  const visibleModes = MODES.filter(m => !m.adminOnly || currentUser?.is_platform_admin);
  const workModes = visibleModes.filter(m => !m.group);
  const modeBtn = m => `<button class="mode-btn${m.id===appMode?' active':''}" data-mode="${m.id}">${m.label}</button>`;
  // Direct work-path buttons, then one <details> dropdown per group
  // (Explore/Company) — keeps everything on one line instead of the
  // old 17-wide single row that had to wrap or scroll. A dropdown is
  // only rendered "open" (has .active on its own summary) if the
  // currently active mode lives inside it, so a user who navigated
  // into e.g. Pricing via the dropdown can still see where they are.
  const dropdownsHtml = MODE_DROPDOWNS.map(({group, label}) => {
    const items = visibleModes.filter(m => m.group === group);
    if(!items.length) return '';
    const hasActive = items.some(m => m.id === appMode);
    return `<details class="mode-dropdown">
      <summary class="mode-btn dropdown-trigger${hasActive?' active':''}">${label} ▾</summary>
      <div class="dropdown-menu">${items.map(modeBtn).join('')}</div>
    </details>`;
  }).join('');
  document.getElementById('modeSwitch').innerHTML = workModes.map(modeBtn).join('') + dropdownsHtml;
  const sel = document.getElementById('mobileModeSelect');
  sel.innerHTML = visibleModes.map(m=>`<option value="${m.id}"${m.id===appMode?' selected':''}>${m.label}</option>`).join('');
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    appMode=b.dataset.mode;
    b.closest('.mode-dropdown')?.removeAttribute('open');
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  sel.addEventListener('change',()=>{ appMode=sel.value; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  // Close any open dropdown on an outside click — <details> has no
  // native "close on click elsewhere" behaviour. Attached once ever
  // (renderTopControls itself re-runs on every render()), not once
  // per call — a guard flag, not a re-added listener each time.
  if(!window._modeDropdownOutsideClickBound){
    window._modeDropdownOutsideClickBound = true;
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.mode-dropdown[open]').forEach(d => {
        if(!d.contains(e.target)) d.removeAttribute('open');
      });
    });
  }
}

/* ---------- Run All 10 Engines — live progress pop-up ----------
   Driven by the REAL calls, never a timer pretending to work: classify
   (engine 01) -> match-programmes (engines 02-03) -> intel-report (all
   ten engines' real headlines). A row only shows "running" while the
   call that produces it is genuinely in flight, and a tick's text is
   the server's own headline for that engine — nothing is composed
   client-side. The ~10s target only PACES the reveal of results that
   already exist (so each tick is readable); it never delays or fakes
   work, and if the real calls alone take longer, the reveal just goes
   fast. Re-classifying is deliberately skipped when a capability is
   already analyst-confirmed: POST /classify's upsert resets
   classified_by back to 'ai_suggested', which would silently un-confirm
   it. Stops honestly (rows 02-10 marked "needs a confirmed capability")
   when none is confirmed yet — confirming is a human analyst step. */
async function runAllEnginesModal(productId, onClose){
  const TARGET_MS = 10000;
  const started = Date.now();
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const overlay = document.createElement('div');
  overlay.className = 'info-modal-overlay';
  overlay.innerHTML = `
    <style>@keyframes reSpin{to{transform:rotate(360deg)}} .re-spin{display:inline-block;animation:reSpin 1s linear infinite;}</style>
    <div class="info-modal" style="max-width:660px;">
      <h3>Running the 10 Intelligence Engines</h3>
      <p class="small" id="reStatus" style="color:var(--text-faint);margin-bottom:12px;">Starting…</p>
      <ol style="list-style:none;padding:0;margin:0;">
        ${ENGINES.map((e, i) => `
          <li style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);">
            <span id="reIcon${i}" style="width:20px;text-align:center;color:var(--text-faint);">○</span>
            <div style="flex:1;">
              <b style="font-size:.9rem;">${e.n} · ${e.name}</b>
              <div class="small" id="reMsg${i}" style="color:var(--text-faint);">Waiting</div>
            </div>
          </li>`).join('')}
      </ol>
      <div class="btn-row" id="reButtons" style="margin-top:18px;justify-content:flex-end;"></div>
    </div>`;
  document.body.appendChild(overlay);

  const setStatus = (msg, color) => {
    const el = document.getElementById('reStatus');
    el.textContent = msg;
    el.style.color = color || 'var(--text-faint)';
  };
  const setRow = (i, state, msg) => {
    const icon = document.getElementById('reIcon' + i);
    const msgEl = document.getElementById('reMsg' + i);
    if(!icon || !msgEl) return;
    icon.className = '';
    if(state === 'running'){ icon.innerHTML = '<span class="re-spin">⟳</span>'; icon.style.color = 'var(--signal)'; }
    else if(state === 'done'){ icon.textContent = '✓'; icon.style.color = 'var(--low)'; }
    else if(state === 'idle'){ icon.textContent = '–'; icon.style.color = 'var(--text-faint)'; }
    else if(state === 'error'){ icon.textContent = '✕'; icon.style.color = 'var(--crit)'; }
    else { icon.textContent = '○'; icon.style.color = 'var(--text-faint)'; }
    msgEl.textContent = msg;
    msgEl.style.color = state === 'running' ? 'var(--signal)' : state === 'error' ? 'var(--crit)' : state === 'done' ? 'var(--text-dim)' : 'var(--text-faint)';
  };
  const closeModal = () => { overlay.remove(); if(onClose) onClose(); };
  const showButtons = (withReport) => {
    const box = document.getElementById('reButtons');
    box.innerHTML = (withReport ? '<button class="btn btn-primary" id="reOpenReport">Open Report Intel →</button>' : '') +
                    '<button class="btn btn-ghost" id="reClose">Close</button>';
    document.getElementById('reClose').addEventListener('click', closeModal);
    document.getElementById('reOpenReport')?.addEventListener('click', () => {
      overlay.remove();
      selectedReportProductId = productId;
      appMode = 'report-intel';
      render();
    });
  };
  // Reveal already-available results one at a time, pacing so the
  // whole run lands near TARGET_MS — never slower than 800ms/engine,
  // never faster than 150ms (still readable even if real calls ran long).
  let revealedCount = 0;
  const revealPause = async () => {
    const left = ENGINES.length - revealedCount;
    const budget = TARGET_MS - (Date.now() - started);
    await sleep(Math.max(150, Math.min(800, left > 0 ? budget / left : 150)));
    revealedCount++;
  };
  const labelsOf = list => list.map(c => c.label).join(', ');

  try{
    setStatus('Checking your product’s capabilities…');
    setRow(0, 'running', 'Classifying against the capability taxonomy…');
    let caps = await apiFetch(`/products/${productId}/capabilities`);
    let confirmed = caps.filter(c => c.classified_by === 'analyst');

    if(confirmed.length){
      await revealPause();
      setRow(0, 'done', `${confirmed.length} confirmed capabilit${confirmed.length === 1 ? 'y' : 'ies'} on file: ${labelsOf(confirmed)}`);
    } else {
      const res = await apiFetch(`/products/${productId}/classify`, {method:'POST'});
      caps = await apiFetch(`/products/${productId}/capabilities`);
      confirmed = caps.filter(c => c.classified_by === 'analyst');
      if(confirmed.length === 0){
        await revealPause();
        setRow(0, 'done', res.candidates.length
          ? `${res.candidates.length} candidate${res.candidates.length === 1 ? '' : 's'} suggested: ${labelsOf(caps)}`
          : 'No capability candidates found for this product’s text');
        for(let i = 1; i < ENGINES.length; i++) setRow(i, 'idle', 'Needs a confirmed capability first');
        setStatus(res.candidates.length
          ? 'Paused — confirm one suggested capability in the Capabilities table, then run again. Engines 02–10 only work from a capability a person has confirmed.'
          : 'Stopped — nothing to confirm yet. Add more detail to the product description and run again.', 'var(--signal)');
        showButtons(false);
        return;
      }
      await revealPause();
      setRow(0, 'done', `${confirmed.length} confirmed capabilit${confirmed.length === 1 ? 'y' : 'ies'}: ${labelsOf(confirmed)}`);
    }

    setStatus('Matching against real programmes and building every engine’s output…');
    setRow(1, 'running', 'Running…');
    setRow(2, 'running', 'Running (same step as Market Intelligence)…');
    const match = await apiFetch(`/products/${productId}/match-programmes`, {method:'POST'});
    lastMatchTrace = match.trace;
    for(let i = 3; i < ENGINES.length; i++) setRow(i, 'running', 'Running…');
    const report = await apiFetch(`/products/${productId}/intel-report`);

    for(let i = 1; i < ENGINES.length; i++){
      const e = report.engines[i];
      await revealPause();
      if(e && e.ran) setRow(i, 'done', e.headline || 'Complete');
      else setRow(i, 'idle', (e && (e.note || e.headline)) || 'No result for this product yet');
    }
    setStatus(`Done — ${report.engines_ran} of ${report.engines_total} engines produced results.`, 'var(--low)');
    showButtons(true);
  }catch(err){
    setStatus(err.message || 'Something went wrong.', 'var(--crit)');
    for(let i = 0; i < ENGINES.length; i++){
      const icon = document.getElementById('reIcon' + i);
      if(icon && icon.querySelector('.re-spin')) setRow(i, 'error', 'Stopped — see message above');
    }
    showButtons(false);
  }
}

/* ============================================================
   INGESTION CONTROL — lets a platform admin trigger any of the ten
   real ingestion sources (SAM.gov, UK Find a Tender, EU TED, CPPP
   India, CanadaBuys, eTenders South Africa, SECOP II Colombia,
   ProZorro Ukraine, AusTender Australia, DNCP Paraguay) by hand instead of waiting for the scheduler's
   next interval, and see each source's most recent run at a glance.
   /ingestion/sources/status (2026-09 health-monitoring update) now
   carries everything this table needs per source — schedule config,
   last run status/error/timestamp, and last_records_ingested — all
   computed from EVERY job that source ever ran. This table used to
   also fetch /ingestion/jobs (a GLOBAL `limit 20` feed across every
   source) just to read records_ingested, which silently showed "—"
   for any source a busier one had pushed out of that shared window
   (confirmed live: UK Find a Tender, eTenders South Africa) — that
   second call and the per-row lookup it fed are gone now, not just
   patched, since the health endpoint alone is a complete answer.
   ============================================================ */
const INGESTION_RUN_ENDPOINTS = {
  sam_gov: { path: '/ingestion/sam-gov/run', body: { naics_codes: [], days_back: 90 } },
  uk_find_a_tender: { path: '/ingestion/uk-ft/run', body: { days_back: 7 } },
  ted_eu: { path: '/ingestion/ted-eu/run', body: { days_back: 30 } },
  // CPPP is bounded by pages rather than a date window — 10 tenders
  // per page, fetched sequentially with a delay because the portal
  // rate-limits. 80 pages is ~800 tenders and takes ~11 minutes
  // (measured live), which is why the run button shows a live
  // elapsed timer. Full
  // coverage of CPPP's ~32,000 active tenders accumulates over
  // repeated/scheduled runs; the upsert is idempotent so re-running
  // costs nothing but time.
  cppp_india: { path: '/ingestion/cppp-india/run', body: { max_pages: 80 } },
  // CanadaBuys takes no parameters at all — one request returns every
  // currently-open tender, so there is no date window or page count to
  // choose. Fastest source here: ~15s for the full ~976-tender feed.
  // Its award-notice phase (see app/canada_buys_ingestion.py) runs
  // automatically as part of the same call — no separate button.
  canada_buys: { path: '/ingestion/canada-buys/run', body: {} },
  // These three were added to the backend registry across earlier
  // work but never wired in here — the real bug a "why is nothing
  // fetching for these three" report surfaced: their Run Now buttons
  // were silently `disabled` this whole time (see `runnable` below),
  // with no error and no visible reason, because
  // INGESTION_RUN_ENDPOINTS simply had no entry for their source
  // codes. `days_back` on south_africa/colombia is a QUERY parameter
  // on those routes (plain FastAPI int params, not a body model —
  // confirmed against their actual signatures in main.py), so it
  // goes in `path`, not `body`, which is always sent as the JSON
  // body and would otherwise be silently ignored.
  south_africa: { path: '/ingestion/south-africa/run?days_back=30', body: {} },
  colombia: { path: '/ingestion/colombia/run?days_back=30', body: {} },
  // ProZorro genuinely takes no days_back at all — its list-scan
  // fetch has no date-range query to give one (see
  // app/prozorro_ingestion.py's module docstring).
  prozorro: { path: '/ingestion/prozorro/run', body: {} },
  // AusTender — contract notices only (post-award), cursor-paginated
  // internally up to AUSTRALIA_MAX_PAGES; days_back is a query param
  // here too, same as south_africa/colombia above.
  australia: { path: '/ingestion/australia/run?days_back=90', body: {} },
  // DNCP Paraguay — a two-phase fetch internally (buyer/category
  // search, then a capped per-candidate classification detail fetch),
  // so a run genuinely takes 2-3 minutes even for a modest window.
  paraguay: { path: '/ingestion/paraguay/run?days_back=90', body: {} },
};

/**
 * Ticks an elapsed-time counter into an element until stopped.
 * These runs are genuinely slow — CPPP pages sequentially with a
 * deliberate delay to respect the portal's rate limiting — so a
 * visible timer is the difference between "working" and "hung".
 */
function startElapsedTimer(onTick){
  const startedAt = Date.now();
  const format = (ms) => {
    const total = Math.floor(ms / 1000);
    const mins = Math.floor(total / 60);
    const secs = total % 60;
    return mins > 0 ? `${mins}m ${String(secs).padStart(2,'0')}s` : `${secs}s`;
  };
  onTick(format(0));
  const handle = setInterval(() => onTick(format(Date.now() - startedAt)), 1000);
  return {
    stop(){ clearInterval(handle); return format(Date.now() - startedAt); }
  };
}

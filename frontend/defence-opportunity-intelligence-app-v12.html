/* ---------- Fit & Feasibility Score ----------
   A transparent, rules-based readiness signal (app/fit_score.py) —
   deliberately NOT called a "probability": that word implies
   statistical calibration against real historical outcomes, which
   this platform does not have yet (see the disclaimer it always
   ships with, rendered verbatim below rather than paraphrased).
   ---------- */
function renderFitScorePanel(fitScore){
  if(!fitScore) return '';
  const pct = fitScore.score_percent;
  const tone = pct === null ? 'var(--text-faint)' : pct >= 70 ? 'var(--low)' : pct >= 40 ? 'var(--signal)' : 'var(--crit)';
  const restrictionBanner = fitScore.restriction_stated ? `
    <div class="panel" style="border-color:var(--crit);margin-bottom:12px;">
      <b style="color:var(--crit);">⚠ Restriction stated by the source</b>
      <p class="small" style="margin-top:6px;">"${fitScore.restriction_text}" — shown exactly as published. This platform does not determine legal eligibility; confirm with export-control/trade-compliance counsel before proceeding.</p>
    </div>` : '';
  return `
  <div class="section panel" style="margin-bottom:20px;">
    <h3 style="margin-bottom:6px;">Fit &amp; Feasibility Score</h3>
    <p class="small" style="color:var(--text-faint);margin-bottom:14px;">How ready this specific opportunity is, based on real signals already in your matched tender.</p>
    ${restrictionBanner}
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px;">
      <span style="font-size:2.2rem;font-weight:700;color:${tone};">${pct === null ? '—' : pct + '%'}</span>
      <span class="small" style="color:var(--text-faint);">${fitScore.signals_available} of ${fitScore.signals_total} signals available${fitScore.restriction_stated ? ' · capped by stated restriction' : ''}</span>
    </div>
    <div class="table-scroll"><table class="datatable">
      <thead><tr><th>Signal</th><th>Points</th><th>Why</th></tr></thead>
      <tbody>${fitScore.breakdown.map(item => `
        <tr>
          <td class="small"><b>${item.parameter}</b></td>
          <td class="small" style="white-space:nowrap;">${item.points === null ? '<span style="color:var(--text-faint);">n/a</span>' : `${item.points}/${item.max_points}`}</td>
          <td class="small" style="color:var(--text-dim);">${item.note}</td>
        </tr>
      `).join('')}</tbody>
    </table></div>
    <p class="small" style="color:var(--text-faint);margin-top:12px;">${fitScore.disclaimer}</p>
  </div>`;
}

async function loadOpportunityDetail(){
  const container = document.getElementById('opportunityDetailContainer');
  if(!container || !selectedOpportunityId) return;
  try{
    // No dedicated GET single-opportunity route — an empty PATCH
    // changes nothing and simply returns current state (see
    // api/tests/test_engagement_trigger.py, which relies on the
    // same behaviour).
    const opp = await apiFetch(`/opportunities/${selectedOpportunityId}`, {
      method: 'PATCH', body: JSON.stringify({}),
    });
    const history = await apiFetch(`/opportunities/${selectedOpportunityId}/history`);
    // Non-fatal if this fails — the picker just falls back to showing
    // no team options rather than breaking the whole detail view.
    const teamMembers = await apiFetch('/team/members').catch(() => []);

    const daysLeft = (() => {
      if(!opp.response_deadline) return null;
      const d = new Date(opp.response_deadline);
      if(isNaN(d)) return null;
      return Math.ceil((d - new Date()) / (1000*60*60*24));
    })();
    const isUrgent = daysLeft !== null && daysLeft <= 7;
    const isPast = daysLeft !== null && daysLeft < 0;

    container.innerHTML = `
      <div class="section panel" style="margin-bottom:20px;${isUrgent && !isPast ? 'border-color:var(--signal);' : ''}">
        <h3 style="margin-bottom:6px;">Path to Contract</h3>
        <p class="small" style="color:var(--text-faint);margin-bottom:14px;">Everything needed to actually reach and apply for this tender.</p>
        ${opp.programme_name ? `<p style="font-size:.95rem;margin-bottom:10px;"><b>${opp.programme_name}</b></p>` : ''}
        ${(() => {
          // Only real, known data becomes a tile — an empty field is
          // not useful information, so it is not shown at all rather
          // than displayed as "unknown" / "none published" clutter.
          const tiles = [];
          if(daysLeft !== null){
            tiles.push(`<div class="kpi" style="${isUrgent && !isPast ? 'border-color:var(--signal);' : ''}">
              <b style="${isPast ? 'color:var(--crit);' : isUrgent ? 'color:var(--signal);' : ''}">${isPast ? 'Closed' : `${daysLeft}d`}</b>
              <span>${isPast ? 'Deadline passed' : 'Until deadline'}</span>
            </div>`);
          }
          if(opp.set_aside_code){
            tiles.push(`<div class="kpi"><b>${opp.set_aside_code}</b><span>${opp.set_aside_description || 'Eligibility restriction'}</span></div>`);
          }
          if(opp.contact_name || opp.contact_email){
            tiles.push(`<div class="kpi"><b>Yes</b><span>Procurement contact published</span></div>`);
          }
          if(tiles.length === 0) return '';
          return `<div class="grid grid-${Math.min(tiles.length,3)}" style="margin-bottom:14px;">${tiles.join('')}</div>`;
        })()}
        ${isUrgent && !isPast ? `<p class="small" style="color:var(--signal);margin-bottom:12px;"><b>Urgent — ${daysLeft} day${daysLeft===1?'':'s'} left.</b> Prioritise this over opportunities without a near deadline.</p>` : ''}
        ${opp.ui_link
          ? `<button type="button" class="btn btn-primary" id="openBriefingBtn">Read Tender Briefing →</button>
             <p class="small" style="margin-top:8px;color:var(--text-faint);">A one-screen briefing from our side first — status, why it matched you, what's published — then the link through to ${opp.source_name || 'the source portal'}.</p>`
          : (opp.contact_name || opp.contact_email)
            ? `<p class="small" style="color:var(--text-faint);">No direct link published — use the procurement contact below to ask the buyer directly.</p>`
            : (() => {
                // Neither an apply link nor a contact — a real, known
                // gap in what the source itself published (2026-09,
                // a real user question: "what's the use of a lead
                // with no way to act on it?"). Not something this
                // platform can invent, but a search on the notice's
                // own name + buyer is a genuine, low-effort next step
                // rather than a dead end.
                const searchTerms = [opp.programme_name, opp.organization_name, 'tender'].filter(Boolean).join(' ');
                const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(searchTerms);
                return `<p class="small" style="color:var(--text-faint);margin-bottom:8px;">No direct link or contact published by this source for this notice yet.</p>
                        <a href="${searchUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Search for this notice online →</a>`;
              })()}
      </div>
      ${renderFitScorePanel(opp.fit_score)}
      ${opp.stage === 'won' ? `
      <div class="section panel" style="margin-bottom:20px;">
        <h3 style="margin-bottom:6px;">Contract Onboarding Checklist</h3>
        <p class="small" style="color:var(--text-faint);margin-bottom:14px;">
          A general checklist covering what most defence contracts need at onboarding —
          <b>not</b> generated from this specific tender's Scope of Work. Kindly read and
          review the actual SoW thoroughly — requirements vary by source and by programme,
          and this checklist is a starting point, not a substitute for it.
        </p>
        <div id="onboardingChecklist">
          ${ONBOARDING_CHECKLIST_TEMPLATE.map(sec => `
            <div style="margin-bottom:14px;">
              <p class="small" style="font-weight:600;margin-bottom:6px;">${sec.section}</p>
              ${sec.items.map(item => `
                <label style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer;font-size:.9rem;">
                  <input type="checkbox" class="checklistItemCheck" data-item-id="${item.id}" ${(opp.checklist_state || {})[item.id] ? 'checked' : ''} style="margin-top:3px;">
                  <span>${item.label}</span>
                </label>
              `).join('')}
            </div>
          `).join('')}
        </div>
        <p class="small" id="checklistSavedNote" style="color:var(--text-faint);display:none;">Saved.</p>
      </div>` : ''}
      <div class="section panel" style="margin-bottom:20px;">
        <h3 style="margin-bottom:6px;">Manage Opportunity</h3>
        <p class="small" style="color:var(--text-faint);margin-bottom:12px;">Tick the stage you've actually reached — earlier stages fill in automatically. Won and Lost are separate, since either can happen at any point.</p>
        <div id="oppStageStepper" style="display:flex;flex-wrap:wrap;gap:6px 4px;margin-bottom:8px;">
          ${OPPORTUNITY_STAGES.filter(s => s !== 'won' && s !== 'lost').map((s, i) => {
            const currentIdx = OPPORTUNITY_STAGES.indexOf(opp.stage);
            const reached = currentIdx >= 0 && i <= currentIdx;
            return `<label class="tag stage-check-label" data-stage="${s}" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;${reached ? 'background:var(--panel);border-color:var(--hue-cyan);color:var(--hue-cyan);' : ''}">
              <input type="checkbox" class="oppStageCheck" value="${s}" ${reached ? 'checked' : ''} style="margin:0;">
              ${s.replace(/_/g,' ')}
            </label>`;
          }).join('')}
        </div>
        <div class="btn-row" style="margin-bottom:14px;">
          <button type="button" class="btn btn-ghost btn-sm" id="oppMarkWon" style="${opp.stage==='won' ? 'border-color:var(--low);color:var(--low);' : ''}">✓ Mark Won</button>
          <button type="button" class="btn btn-ghost btn-sm" id="oppMarkLost" style="${opp.stage==='lost' ? 'border-color:var(--crit);color:var(--crit);' : ''}">✕ Mark Lost</button>
        </div>
        <input type="hidden" id="oppStageSelect" value="${opp.stage}">
        <div class="form-grid">
          <div class="form-field">
            <label>Owner</label>
            <select id="oppOwner">
              <option value="">Unassigned</option>
              ${teamMembers.map(m => `<option value="${m.id}" ${opp.owner_user_id === m.id ? 'selected' : ''}>${escapeHtml(m.full_name || m.email)}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label>Due Date</label>
            <input type="date" id="oppDueDate" value="${opp.due_date || ''}">
          </div>
        </div>
        <div class="form-field">
          <label>Next Action</label>
          <textarea id="oppNextAction">${opp.next_action || ''}</textarea>
          <p class="small" style="margin-top:6px;color:var(--text-faint);">Leave this as-is when changing stage to get a fresh rules-based suggestion automatically — or edit it yourself to override.</p>
        </div>
        <div class="auth-error" id="oppUpdateError"></div>
        <button class="btn btn-primary" id="oppSaveBtn" style="margin-top:6px;">Save Changes</button>
      </div>
      <div class="section panel" style="margin-bottom:20px;">
        <h3 style="margin-bottom:6px;">Procurement Contact</h3>
        ${(opp.contact_name || opp.contact_email || opp.contact_email_secondary || opp.contact_phone || opp.contact_address) ? `
        <p class="small" style="color:var(--text-faint);margin-bottom:12px;">
          Published by the buyer for this specific tender, so suppliers can ask about it.
          Shown here only, against this one opportunity — deliberately not searchable or
          listed across tenders. Use it for this tender, not for a mailing list.
        </p>
        <table class="datatable">
          <tbody>
            ${opp.contact_name ? `<tr><td style="width:130px;">Name</td><td>${opp.contact_name}</td></tr>` : ''}
            ${opp.contact_email ? `<tr><td>${opp.contact_email_secondary ? 'Email (Primary)' : 'Email'}</td><td><a href="mailto:${opp.contact_email}">${opp.contact_email}</a></td></tr>` : ''}
            ${opp.contact_email_secondary ? `<tr><td>Email (Secondary)</td><td><a href="mailto:${opp.contact_email_secondary}">${opp.contact_email_secondary}</a></td></tr>` : ''}
            ${opp.contact_phone ? `<tr><td>Phone</td><td>${opp.contact_phone}</td></tr>` : ''}
            ${opp.contact_address ? `<tr><td>Address</td><td>${opp.contact_address}</td></tr>` : ''}
          </tbody>
        </table>` : `
        <p class="small" style="color:var(--text-faint);">
          <b style="color:var(--text-dim);">Not published by ${opp.source_name || 'this source'} for this tender.</b> Coverage genuinely differs by source — SAM.gov, UK Find a Tender, ProZorro, Colombia and AusTender publish some contact fields; EU TED does not publish any at this time. This is a stated source gap, not a lookup that failed.
        </p>`}
      </div>
      <div class="section panel">
        <h3 style="margin-bottom:14px;">Engagement History</h3>
        ${history.history.length === 0
          ? '<p class="small">No changes recorded yet — this opportunity is exactly as it was when it was first matched.</p>'
          : `<div class="table-scroll"><table class="datatable">
              <thead><tr><th>When</th><th>What happened</th><th>Stage</th><th>Next Action</th></tr></thead>
              <tbody>${history.history.map(h => {
                // Two kinds of event share this timeline now: a stage
                // change, and opening the tender on the source portal.
                // They're labelled distinctly so reading the tender is
                // never mistaken for having advanced the pipeline.
                const opened = h.action === 'opportunity.tender_opened';
                return `
                <tr>
                  <td class="small">${new Date(h.created_at).toLocaleString()}</td>
                  <td class="small">${opened
                    ? '<span class="tag" style="color:var(--hue-cyan);border-color:var(--hue-cyan);">Opened tender</span>'
                    : '<span class="tag">Stage change</span>'}</td>
                  <td><span class="tag" style="text-transform:capitalize;">${(h.after_state.stage || '').replace(/_/g,' ')}</span></td>
                  <td class="small">${opened
                    ? `${h.after_state.event || '—'}${(opp.tender_opened_count || 0) > 1
                        ? ` <span class="small" style="color:var(--text-faint);">(opened ${tenderOpenSummary(opp)})</span>` : ''}`
                    : (h.after_state.next_action || '—')}</td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>`
        }
      </div>
    `;

    // Stage stepper wiring — checking a box sets that stage and
    // visually fills in every earlier one, since reaching stage N
    // implies stage N-1 already happened. Won/Lost are separate
    // buttons rather than part of the stepper: either can happen
    // from any stage, so they don't fit a linear progress model.
    document.getElementById('openBriefingBtn')?.addEventListener('click', () => showTenderBriefing(opp));

    const stageOrder = OPPORTUNITY_STAGES.filter(s => s !== 'won' && s !== 'lost');
    const stageHiddenInput = document.getElementById('oppStageSelect');
    const wonBtn = document.getElementById('oppMarkWon');
    const lostBtn = document.getElementById('oppMarkLost');

    function paintStage(stage){
      stageHiddenInput.value = stage;
      const idx = stageOrder.indexOf(stage);
      document.querySelectorAll('.stage-check-label').forEach(label => {
        const s = label.dataset.stage;
        const reached = idx >= 0 && stageOrder.indexOf(s) <= idx;
        label.querySelector('input').checked = reached;
        label.style.background = reached ? 'var(--panel)' : '';
        label.style.borderColor = reached ? 'var(--hue-cyan)' : '';
        label.style.color = reached ? 'var(--hue-cyan)' : '';
      });
      wonBtn.style.borderColor = stage === 'won' ? 'var(--low)' : '';
      wonBtn.style.color = stage === 'won' ? 'var(--low)' : '';
      lostBtn.style.borderColor = stage === 'lost' ? 'var(--crit)' : '';
      lostBtn.style.color = stage === 'lost' ? 'var(--crit)' : '';
    }

    document.querySelectorAll('.oppStageCheck').forEach(cb => {
      cb.addEventListener('change', () => paintStage(cb.value));
    });
    async function saveOpportunity(overrideStage){
      const errorBox = document.getElementById('oppUpdateError');
      errorBox.style.display = 'none';
      const newStage = overrideStage || document.getElementById('oppStageSelect').value;
      const newNextAction = document.getElementById('oppNextAction').value;
      const newDueDate = document.getElementById('oppDueDate').value;
      const newOwner = document.getElementById('oppOwner')?.value || null;
      try{
        await apiFetch(`/opportunities/${selectedOpportunityId}`, {
          method: 'PATCH',
          body: JSON.stringify({
            stage: newStage,
            // Only send next_action if the user actually changed it
            // from what was loaded — an unchanged textarea should let
            // the backend auto-suggest a fresh one for the new stage
            // rather than "overriding" with the value that was just
            // displayed as the old suggestion.
            next_action: newNextAction !== (opp.next_action || '') ? newNextAction : null,
            due_date: newDueDate || null,
            owner_user_id: newOwner,
            // owner_user_id: null on its own means "don't touch this
            // field" on the backend (same rule checklist_state
            // follows) — selecting "Unassigned" needs an explicit
            // instruction to actually clear it, not just an absent value.
            clear_owner: !newOwner,
          }),
        });
        await loadOpportunityDetail();
        return true;
      }catch(err){
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        return false;
      }
    }

    // Mark Won / Mark Lost are ACTION buttons, not form fields like
    // the checkboxes — clicking one should DO something immediately,
    // not just paint a pending change that still needs a separate
    // Save click. Saves right away and shows a temporary "Saved" state
    // on the button so the click has visible, immediate feedback.
    async function markStageNow(stage, btn){
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const ok = await saveOpportunity(stage);
      if(!ok){ btn.disabled = false; btn.textContent = original; }
      // On success, loadOpportunityDetail() re-renders this whole
      // panel from the server's new state, so no manual reset needed.
    }
    wonBtn.addEventListener('click', () => markStageNow('won', wonBtn));
    lostBtn.addEventListener('click', () => markStageNow('lost', lostBtn));

    document.getElementById('oppSaveBtn').addEventListener('click', () => saveOpportunity());

    // Onboarding checklist — each checkbox saves immediately (no
    // separate Save button; unlike the stage stepper this isn't a
    // multi-field form, so there's nothing to batch). Sends the full
    // current tick-state of every item, not just the one that
    // changed, since the backend stores checklist_state as a plain
    // replace rather than a merge.
    document.querySelectorAll('.checklistItemCheck').forEach(cb => {
      cb.addEventListener('change', async () => {
        const state = {};
        document.querySelectorAll('.checklistItemCheck').forEach(c => {
          state[c.dataset.itemId] = c.checked;
        });
        try{
          await apiFetch(`/opportunities/${selectedOpportunityId}`, {
            method: 'PATCH',
            body: JSON.stringify({ checklist_state: state }),
          });
          const note = document.getElementById('checklistSavedNote');
          note.style.display = 'block';
          clearTimeout(note._hideTimer);
          note._hideTimer = setTimeout(() => { note.style.display = 'none'; }, 1500);
        }catch(err){
          cb.checked = !cb.checked;
          alert('Could not save checklist: ' + err.message);
        }
      });
    });
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load opportunity: ${err.message}</p>`;
  }
}

/* ============================================================

   source. Who's buying, and what they buy, resolved to your own
   capability taxonomy across three different classification schemes
   (NAICS/CPV/UNSPSC) automatically — see app/customer_intelligence.py
   and app/capability_resolver.py. The original roadmap's Phase 4,
   deliberately deferred in favor of Opportunity Intel, now built.

function renderCustomerIntel(){
  if(selectedCustomerId){
    return `
      <div class="section">
        <button class="btn btn-ghost btn-sm" id="backToCustomersBtn" style="margin-bottom:16px;">← Back to all buyers</button>
        <div id="customerDetailContainer"><p class="small">Loading…</p></div>
      </div>
    `;
  }
  return `
  <div class="section">
    <div class="eyebrow">Real Data — Every Ingested Source</div>
    <h1>Customer Intelligence</h1>
    <p class="lede">Every buying organisation seen across SAM.gov, UK Find a Tender, EU TED, CPPP, CanadaBuys, eTenders South Africa, SECOP II Colombia, ProZorro Ukraine and AusTender Australia, with what each one actually buys resolved against your capability taxonomy — automatically, across NAICS, CPV and UNSPSC.</p>
  </div>
  <div class="section">
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="kpi"><b id="ciKpiTotal">–</b><span>Buying Organisations</span></div>

      <div class="kpi"><b id="ciKpiProgrammes">–</b><span>Total Tenders Tracked</span></div>
    </div>
    <div id="customerIntelContainer" class="panel"><p class="small">Loading…</p></div>

}

async function loadCustomerIntel(){
  const container = document.getElementById('customerIntelContainer');
  if(!container) return;
  try{
    const {customers} = await apiFetch('/intelligence/customers');

    document.getElementById('ciKpiTotal').textContent = customers.length;
    document.getElementById('ciKpiCountries').textContent =
      new Set(customers.map(c => c.country).filter(Boolean)).size;
    document.getElementById('ciKpiProgrammes').textContent =
      customers.reduce((sum, c) => sum + c.programme_count, 0);

    if(customers.length === 0){
      container.innerHTML = '<p class="small">No buying organisations ingested yet — run an ingestion source from Taxonomy Admin → Ingestion Control.</p>';
      return;
    }

    container.innerHTML = `
      <div class="table-scroll">
        <table class="datatable">
          <thead><tr><th>Organisation</th><th>Country</th><th>Sources</th><th>Tenders</th><th>Top Capabilities</th><th></th></tr></thead>
          <tbody>${customers.map(c => `
            <tr>
              <td>${c.organization_name}</td>
              <td class="small">${c.country || '—'}</td>
              <td class="small">${c.sources.join(', ') || '—'}</td>
              <td>${c.programme_count}</td>
              <td class="small">${c.top_capabilities.length
                ? c.top_capabilities.map(t => `${t.label} (${t.count})`).join(', ')
                : '<span style="color:var(--text-faint);">Not yet mapped to a capability</span>'}</td>
              <td><button class="btn btn-ghost btn-sm view-customer-btn" data-id="${c.organization_id}">View →</button></td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>
    `;

    container.querySelectorAll('.view-customer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCustomerId = btn.dataset.id;
        render();
      });
    });
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load customer intelligence: ${err.message}</p>`;
  }
}

async function loadCustomerDetail(){
  const container = document.getElementById('customerDetailContainer');
  if(!container || !selectedCustomerId) return;
  try{
    const c = await apiFetch(`/intelligence/customers/${selectedCustomerId}`);
    container.innerHTML = `
      <h2>${c.organization_name}</h2>
      <p class="small mono">${c.country || 'Country unknown'} · ${c.programme_count} tenders tracked</p>

      <h3 style="margin:18px 0 10px;font-size:.92rem;">Tenders</h3>
      <div class="table-scroll"><table class="datatable">
        <thead><tr><th>Title</th><th>Capability</th><th>Stage</th><th>Closing</th><th>Source</th></tr></thead>
        <tbody>${c.programmes.map(p => `
          <tr>
            <td>${p.name}</td>
            <td class="small">${p.capability_label || '—'}</td>
            <td class="small">${p.stage || '—'}</td>
            <td class="small">${p.response_deadline ? new Date(p.response_deadline).toLocaleString() : '—'}</td>

          </tr>

  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`;
  }
}

function initCustomerIntelHandlers(){
  document.getElementById('backToCustomersBtn')?.addEventListener('click', () => {
    selectedCustomerId = null;
    render();
  });
  if(selectedCustomerId){
    loadCustomerDetail();
  } else {
    loadCustomerIntel();
  }
}

/* ============================================================
   PROCUREMENT INTELLIGENCE — where every ingested programme sits in
   its own government's procurement lifecycle. Shared reference data,
   same access pattern as Customer/OEM Intel. Built from
   app/procurement_intelligence.py.
   ============================================================ */
/* ============================================================
   REPORT INTEL — every engine's real output for ONE product.

   WHY IT IS SCOPED TO A PRODUCT THAT WAS BRIEFED: only a product
   taken all the way through the cycle (added → classified →
   capability confirmed → matched → tender opened from its briefing)
   has actually exercised all ten engines. Showing this for a product
   that stopped at "classified" would render eight empty cards, which
   a customer reads as the engines being broken rather than as their
   own product not having got there yet. The eligible list therefore
   comes from opportunities with tender_opened_count > 0 — a
   server-recorded fact, not a browser guess.

   Everything rendered here comes from GET /products/{id}/intel-report
   — no client-side computation, no filler. An engine with nothing to
   say says so, and says WHY.
   ============================================================ */
let selectedReportProductId = null;

const REPORT_ENGINE_HUES = {
  "01":"cyan", "02":"blue", "03":"teal", "04":"mint", "05":"amber",
  "06":"coral", "07":"violet", "08":"rose", "09":"cyan", "10":"blue",
};

function renderReportIntel(){
  return `
  <div class="section">
    <div class="eyebrow">Real Data — Your Account</div>
    <h1>Report Intel</h1>
    <p class="lede">One product, ten engines, and exactly what each one produced for it. Every figure below is read back from stored rows — if an engine found nothing, it says so and says why rather than filling the space.</p>
  </div>
  <div class="section">
    <div id="reportProductPicker"></div>
  </div>
  <div class="section">
    <div id="reportIntelContainer" class="panel"><p class="small">Loading…</p></div>
  </div>`;
}

function reportCycleStrip(cycle){
  const steps = [
    ['Product added', true],
    ['Classified', cycle.classified],
    ['Capability confirmed', cycle.confirmed],
    ['Programmes matched', cycle.matched],
    ['Tender briefed and opened', cycle.briefed],
  ];
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">${steps.map(([label, done]) => `
    <span class="tag" style="${done ? 'color:var(--hue-mint);border-color:var(--hue-mint);' : 'color:var(--text-faint);'}">
      ${done ? '✓' : '○'} ${label}
    </span>`).join('')}</div>`;
}

// One row of an engine card. `detail` names which of YOUR capability
// areas an award fell in, and `examples` are the real notice titles
// behind the count — a company name with an award count and no
// evidence is exactly the unexplained number this platform avoids.
function reportEngineRow(r, showExamples){
  const examples = (showExamples && r.examples && r.examples.length)
    ? `<div class="small" style="color:var(--text-faint);margin-top:4px;">e.g. ${r.examples.map(x => `“${x}”`).join(' · ')}</div>` : '';
  // Most engines' `value` is short (a score, a count, "87/100") and
  // fits the narrow right-hand column fine. Next-Best-Action's is a
  // full recommendation sentence — forcing that into the same
  // nowrap/right-aligned column is what pushed rows into horizontal
  // scroll (real user-reported layout bug). Long values get their
  // own full-width, wrapping line under the label instead, same
  // pattern as `sub`/`detail`.
  const longValue = typeof r.value === 'string' && r.value.length > 40;
  // A real user-reported confusion (2026-09): a high score here is
  // honest about fit, but says nothing about whether the tender is
  // still biddable — a product could score 9/high on a tender
  // already awarded to someone else, which only became visible by
  // separately checking the Opportunity Dashboard's Historical tab.
  // historical_reason (set by app/product_intel_report.py's
  // _historical_reason, mirroring the dashboard's own
  // isClosedTender/programmeStatusRemark logic exactly) surfaces
  // that same fact right on the row.
  const historicalBadge = r.historical_reason
    ? `<br><span class="small" style="color:var(--crit);">⏹ Historical — ${r.historical_reason}</span>` : '';
  return `<tr>
    <td colspan="${longValue ? 2 : 1}">${r.label}
      ${historicalBadge}
      ${r.sub ? `<br><span class="small" style="color:var(--text-faint);">${r.sub}</span>` : ''}
      ${r.detail ? `<br><span class="small" style="color:var(--hue-mint);">${r.detail}</span>` : ''}
      ${longValue ? `<br><span class="small" style="color:var(--text);">${r.value}</span>` : ''}
      ${examples}
    </td>
    ${longValue ? '' : `<td style="text-align:right;white-space:nowrap;vertical-align:top;">${r.confidence ? `<span class="confidence ${r.confidence}">${r.confidence}</span> ` : ''}<b>${r.value ?? ''}</b></td>`}
  </tr>`;
}

function reportRowsTable(rows, showExamples){
  let lastGroup = null;
  return `<div class="table-scroll"><table class="datatable"><tbody>${rows.map(r => {
    let head = '';
    if(r.group && r.group !== lastGroup){
      lastGroup = r.group;
      head = `<tr><td colspan="2" class="small" style="color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-size:.64rem;padding-top:10px;">${r.group}</td></tr>`;
    }
    return head + reportEngineRow(r, showExamples);
  }).join('')}</tbody></table></div>`;
}

// The headline says "49 companies" — so all 49 have to be reachable,
// the same way the Tenders You've Opened tile opens its own full list.
function showReportEngineDetail(e){
  const capped = e.total_rows > e.rows.length
    ? `<p class="small" style="color:var(--text-faint);margin-top:12px;">Showing the top ${e.rows.length} of ${e.total_rows} — the rest are in the underlying data, trimmed here to keep one report a sensible size.</p>`
    : '';
  showInfoModal(
    `${e.engine} · ${e.title}`,
    `<p class="small" style="margin-bottom:6px;">${e.what_it_does}</p>
     ${e.headline ? `<p style="margin:0 0 12px;"><b>${e.headline}</b></p>` : ''}
     ${reportRowsTable(e.rows, true)}
     ${capped}
     ${e.note ? `<p class="small" style="color:var(--text-faint);margin-top:12px;">${e.note}</p>` : ''}`,
    null, 'Close',
  );
}

function reportEngineCard(e){
  const hue = `var(--hue-${REPORT_ENGINE_HUES[e.engine] || 'cyan'})`;
  // A card that did not run is deliberately NOT styled as an error —
  // "no award published against these tenders yet" is a fact about
  // the market, not a fault, and colouring it red would misreport it.
  const state = e.ran
    ? `<span class="tag" style="color:var(--hue-mint);border-color:var(--hue-mint);">✓ Ran on this product</span>`
    : `<span class="tag" style="color:var(--text-faint);">Nothing to report</span>`;

  const shown = e.rows.slice(0, e.preview || 6);
  const more = e.total_rows - shown.length;
  const rows = shown.length ? reportRowsTable(shown, false) : '';
  const seeAll = more > 0
    ? `<button class="btn btn-ghost btn-sm report-engine-more" data-engine="${e.engine}" style="margin-top:10px;">See all ${e.total_rows} →</button>`
    : '';

  return `
    <div class="panel" style="border-left:3px solid ${hue};margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;font-size:1rem;"><span class="mono" style="color:${hue};">${e.engine}</span> &nbsp;${e.title}</h3>
        ${state}
      </div>
      <p class="small" style="margin:8px 0 10px;color:var(--text-faint);">${e.what_it_does}</p>
      ${e.headline ? `<p style="margin:0 0 10px;"><b style="color:${hue};">${e.headline}</b></p>` : ''}
      ${rows}
      ${seeAll}
      ${e.note ? `<p class="small" style="margin-top:10px;color:var(--text-faint);">${e.note}</p>` : ''}
    </div>`;
}

// A real gap this caught (2026-09): 30,926 opportunities platform-
// wide once sat with no next_action at all, permanently invisible to
// engine 10 (Next-Best-Action never shows what's MISSING, only what
// it produced) — backfilled as a one-time fix, but this card is the
// standing check so the same class of gap can never hide again: it
// renders right after the NBA engine card on every report view, and
// says explicitly whether every live opportunity for this product
// already has a real suggestion behind it.
function reportNbaCoverageCard(c){
  const hasGap = c.live_missing_next_action > 0;
  return `
    <div class="panel" style="border-left:3px solid ${hasGap ? 'var(--signal)' : 'var(--low)'};margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;font-size:1rem;">Next-Best-Action Coverage Check</h3>
        ${hasGap
          ? `<span class="tag" style="color:var(--signal);border-color:var(--signal);">⚠ ${c.live_missing_next_action} gap${c.live_missing_next_action === 1 ? '' : 's'} found</span>`
          : `<span class="tag" style="color:var(--low);border-color:var(--low);">✓ No gap</span>`}
      </div>
      <p class="small" style="margin:8px 0 10px;color:var(--text-faint);">Checks that every LIVE opportunity for this product (not already historical) has a real computed next action — so an opportunity that could have converted into a suggestion never silently falls through.</p>
      <div class="grid grid-4" style="margin:10px 0;">
        <div class="kpi"><b>${c.total_opportunities}</b><span>Total</span></div>
        <div class="kpi"><b>${c.historical_count}</b><span>Historical</span></div>
        <div class="kpi"><b>${c.live_with_next_action}</b><span>Live · Covered</span></div>
        <div class="kpi"><b style="${hasGap ? 'color:var(--signal);' : ''}">${c.live_missing_next_action}</b><span>Live · Gap</span></div>
      </div>
      <p class="small" style="margin-top:10px;color:${hasGap ? 'var(--signal)' : 'var(--text-faint)'};">${c.note}</p>
    </div>`;
}

async function loadReportIntel(){
  const picker = document.getElementById('reportProductPicker');
  const container = document.getElementById('reportIntelContainer');
  if(!picker || !container) return;

  try{
    const opps = await apiFetch('/opportunities');

    // Eligible = completed the cycle. Grouped by product, because one
    // product has many opportunities and the report is per product.
    const byProduct = new Map();
    opps.forEach(o => {
      if(!o.product_id) return;
      const p = byProduct.get(o.product_id) || { id:o.product_id, name:o.product_name, opportunities:0, opened:0 };
      p.opportunities += 1;
      if((o.tender_opened_count || 0) > 0) p.opened += 1;
      byProduct.set(o.product_id, p);
    });
    const eligible = [...byProduct.values()].filter(p => p.opened > 0).sort((a,b) => b.opened - a.opened);

    if(eligible.length === 0){
      picker.innerHTML = '';
      const matched = [...byProduct.values()];
      container.innerHTML = `
        <p class="small"><b style="color:var(--text);">No product has completed the full cycle yet.</b></p>
        <p class="small" style="margin-top:8px;">This report is deliberately limited to a product that has been taken all the way through — added, classified, capability confirmed by a human, matched against real programmes, and then a tender actually opened from its briefing. Only then has every engine genuinely had something to work on; showing it earlier would fill the page with empty cards that look like a broken system rather than an unfinished cycle.</p>
        <p class="small" style="margin-top:8px;">${matched.length
          ? `You have ${matched.length} product${matched.length === 1 ? '' : 's'} with matches. Open one in <b>Opportunity Intel</b>, click <b>Manage → Tender Briefing</b>, and open the tender from there — the report unlocks for that product straight after.`
          : 'Start in <b>My Products</b>: add a product, classify it, confirm a capability, then run a match.'}</p>`;
      return;
    }

    if(!selectedReportProductId || !eligible.some(p => p.id === selectedReportProductId)){
      selectedReportProductId = eligible[0].id;
    }

    picker.innerHTML = eligible.length === 1 ? '' : `
      <div class="panel">
        <p class="small" style="margin-bottom:9px;color:var(--text-faint);">${eligible.length} products have completed the cycle — pick one.</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">${eligible.map(p => `
          <button class="btn ${p.id === selectedReportProductId ? 'btn-primary' : 'btn-ghost'} btn-sm report-product-btn" data-id="${p.id}">
            ${p.name} <span style="opacity:.7;">· ${p.opened} opened</span>
          </button>`).join('')}</div>
      </div>`;

    picker.querySelectorAll('.report-product-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedReportProductId = btn.dataset.id;
        loadReportIntel();
      });
    });

    container.innerHTML = '<p class="small">Running all ten engines…</p>';
    const rep = await apiFetch(`/products/${selectedReportProductId}/intel-report`);

    // Drop the single-panel shell — each engine renders its own panel.
    // (Replacing the element itself would leave the `container`
    // reference in the catch block below pointing at a detached node.)
    container.className = '';
    container.innerHTML = `
        <div class="panel" style="margin-bottom:16px;">
          <div class="eyebrow">${escapeHtml(rep.product.name)}</div>
          <h3 style="margin:4px 0 12px;">${rep.engines_ran} of ${rep.engines_total} engines produced output for this product</h3>
          ${reportCycleStrip(rep.cycle)}
          <p class="small" style="color:var(--text-faint);">
            ${rep.cycle.capabilities_confirmed} confirmed capabilit${rep.cycle.capabilities_confirmed === 1 ? 'y' : 'ies'} ·
            ${rep.cycle.opportunities} matched programme${rep.cycle.opportunities === 1 ? '' : 's'} ·
            ${rep.cycle.tenders_opened} tender${rep.cycle.tenders_opened === 1 ? '' : 's'} opened from a briefing.
            ${rep.engines_ran < rep.engines_total ? `The ${rep.engines_total - rep.engines_ran} engine${rep.engines_total - rep.engines_ran === 1 ? '' : 's'} with nothing to report state the reason on their own card — none of them failed.` : ''}
          </p>
        </div>
        ${rep.engines.map(reportEngineCard).join('')}
        ${reportNbaCoverageCard(rep.nba_coverage)}`;

    container.querySelectorAll('.report-engine-more').forEach(btn => {
      btn.addEventListener('click', () => {
        const engine = rep.engines.find(x => x.engine === btn.dataset.engine);
        if(engine) showReportEngineDetail(engine);
      });
    });
  }catch(e){
    container.className = 'panel';
    container.innerHTML = `<p class="small" style="color:var(--crit);">Could not load the report: ${e.message}</p>`;
  }
}

function renderProcurementIntel(){
  return `
  <div class="section">
    <div class="eyebrow">Real Data — Every Ingested Source</div>
    <h1>Procurement Intelligence</h1>
    <p class="lede">Every ingested tender, placed in its own government's procurement lifecycle — from early concept through to contract award — across every source.</p>
  </div>
  <div class="section">
    <div id="procurementIntelContainer" class="panel"><p class="small">Loading…</p></div>
  </div>`;
}

// stageFunnelRow renders each stage's count as its own clickable
// drill-down cell (see openProgrammeBrowseModal) — sourceName is
// included in the filter/title when this row belongs to a specific
// source's funnel (the "By Source" table), omitted for the overall
// funnel row.
function stageFunnelRow(funnel, total, sourceName){
  return funnel.map(f => {
    const pct = total > 0 ? Math.round((f.count / total) * 100) : 0;
    const stageLabel = STAGE_LABELS[f.stage] || f.stage;
    const title = sourceName ? `${stageLabel} — ${sourceName}` : `${stageLabel} — All Sources`;
    return `<td class="drill-cell" data-stage="${f.stage}"${sourceName ? ` data-source="${sourceName}"` : ''} data-title="${title}" style="cursor:pointer;" title="Click to see the real tenders"><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>${f.count}</td>`;
  }).join('');
}

const STAGE_LABELS = {
  early_concept: 'Early Concept', requirement_defined: 'Requirement Defined',
  rfi_issued: 'RFI Issued', rfp_issued: 'RFP Issued',
  contract_awarded: 'Contract Awarded', in_service: 'In Service',
};

/* ============================================================
   Shared drill-down modal — the real tenders behind any aggregate
   number shown across the intelligence pages (2026-09). A user asked
   for this directly: numbers like "US 403 tenders" or "ROU 2
   tenders" on Procurement/Market Intelligence had no way to see the
   actual tenders behind them. One shared endpoint
   (/intelligence/programmes/browse) and one shared modal renderer —
   every caller just supplies its own filter (country/organization_id/
   winner_organization_id/source_name/stage) and a title.
   ============================================================ */
async function openProgrammeBrowseModal(filters, title){
  const qs = new URLSearchParams(filters).toString();
  try{
    const data = await apiFetch(`/intelligence/programmes/browse?${qs}`);
    const rows = data.programmes || [];
    const bodyHtml = `
      <p class="small" style="color:var(--text-faint);margin-bottom:10px;">
        ${data.total} real tender${data.total === 1 ? '' : 's'} match this${data.total > rows.length ? ` — showing the ${rows.length} most recently updated` : ''}.
      </p>
      ${rows.length ? `
        <div class="table-scroll"><table class="datatable">
          <thead><tr><th>Tender</th><th>Source</th><th>Stage</th><th>Deadline</th></tr></thead>
          <tbody>${rows.map(r => `
            <tr>
              <td>${r.ui_link ? `<a href="${r.ui_link}" target="_blank" rel="noopener">${r.name}</a>` : r.name}</td>
              <td class="small">${r.source_name || '—'}</td>
              <td class="small" style="text-transform:capitalize;">${(r.stage || '—').replace(/_/g,' ')}</td>
              <td class="small">${r.response_deadline ? new Date(r.response_deadline).toLocaleDateString() : '—'}</td>
            </tr>
          `).join('')}</tbody>
        </table></div>
      ` : '<p class="small">No tenders match this filter — see the API response, not necessarily a display error, since counts can shift between page loads on live data.</p>'}
    `;
    showInfoModal(title, bodyHtml);
  }catch(err){
    showInfoModal(title, `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`);
  }
}

// Delegated click handler for any element carrying data-drill (or the
// stage-cell/country-row/source-row conventions below) inside a
// container — attached once per container render, not per row.
function wireDrillDownClicks(container){
  container.querySelectorAll('.drill-cell, .drill-row').forEach(el => {
    el.addEventListener('click', () => {
      const filters = {};
      if(el.dataset.country) filters.country = el.dataset.country;
      if(el.dataset.source) filters.source_name = el.dataset.source;
      if(el.dataset.stage) filters.stage = el.dataset.stage;
      if(el.dataset.organizationId) filters.organization_id = el.dataset.organizationId;
      if(el.dataset.winnerOrganizationId) filters.winner_organization_id = el.dataset.winnerOrganizationId;
      openProgrammeBrowseModal(filters, el.dataset.title || 'Real Tenders');
    });
  });
}

async function loadPresentationStats(){
  // Live figures, so the deck can never quietly drift out of date.
  // Falls back silently to the dashes already in the markup rather
  // than showing an error banner mid-presentation.
  try{
    const [customers, oems, procurement] = await Promise.all([
      apiFetch('/intelligence/customers'),
      apiFetch('/intelligence/oems'),
      apiFetch('/intelligence/procurement'),
    ]);
    const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
    set('psProgrammes', procurement.total_programmes.toLocaleString());
    // country_count, NOT top_countries.length — the latter is capped
    // at 15 for display and would understate coverage.
    set('psCountries', procurement.country_count);
    // Same number, same source — the hero paragraph above used to
    // hardcode its own country count ("six countries") separately
    // from this stat card, and the two drifted apart as sources were
    // added (the hero never got touched). Wiring both to
    // procurement.country_count makes that drift structurally
    // impossible instead of relying on remembering to update two
    // places whenever a source is added.
    set('heroCountryCount', procurement.country_count);
    // Same fix as heroCountryCount above, for the "Live Coverage"
    // section's own separately-hardcoded governments count ("Six
    // governments" -> drifted stale the same way). by_source.length
    // is the real live count of sources with data, same number the
    // Sources KPI elsewhere on this page already uses.
    set('covGovCount', procurement.by_source.length);
    set('covGovCount2', procurement.by_source.length);
    set('psBuyers', customers.customers.length.toLocaleString());
    set('psWinners', oems.oems.length.toLocaleString());

    const container = document.getElementById('presSources');
    if(container){
      const total = procurement.total_programmes || 1;
      container.innerHTML = `
        <div class="table-scroll"><table class="datatable">
          <thead><tr><th>Source</th><th>Tenders</th><th>Share</th></tr></thead>
          <tbody>${procurement.by_source.map(s=>{
            const pct = Math.round((s.total / total) * 100);
            return `<tr>
              <td>${s.source_name}</td>
              <td>${s.total.toLocaleString()}</td>
              <td><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>${pct}%</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`;
    }
  }catch(err){
    const container = document.getElementById('presSources');
    if(container) container.innerHTML = `<p class="small" style="color:var(--text-faint);">Live coverage unavailable — sign in to see current figures.</p>`;
  }
}

async function loadMarkets(){
  const container = document.getElementById('marketsContainer');
  if(!container) return;
  try{
    const {markets} = await apiFetch('/intelligence/markets');

    document.getElementById('mktKpiCountries').textContent = markets.length;
    document.getElementById('mktKpiProgrammes').textContent = markets.reduce((sum, m) => sum + m.programme_count, 0);
    document.getElementById('mktKpiBuyers').textContent = markets.reduce((sum, m) => sum + m.buyer_count, 0);

    if(markets.length === 0){
      container.innerHTML = '<p class="small">No programmes ingested yet — run an ingestion source from Taxonomy Admin → Ingestion Control.</p>';
      return;
    }

    const maxCount = markets[0].programme_count;
    container.innerHTML = `
      <div class="table-scroll">
        <table class="datatable">
          <thead><tr><th>Market</th><th>Tenders Tracked</th><th>Buyers</th><th>Sources</th><th>Top Capabilities</th><th></th></tr></thead>
          <tbody>${markets.map(m => `
            <tr>
              <td>${displayCountryName(m.country)}</td>
              <td><span class="bar-track"><span class="bar-fill" style="width:${Math.round(m.programme_count / maxCount * 100)}%"></span></span>${m.programme_count}</td>
              <td>${m.buyer_count}</td>
              <td class="small">${m.sources.join(', ') || '—'}</td>
              <td class="small">${m.top_capabilities.length
                ? m.top_capabilities.map(t => `${t.label} (${t.count})`).join(', ')
                : '<span style="color:var(--text-faint);">Not yet mapped to a capability</span>'}</td>
              <td><button class="btn btn-ghost btn-sm view-market-btn" data-country="${m.country}">View →</button></td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>
    `;

    container.querySelectorAll('.view-market-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMarketCountry = btn.dataset.country;
        render();
      });
    });
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load market intelligence: ${err.message}</p>`;
  }
}

async function loadMarketDetail(){
  const container = document.getElementById('marketDetailContainer');
  if(!container || !selectedMarketCountry) return;
  try{
    const {markets} = await apiFetch('/intelligence/markets');
    const m = markets.find(x => x.country === selectedMarketCountry);
    if(!m){
      container.innerHTML = '<p class="small">This market has no ingested programmes any more.</p>';
      return;
    }
    // Real tender list (2026-09) — a user asked directly for this:
    // the stage/capability breakdowns below are real aggregates, but
    // there was previously no way to see the actual tenders behind
    // "403 tenders" without a manual database check. Reuses the same
    // shared browse endpoint/modal as Procurement Intelligence.
    const browse = await apiFetch(`/intelligence/programmes/browse?country=${encodeURIComponent(m.country)}&limit=500`);
    container.innerHTML = `
      <h2>${displayCountryName(m.country)}</h2>
      <p class="small mono">${m.programme_count} tenders tracked · ${m.buyer_count} buying organisations</p>
      <h3 style="margin:18px 0 10px;font-size:.92rem;">Procurement Stage Breakdown</h3>
      ${m.stage_breakdown.length ? `
        <div class="table-scroll" style="margin-bottom:20px;"><table class="datatable">
          <thead><tr><th>Stage</th><th>Tenders</th></tr></thead>
          <tbody>${m.stage_breakdown.map(s => `<tr><td style="text-transform:capitalize;">${s.stage.replace(/_/g,' ')}</td><td>${s.count}</td></tr>`).join('')}</tbody>
        </table></div>
      ` : '<p class="small" style="margin-bottom:20px;">No stage data recorded for this market yet.</p>'}
      <h3 style="margin:18px 0 10px;font-size:.92rem;">Top Capabilities In Demand</h3>
      ${m.top_capabilities.length ? `
        <div class="table-scroll" style="margin-bottom:20px;"><table class="datatable">
          <thead><tr><th>Capability</th><th>Tenders</th></tr></thead>
          <tbody>${m.top_capabilities.map(c => `<tr><td>${c.label}</td><td>${c.count}</td></tr>`).join('')}</tbody>
        </table></div>
      ` : '<p class="small" style="margin-bottom:20px;">No tenders from this market resolve to a capability in your taxonomy yet.</p>'}
      <h3 style="margin:18px 0 10px;font-size:.92rem;">Tenders (${browse.total})</h3>
      ${browse.programmes.length ? `
        <div class="table-scroll" style="margin-bottom:20px;"><table class="datatable">
          <thead><tr><th>Tender</th><th>Source</th><th>Stage</th><th>Deadline</th></tr></thead>
          <tbody>${browse.programmes.map(p => `
            <tr>
              <td>${p.ui_link ? `<a href="${p.ui_link}" target="_blank" rel="noopener">${p.name}</a>` : p.name}</td>
              <td class="small">${p.source_name || '—'}</td>
              <td class="small" style="text-transform:capitalize;">${(p.stage || '—').replace(/_/g,' ')}</td>
              <td class="small">${p.response_deadline ? new Date(p.response_deadline).toLocaleDateString() : '—'}</td>
            </tr>
          `).join('')}</tbody>
        </table></div>
        ${browse.total > browse.programmes.length ? `<p class="small" style="color:var(--text-faint);margin-top:-10px;margin-bottom:20px;">Showing the ${browse.programmes.length} most recently updated of ${browse.total} — same real total as the KPI above.</p>` : ''}
      ` : '<p class="small" style="margin-bottom:20px;">No tenders found.</p>'}
      <p class="small" style="color:var(--text-faint);">Sources: ${m.sources.join(', ') || '—'}</p>
    `;
  }catch(err){
    container.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`;
  }
}

/* ============================================================
   COMPANY PROFILE — the identity a defence buyer needs to trust
   before dealing with a vendor: GST/PAN/TAN/IEC, a logo, a public
   "pitch card" that can be shared with anyone (link/WhatsApp)
   without exposing those numbers, and the full picture once a
   viewer has registered — see GET /company/profile, PATCH
   /company/profile, POST /company/profile/regenerate-share-link,
   and the two different-exposure-level routes in app/main.py's
   Company Compliance Profile section. Deliberately ONE page with
   scroll-jump sections (not several separate top-nav tabs), and
   reached via the "Company Profile" button next to Log Out in the
   topbar (see the companyProfileBtn listener) rather than sitting
   in the main mode-switch row — this is account self-management,
   not a content section to browse. Distinct from "⚙ Taxonomy
   Admin" in the main nav, which is the PLATFORM admin's shared-
   taxonomy editor and has nothing to do with any one company's own
   profile.
   ============================================================ */
// Real uploaded photos (a camera shot, a phone screenshot) routinely
// run several MB — a flat "under 200KB" cap on the raw file rejected
// almost anything a real person tried to upload, which is what "it's
// not uploading" actually was. Rather than push that limit onto the
// user, the file is resized/re-encoded client-side (via a <canvas>)
// down to a sensible logo size before it's ever sent — the ORIGINAL
// file can be large, only the RESULT has to fit the server's cap
// (MAX_LOGO_DATA_URL_LEN in main.py — no object storage exists yet,
// see db/migrations/022).
const MAX_LOGO_ORIGINAL_BYTES = 10 * 1024 * 1024; // 10MB — generous, since it never gets stored at this size
const LOGO_MAX_DIMENSION = 480; // px, longest side — comfortably more than this logo is ever displayed at
const LOGO_DATA_URL_CLIENT_CAP = 300_000; // mirrors MAX_LOGO_DATA_URL_LEN server-side, checked here too so a still-too-big result fails fast with a clear message instead of a round trip

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That file does not look like a valid image.'));
      img.onload = () => {
        let { width, height } = img;
        if(width > LOGO_MAX_DIMENSION || height > LOGO_MAX_DIMENSION){
          const scale = LOGO_MAX_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

          const updated = {...p.custom_fields};

          await loadCompanyAdmin();
        });
      });
    }

    const shareSection = document.getElementById('cpShareSection');
    if(shareSection){
      const shareUrl = `${location.origin}${location.pathname}?company=${p.share_token}`;
      const cardText = `${p.name}${p.tagline ? ' — ' + p.tagline : ''}\nView our compliance profile: ${shareUrl}`;
      shareSection.innerHTML = `
        <div class="form-field"><label>Public Link</label><input id="cpShareUrl" type="text" value="${shareUrl}" readonly></div>
        <div class="btn-row" style="margin-top:8px;">
          <button type="button" class="btn btn-ghost btn-sm" id="cpCopyLinkBtn">Copy Link</button>
          <a class="btn btn-primary btn-sm" style="text-decoration:none;" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${encodeURIComponent(cardText)}">Share via WhatsApp</a>
          <button type="button" class="btn btn-ghost btn-sm" id="cpRegenerateBtn" style="color:var(--crit);">Regenerate Link (revokes the old one)</button>

    const el = document.getElementById('cpComplianceForm');
    if(el) el.innerHTML = `<p class="small" style="color:var(--crit);">Failed to load: ${err.message}</p>`;
  }
}

function initCompanyAdminHandlers(){
  document.getElementById('cpwSaveBtn')?.addEventListener('click', async () => {
    const errorBox = document.getElementById('cpwError');
    const successMsg = document.getElementById('cpwSuccess');
    errorBox.style.display = 'none';
    successMsg.style.display = 'none';
    const current = document.getElementById('cpwCurrent').value;
    const next = document.getElementById('cpwNew').value;
    const confirm = document.getElementById('cpwConfirm').value;
    if(next.length < 10){
      errorBox.textContent = 'New password must be at least 10 characters.';
      errorBox.style.display = 'block';
      return;
    }
    if(next !== confirm){
      errorBox.textContent = 'New password and confirmation do not match.';
      errorBox.style.display = 'block';
      return;
    }
    try{
      const result = await apiFetch('/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({ current_password: current, new_password: next }),
      });
      document.getElementById('cpwCurrent').value = '';
      document.getElementById('cpwNew').value = '';
      document.getElementById('cpwConfirm').value = '';
      // session_revoked (2026-09) — changing a password now revokes
      // every session for this account, including the one making
      // this very request (see /auth/change-password's own comment
      // in main.py). The current token is already dead on the server
      // by the time this response comes back, so the only honest
      // next step is a real sign-out, not pretending the session
      // continues — a short delay just lets the success message
      // actually be read before the redirect.
      if(result.session_revoked){
        successMsg.textContent = 'Password updated. Signing you out — please sign in again with your new password.';
        successMsg.style.display = 'block';
        setTimeout(logout, 2000);
      } else {
        successMsg.textContent = 'Password updated.';
        successMsg.style.display = 'block';
      }
    }catch(err){
      errorBox.textContent = err.message || 'Could not update password.';
      errorBox.style.display = 'block';
    }
  });

  document.getElementById('cpResendVerifyBtn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const errorBox = document.getElementById('cpEvError');
    const successMsg = document.getElementById('cpEvSuccess');
    errorBox.style.display = 'none';
    successMsg.style.display = 'none';
    btn.disabled = true;
    try{
      const result = await apiFetch('/auth/resend-verification', { method: 'POST' });
      successMsg.textContent = result.message || 'Verification email sent.';
      successMsg.style.display = 'block';
    }catch(err){
      errorBox.textContent = err.message || 'Could not send verification email.';
      errorBox.style.display = 'block';
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('cpLogoutEverywhereBtn')?.addEventListener('click', async () => {
    const errorBox = document.getElementById('cpSessionsError');
    errorBox.style.display = 'none';
    if(!confirm('Sign out of every device and session, including this one? You will need to sign back in right after.')) return;
    try{
      await apiFetch('/auth/logout-everywhere', { method: 'POST' });
      logout();
    }catch(err){
      errorBox.textContent = err.message || 'Could not sign out other sessions.';
      errorBox.style.display = 'block';
    }
  });

  document.getElementById('cpAddFieldBtn')?.addEventListener('click', async () => {
    const nameEl = document.getElementById('cpNewFieldName');
    const valEl = document.getElementById('cpNewFieldValue');
    const name = nameEl.value.trim();
    const value = valEl.value.trim();
    if(!name || !value) return;
    try{
      const p = await apiFetch('/company/profile');
      const updated = {...p.custom_fields, [name]: value};
      await apiFetch('/company/profile', { method: 'PATCH', body: JSON.stringify({ custom_fields: updated }) });
      nameEl.value = ''; valEl.value = '';
      await loadCompanyAdmin();
    }catch(err){
      const errorBox = document.getElementById('cpUpdateError');
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });

  document.getElementById('cpLogoFile')?.addEventListener('change', async (e) => {
    const errorBox = document.getElementById('cpUpdateError');
    const fileInput = e.target;
    errorBox.style.display = 'none';
    const file = fileInput.files[0];
    if(!file) return;
    if(file.size > MAX_LOGO_ORIGINAL_BYTES){
      errorBox.textContent = 'That file is too large — please use an image under 10MB.';
      errorBox.style.display = 'block';
      fileInput.value = '';
      return;
    }
    try{
      const resized = await resizeImageFile(file);
      if(resized.length > LOGO_DATA_URL_CLIENT_CAP){
        errorBox.textContent = 'Even after resizing, that image is still too large — please try a simpler image (fewer colours/detail compresses better).';
        errorBox.style.display = 'block';
        fileInput.value = '';
        return;
      }
      await apiFetch('/company/profile', {
        method: 'PATCH',
        body: JSON.stringify({ logo_data_url: resized }),
      });
      await loadCompanyAdmin();
      // Refresh currentUser + the topbar badge immediately — without
      // this, a newly-uploaded logo would only appear there after
      // the next login, since currentUser is otherwise a snapshot
      // taken once at session restore.
      await tryRestoreSession();
      showAppShell();
      const note = document.getElementById('cpLogoSavedNote');
      note.style.display = 'block';
      clearTimeout(note._hideTimer);
      note._hideTimer = setTimeout(() => { note.style.display = 'none'; }, 1500);
    }catch(err){
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      fileInput.value = '';
    }
  });

  initUserManagementHandlers();
  loadCompanyAdmin();
}

/* ============================================================
   MFA (Two-Factor Authentication) — the Company Profile page's own
   Security panel above (#cpSecuritySection). Backend: app/mfa.py +
   /auth/mfa/setup, /auth/mfa/enable, /auth/mfa/disable, and the
   second-factor login step at /auth/login/mfa (see renderMfaLoginScreen
   above). A bespoke modal, not showInfoModal — that helper always
   closes on its Continue button before running its callback, which
   doesn't fit a step that needs to stay open and show an inline error
   on a wrong code (setup) or a wrong password (disable).
   ============================================================ */
function _mfaModalOverlay(){
  let overlay = document.getElementById('mfaModalOverlay');
  if(overlay) return overlay;
  overlay = document.createElement('div');
  overlay.className = 'info-modal-overlay';
  overlay.id = 'mfaModalOverlay';
  overlay.innerHTML = `<div class="info-modal" id="mfaModalContent"></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeMfaModal(); });
  return overlay;
}

function closeMfaModal(){
  document.getElementById('mfaModalOverlay')?.remove();
}

// Replaces the modal's content in place (no close/reopen flicker
// between steps) — used for every step of the setup wizard below.
function setMfaModalStep(bodyHtml){
  _mfaModalOverlay();
  const content = document.getElementById('mfaModalContent');
  content.innerHTML = `<button class="info-modal-close" id="mfaModalCloseBtn" aria-label="Close">&times;</button>${bodyHtml}`;
  document.getElementById('mfaModalCloseBtn').addEventListener('click', closeMfaModal);
}

function renderMfaSecuritySection(){
  const enabled = !!currentUser?.mfa_enabled;
  return enabled ? `
    <p class="small" style="color:var(--low);margin-bottom:12px;"><b>● ON</b> — signing in to this account requires a code from your authenticator app, on top of your password.</p>
    <button type="button" class="btn btn-ghost btn-sm" id="mfaDisableBtn" style="color:var(--crit);border-color:var(--crit);">Turn Off Two-Factor Authentication</button>
  ` : `
    <p class="small" style="color:var(--text-faint);margin-bottom:12px;">○ OFF — this account only needs a password to sign in.</p>
    <button type="button" class="btn btn-primary" id="mfaEnableBtn">Enable Two-Factor Authentication</button>
  `;
}

function wireMfaSecurityHandlers(){
  document.getElementById('mfaEnableBtn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try{
      const setup = await apiFetch('/auth/mfa/setup', { method: 'POST' });
      renderMfaSetupStepCode(setup.secret);
    }catch(err){
      alert(err.message || 'Could not start 2FA setup.');
    }finally{
      if(btn) btn.disabled = false;
    }
  });
  document.getElementById('mfaDisableBtn')?.addEventListener('click', openMfaDisableModal);
}

function renderMfaSetupStepCode(secret){
  // Grouped into 4-char blocks purely for readability — the real
  // value sent to the server (via the Copy button and the /auth/mfa
  // routes) is always the ungrouped secret.
  const grouped = (secret.match(/.{1,4}/g) || [secret]).join(' ');
  setMfaModalStep(`
    <h3 style="margin-bottom:6px;">Set up Two-Factor Authentication</h3>
    <p class="small" style="color:var(--text-faint);margin-bottom:14px;">
      Add this account to an authenticator app — Google Authenticator, Authy, 1Password, Microsoft Authenticator, or any app that supports entering a setup key manually — then enter the 6-digit code it shows below.
    </p>
    <div class="form-field">
      <label>Setup Key</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" value="${grouped}" readonly style="font-family:var(--font-mono);letter-spacing:1px;">
        <button type="button" class="btn btn-ghost btn-sm" id="mfaCopySecretBtn">Copy</button>
      </div>
      <p class="small" id="mfaCopySecretNote" style="display:none;margin-top:6px;color:var(--text-faint);">Copied.</p>
    </div>
    <div class="form-field">
      <label>6-digit code from your app</label>
      <input type="text" id="mfaSetupCodeInput" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" autofocus>
    </div>
    <div class="auth-error" id="mfaSetupError"></div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:10px;">
      <button type="button" class="btn btn-ghost" id="mfaSetupCancelBtn">Cancel</button>
      <button type="button" class="btn btn-primary" id="mfaSetupVerifyBtn">Verify &amp; Enable</button>
    </div>
  `);
  document.getElementById('mfaCopySecretBtn').addEventListener('click', () => {
    navigator.clipboard?.writeText(secret);
    const note = document.getElementById('mfaCopySecretNote');
    note.style.display = 'block';
    clearTimeout(note._hideTimer);
    note._hideTimer = setTimeout(() => { note.style.display = 'none'; }, 1500);
  });
  document.getElementById('mfaSetupCancelBtn').addEventListener('click', closeMfaModal);
  document.getElementById('mfaSetupVerifyBtn').addEventListener('click', async () => {
    const code = document.getElementById('mfaSetupCodeInput').value.trim();
    const errorBox = document.getElementById('mfaSetupError');
    errorBox.style.display = 'none';
    try{
      const result = await apiFetch('/auth/mfa/enable', { method: 'POST', body: JSON.stringify({ code }) });
      renderMfaSetupStepBackupCodes(result.backup_codes);
    }catch(err){
      errorBox.textContent = err.message || 'That code did not verify — check your authenticator app and try again.';
      errorBox.style.display = 'block';
    }
  });
}

function renderMfaSetupStepBackupCodes(codes){
  setMfaModalStep(`
    <h3 style="margin-bottom:6px;color:var(--low);">Two-Factor Authentication is now ON</h3>
    <p class="small" style="color:var(--text-faint);margin-bottom:14px;">
      Save these 10 backup codes somewhere safe — a password manager, or printed and locked away. Each one works ONCE, only if you ever lose access to your authenticator app. They will not be shown again after you close this.
    </p>
    <div class="panel" style="font-family:var(--font-mono);font-size:.85rem;line-height:1.9;margin-bottom:14px;background:var(--panel-alt);">
      ${codes.map(c => `<div>${c}</div>`).join('')}
    </div>
    <div class="btn-row" style="margin-bottom:16px;">
      <button type="button" class="btn btn-ghost btn-sm" id="mfaCopyBackupCodesBtn">Copy All</button>
      <button type="button" class="btn btn-ghost btn-sm" id="mfaDownloadBackupCodesBtn">Download</button>
      <button type="button" class="btn btn-ghost btn-sm" id="mfaPrintBackupCodesBtn">Print</button>
    </div>
    <label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:16px;cursor:pointer;">
      <input type="checkbox" id="mfaBackupAckCheckbox" style="margin-top:3px;">
      I've saved these codes somewhere safe.
    </label>
    <div class="btn-row" style="justify-content:flex-end;">
      <button type="button" class="btn btn-primary" id="mfaBackupDoneBtn" disabled>Done</button>
    </div>
  `);
  document.getElementById('mfaCopyBackupCodesBtn').addEventListener('click', () => {
    navigator.clipboard?.writeText(codes.join('\n'));
  });
  document.getElementById('mfaDownloadBackupCodesBtn').addEventListener('click', () => {
    downloadMfaBackupCodes(codes);
  });
  document.getElementById('mfaPrintBackupCodesBtn').addEventListener('click', () => {
    printMfaBackupCodes(codes);
  });
  const checkbox = document.getElementById('mfaBackupAckCheckbox');
  const doneBtn = document.getElementById('mfaBackupDoneBtn');
  checkbox.addEventListener('change', () => { doneBtn.disabled = !checkbox.checked; });
  doneBtn.addEventListener('click', async () => {
    closeMfaModal();
    await tryRestoreSession(); // refreshes currentUser.mfa_enabled
    await loadCompanyAdmin();  // re-renders the Security panel as ON
  });
}

// Both take the same plaintext codes the "Copy All" button already
// gets, from the SAME one-time response — nothing here re-fetches
// or re-derives them, since they're never retrievable again after
// this screen closes (see app/mfa.py: only their hashes persist).
function downloadMfaBackupCodes(codes){
  const body = [
    'Defence Opportunity Intelligence — Two-Factor Authentication backup codes',
    `Generated ${new Date().toLocaleString()}`,
    'Each code works ONCE, only if you lose access to your authenticator app.',
    '',
    ...codes,
  ].join('\n');
  const blob = new Blob([body], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'defence-oi-backup-codes.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function printMfaBackupCodes(codes){
  const win = window.open('', '_blank', 'width=480,height=640');
  if(!win){ alert('Please allow pop-ups to print these codes.'); return; }
  win.document.write(`
    <!doctype html><html><head><title>Defence OI — 2FA Backup Codes</title>
    <style>
      body{font-family:monospace;padding:32px;color:#111;}
      h1{font-size:1rem;margin-bottom:4px;}
      p{font-size:.8rem;color:#555;margin:2px 0 20px;}
      div.code{font-size:1rem;line-height:2;letter-spacing:1px;}
    </style></head><body>
    <h1>Defence Opportunity Intelligence — 2FA Backup Codes</h1>
    <p>Generated ${new Date().toLocaleString()} — each code works ONCE, only if you lose access to your authenticator app.</p>
    ${codes.map(c => `<div class="code">${c}</div>`).join('')}
    </body></html>
  `);
  win.document.close();
  win.focus();
  win.print();
}

function openMfaDisableModal(){
  setMfaModalStep(`
    <h3 style="margin-bottom:6px;">Turn off Two-Factor Authentication</h3>
    <p class="small" style="color:var(--text-faint);margin-bottom:14px;">
      Enter your password to confirm. This removes the extra sign-in step — anyone who has just your password will be able to sign in afterward.
    </p>
    <div class="form-field"><label>Password</label><input type="password" id="mfaDisablePasswordInput" autofocus></div>
    <div class="auth-error" id="mfaDisableError"></div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:10px;">
      <button type="button" class="btn btn-ghost" id="mfaDisableCancelBtn">Cancel</button>
      <button type="button" class="btn btn-primary" style="background:var(--crit);border-color:var(--crit);" id="mfaDisableConfirmBtn">Turn Off 2FA</button>
    </div>
  `);
  document.getElementById('mfaDisableCancelBtn').addEventListener('click', closeMfaModal);
  document.getElementById('mfaDisableConfirmBtn').addEventListener('click', async () => {
    const password = document.getElementById('mfaDisablePasswordInput').value;
    const errorBox = document.getElementById('mfaDisableError');
    errorBox.style.display = 'none';
    try{
      await apiFetch('/auth/mfa/disable', { method: 'POST', body: JSON.stringify({ password }) });
      closeMfaModal();
      await tryRestoreSession();
      await loadCompanyAdmin();
    }catch(err){
      errorBox.textContent = err.message || 'Incorrect password.';
      errorBox.style.display = 'block';
    }
  });
}

/* ============================================================
   THEME — persists via window.storage
   ============================================================ */
async function loadTheme(){
  let theme='dark';
  try{ const res = await window.storage.get('doi-theme'); if(res && res.value) theme = res.value; }catch(e){}
  applyTheme(theme);
}
function applyTheme(theme){
  if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}
async function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme')==='light';
  const next = isLight?'dark':'light';
  applyTheme(next);
  try{ await window.storage.set('doi-theme', next); }catch(e){}
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('sidebarToggle').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('companyProfileBtn').addEventListener('click', () => {
  appMode = 'company-admin';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('topSignInBtn').addEventListener('click', () => {
  showAuthOverlay();
  renderAuthScreen('login');
});
document.getElementById('topSignUpBtn').addEventListener('click', () => {
  showAuthOverlay();
  renderAuthScreen('signup');
});

loadTheme();
boot();
